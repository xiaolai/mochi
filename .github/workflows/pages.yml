# Publish moch.im.
#
# ## The page is assembled here, not committed
#
# `site/` holds an index and a CNAME. Everything else it shows — her pictures and
# the engine that animates her — is copied in by this job from `assets/` and from
# a fresh `dist/`. Committing a second copy of either would let the page drift
# from the package it is advertising, which is the same one-graphical-source rule
# the old page stated and then outlived: every image is generated by the rig that
# draws her, never drawn by eye.
#
# ## The demo is the real element
#
# `dist/` is copied in whole and loaded natively. That works because every
# emitted import is relative and carries a `.js` extension — the same property
# that makes the package importable from plain Node — so no bundler is involved
# and what the page runs is exactly what npm ships. It is also the only place the
# custom element is exercised in a real browser.
#
# ## Fail closed
#
# The asserts below are the point of this file. A page that deploys with a
# missing image is worse than one that fails to deploy, because nobody is told.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/**'
      - 'src/**'
      - 'scripts/hero.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The page ships the engine, so the engine has to be green to ship.
      - run: pnpm verify

      # The engine goes in a directory named for its version, and the page is
      # rewritten to point at it.
      #
      # GitHub Pages serves HTML at max-age=600 and assets at max-age=14400, so
      # the page refreshes twenty-four times faster than the code it loads.
      # Every deploy therefore has a window, up to four hours wide, in which a
      # visitor runs NEW html against OLD javascript. That is not a rare race;
      # it is the guaranteed state immediately after every deploy, and it showed
      # the first time the page began relying on the two agreeing: new html that
      # had stopped naming a face, old javascript whose default was still the
      # generic body, and a stranger on her own front page.
      #
      # A query string on the entry does not fix it. `element/index.js?v=x`
      # still reaches `./dough-avatar.js` by a plain relative path, and that one
      # comes from cache. Only a different DIRECTORY moves every transitive
      # import at once.
      - name: assemble the page
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "ENGINE_DIR=dough-$version" >> "$GITHUB_ENV"
          mkdir -p site/art "site/dough-$version"
          cp -r dist/* "site/dough-$version/"
          cp assets/mochi-alive.png assets/expressions.png assets/colourways.png assets/icon.png site/art/
          # index.html names ./dough/ so it works when copied by hand for local
          # preview; the deployed copy is pinned to the version it was built with.
          sed -i "s|\./dough/|./dough-$version/|g" site/index.html

      - name: everything the page references exists
        run: |
          fail=0
          for f in art/mochi-alive.png art/expressions.png art/colourways.png art/icon.png \
                   "$ENGINE_DIR/element/index.js" "$ENGINE_DIR/index.js"; do
            [ -f "site/$f" ] || { echo "::error::site/$f is missing"; fail=1; }
          done

          # Every local src= and href= in the page, checked against the tree.
          grep -oE '(src|href)="[^"h][^"]*"' site/index.html \
            | sed -E 's/.*="([^"]*)".*/\1/' | sort -u | while read -r ref; do
              [ -f "site/$ref" ] || { echo "::error::index.html references missing site/$ref"; exit 1; }
            done || fail=1

          # The rewrite must have happened. An unversioned ./dough/ reference
          # left in the deployed page is the stale-cache bug coming back.
          if grep -q './dough/' site/index.html; then
            echo "::error::index.html still references the unversioned ./dough/"
            fail=1
          fi

          # A CNAME edited to something else is a silent redirect of the whole site.
          domain=$(tr -d '[:space:]' < site/CNAME)
          if [ "$domain" != "moch.im" ]; then
            echo "::error file=site/CNAME::CNAME says '$domain', this workflow publishes moch.im"
            fail=1
          fi

          # The page must not promise what no longer exists. The app is retired;
          # if a future edit re-adds a download button, this is where it stops.
          if grep -qiE '(download|install)[^<]*\.dmg' site/index.html; then
            echo "::error::the page offers a .dmg — the app is retired, link the release instead"
            fail=1
          fi

          exit "$fail"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
