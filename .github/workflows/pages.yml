# Publish moch.im.
#
# ## The page is assembled here, not committed
#
# `site/` holds an index and a CNAME. Everything else it shows — her pictures and
# the engine that animates her — is copied in by this job from `assets/` and from
# a fresh `dist/`. Committing a second copy of either would let the page drift
# from the package it is advertising, which is the same one-graphical-source rule
# the old page stated and then outlived: every image is generated by the rig that
# draws her, never drawn by eye.
#
# ## The demo is the real element
#
# `dist/` is copied in whole and loaded natively. That works because every
# emitted import is relative and carries a `.js` extension — the same property
# that makes the package importable from plain Node — so no bundler is involved
# and what the page runs is exactly what npm ships. It is also the only place the
# custom element is exercised in a real browser.
#
# ## Fail closed
#
# The asserts below are the point of this file. A page that deploys with a
# missing image is worse than one that fails to deploy, because nobody is told.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/**'
      - 'src/**'
      - 'scripts/hero.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The page ships the engine, so the engine has to be green to ship.
      - run: pnpm verify

      - name: assemble the page
        run: |
          mkdir -p site/art site/dough
          cp -r dist/* site/dough/
          cp assets/mochi-alive.png assets/expressions.png assets/colourways.png assets/icon.png site/art/

      - name: everything the page references exists
        run: |
          fail=0
          for f in art/mochi-alive.png art/expressions.png art/colourways.png art/icon.png \
                   dough/element/index.js dough/index.js; do
            [ -f "site/$f" ] || { echo "::error::site/$f is missing"; fail=1; }
          done

          # Every local src= and href= in the page, checked against the tree.
          grep -oE '(src|href)="[^"h][^"]*"' site/index.html \
            | sed -E 's/.*="([^"]*)".*/\1/' | sort -u | while read -r ref; do
              [ -f "site/$ref" ] || { echo "::error::index.html references missing site/$ref"; exit 1; }
            done || fail=1

          # A CNAME edited to something else is a silent redirect of the whole site.
          domain=$(tr -d '[:space:]' < site/CNAME)
          if [ "$domain" != "moch.im" ]; then
            echo "::error file=site/CNAME::CNAME says '$domain', this workflow publishes moch.im"
            fail=1
          fi

          # The page must not promise what no longer exists. The app is retired;
          # if a future edit re-adds a download button, this is where it stops.
          if grep -qiE '(download|install)[^<]*\.dmg' site/index.html; then
            echo "::error::the page offers a .dmg — the app is retired, link the release instead"
            fail=1
          fi

          exit "$fail"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
