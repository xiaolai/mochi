# Run the gates: prettier --check → oxlint --type-aware → tsc → vitest → build.
#
# ## Ubuntu now, and the reason is finally allowed
#
# This ran on macOS because that was what `electron-builder` packaged for. The
# app is retired and lives on `archive/app`; nothing left in this repository is
# platform-sensitive — prettier, oxlint, tsc and vitest are pure, and
# `@napi-rs/canvas` ships a prebuilt binary per platform. The old file already
# said this move was defensible "whenever somebody wants it, on that reasoning
# rather than the deleted one". This is that.
#
# ## Fail closed
#
# No `continue-on-error`, no `|| true`, no step that swallows a non-zero exit.
# A workflow that cannot fail is not a check.

name: verify

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # BEFORE `setup-node`, because `cache: pnpm` needs pnpm to already exist
      # to locate its store. The version is not written here: `action-setup`
      # reads `packageManager` from `package.json`, so the pin lives in one
      # place and this file cannot drift from it.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # `--frozen-lockfile` so a lockfile that does not match `package.json`
      # fails here, loudly, instead of resolving to something nobody tested.
      - run: pnpm install --frozen-lockfile

      # `verify` ends in `build`, so a package that typechecks but does not
      # emit cannot pass.
      - run: pnpm verify

      # What the audit actually caught: the manifest pointed at TypeScript that
      # Node could not load. Importing the built entry from plain Node — no
      # bundler, no loader — is the only check that would have failed then.
      - name: the built package imports under plain Node
        run: node --input-type=module -e "import('./dist/index.js').then(m => { if (!m.MOCHI || !m.DoughAvatar) throw new Error('public surface missing from the build'); })"
