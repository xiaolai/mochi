# How this becomes something somebody else can open.
#
# `electron-vite build` produces JavaScript in `out/`; it does not produce a
# bundle. This is the step that makes a `.app` and a `.dmg`, and it is also the
# step that decides whether Gatekeeper will let either of them run -- signing is
# not a thing you add afterwards, it is a property of how the bundle is built.
#
# ## The order the pipeline runs in, and why it cannot be rearranged
#
#   build → sign nested binaries inside-out → sign the .app → notarize + staple
#   the .app → build the .dmg from the stapled .app → sign the .dmg → notarize +
#   staple the .dmg
#
# electron-builder does MOST of that in one pass, which is most of the reason to
# use it rather than hand-rolled scripts: signing the app after building the dmg
# means the dmg contains the unsigned app, and nothing about the build output
# says so.
#
# ## The two steps it does NOT do, measured rather than assumed
#
# This said "all of that" and it is not all of it. `notarizeIfProvided` is called
# from `macPackager` and from the `pkg` target and from nowhere else, so the
# `.app` is notarized and stapled -- `@electron/notarize` staples, with three
# retries of its own -- and the `.dmg` is SIGNED and never notarized.
#
# A dmg with no ticket reads `rejected / Unnotarized Developer ID`, and the dmg is
# the artifact a person actually downloads and double-clicks. `release.yml`
# submits and staples the disk images itself once this has run, and
# `scripts/verify-signing.sh` fails the release if either half is missing. Do not
# delete that step believing this file covers it.
#
# ## Notarization is DECLARED here and not yet run
#
# `notarize: false` below. Everything else is wired, so turning it on is one
# line plus a keychain profile -- but submitting uploads the binary to Apple,
# which is outward-facing and is the user's call to make, not a side effect of
# running a build script.

appId: com.mochi.companion
# The SAME string as `APP_USER_MODEL_ID` in `main/index.ts`. Two spellings of an
# application's identity is how a notification arrives attributed to nothing and
# a Windows taskbar groups it under its own second entry.
productName: Mochi
copyright: © HANDO K.K.

directories:
  output: release
  buildResources: build

# What goes INSIDE the bundle.
#
# `out/**` is the compiled application. `package.json` is required by Electron
# itself to find the entry point. Nothing else: source, tests, docs and spikes
# have no business in a shipped binary, and every file included is a file that
# has to be signed and scanned.
files:
  - out/**
  - package.json

# What sits BESIDE it, in `Contents/Resources`.
#
# Not `files`, because the code that reads them resolves through
# `process.resourcesPath` when packaged, and the asar is not a directory that
# path can reach. The tray failure this prevents is not cosmetic: an invisible
# tray icon is an app nobody can quit.
#
# `tray.ts` consumes these now -- this note said "nothing consumes these yet"
# until the v2 tray landed and was not updated with it.
#
# The generator is back, and `resources/` is GENERATED -- do not hand-edit it.
# `pnpm icons` writes every file here from an SVG emitted by `rig/svg.ts`, whose
# outline comes from `domeOutline`, the function that draws her on screen. So the
# handoff's claim that the mark and the mochi "cannot drift" is finally true
# rather than merely unfalsified.
#
# Two tests, asking different questions. `icons.test.ts` compares each committed
# file with what the generator emits today, byte for byte -- `pnpm icons` is the
# fix when it fails. `shipped-icons.test.ts` keeps measuring the assets against
# the rig with a tolerance, which still catches somebody hand-editing a file to
# match a generator that is itself wrong.
#
# Eight of the tray files -- `trayWin-onLight-*` -- are copied by this block and
# selected by no code path, because the Windows taskbar-theme query was not
# carried over. `tray-assets.test.ts` names them so the set cannot grow quietly.
extraResources:
  - from: resources/tray
    to: tray
  - from: resources/icons
    to: icons
  # Capabilities are NOT here. They were loose JSON beside the bundle, read at
  # runtime through `process.resourcesPath`, on the argument that the built-ins
  # should travel the same path a downloaded capability would. There is no
  # downloaded capability: this project is forked and built, so a capability is
  # a folder under `src/capabilities/` and the compiler collects it. Nothing to
  # ship beside the bundle, and nothing to reach.

mac:
  category: public.app-category.productivity
  # Generated from the 1024px PNG the icon pipeline already emits, so there is
  # still ONE graphical source -- the `.icns` is derived,
  # never hand-maintained beside it.
  icon: resources/icons/1024x1024.png
  target:
    # Both, and the zip is not redundant: an updater consumes the zip, and a dmg
    # is what a person downloads. Shipping only the dmg means adding auto-update
    # later requires re-cutting every past release.
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

  # Non-negotiable for notarization: Apple refuses a submission without it.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # `false` because the check is run explicitly afterwards, against the real
  # artifact, by `scripts/verify-signing.sh`. electron-builder's own assessment
  # runs before the dmg exists and so cannot say anything about it.
  gatekeeperAssess: false

  extendInfo:
    # The sentence macOS shows when it asks. Without it the permission dialog
    # never appears and the microphone simply never opens -- which presents as
    # "she cannot hear me", not as a missing plist key.
    NSMicrophoneUsageDescription: Mochi listens so you can talk to her.
    # She is an accessory: `main/index.ts` sets that activation policy at
    # startup, and declaring it here is what keeps a Dock icon from appearing
    # for the moment before it runs.
    LSUIElement: true

  # Signing identity comes from the keychain rather than from this file. There is
  # exactly one Developer ID Application certificate on a normal machine and
  # electron-builder finds it; naming it here would pin a build to one developer's
  # keychain and break on everybody else's.
  #
  # Notarization: OFF until somebody decides to submit, and that decision is
  # deliberately not a side effect of running a build script — submitting
  # uploads the binary to Apple.
  #
  # Everything that CAN be prepared without making that decision has been.
  # The team id is NOT written here, and that is deliberate rather than an
  # omission: it identifies whoever signs this build, it is different for
  # everybody who forks it, and a value committed once is a value that stays in
  # the history of a public repository. Read it off the machine that will do the
  # signing instead — it is the parenthesised string in the identity name:
  #
  #     security find-identity -v -p codesigning
  #     #   1) ABC123... "Developer ID Application: Your Name (TEAMID1234)"
  #
  # Then, with that value:
  #
  #     xcrun notarytool store-credentials mochi \
  #       --apple-id <your Apple ID> --team-id <TEAMID> --password <app-specific password>
  #
  # and replace the line below with:
  #
  #     notarize: { teamId: <TEAMID> }
  #
  # The app-specific password is made at appleid.apple.com and is the one part
  # nobody else can do for you, which is why this line is still `false`.
  #
  # Nothing ships quietly in the meantime: `scripts/verify-signing.sh` fails on a
  # missing stapled ticket and tells `Notarized Developer ID` apart from
  # `Unnotarized Developer ID`, and exits non-zero — measured.
  notarize: false

dmg:
  # Named so a download folder stays legible: `Mochi-0.0.1-arm64.dmg`.
  artifactName: ${productName}-${version}-${arch}.${ext}
  # electron-builder defaults this to FALSE, and the default is wrong for
  # distribution: verification of the first build reported the dmg as
  # `no usable signature`. A stapled app inside an unsigned disk image is not
  # enough — the image is what the user downloads and double-clicks, and
  # Gatekeeper judges it on its own terms.
  sign: true

win:
  target: nsis
  icon: resources/icons/1024x1024.png

linux:
  target: AppImage
  category: Utility
  icon: resources/icons
