<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mochi</title>
    <!--
      The same sheet the other two windows load. She went without one for the
      whole of this build, which is how her canvas colours drifted a digit off
      `--paper` and a whole colour off `--ink`, and how she ended up with no dark
      half in the window where the desktop's scheme is most visible. `resolve.ts`
      reads the used values back out of it, because a canvas cannot take a
      custom property.
    -->
    <link rel="stylesheet" href="../design/tokens.css" />
    <style>
      /*
        Transparent all the way down. `background: transparent` on the window is
        not enough — html and body carry a white background by default, and the
        result is a white square with a mochi in it, which looks exactly like a
        broken transparent window rather than like a missing stylesheet.
      */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        /* Nothing here is text to select, and a drag-select on a companion is
           a stray highlight that never goes away. */
        user-select: none;
        cursor: default;
      }
      #face {
        display: block;
        width: 100%;
        height: 100%;
      }
      /*
        The one line of text, for the states before she can be drawn -- and the
        only words this window ever ships.

        It gets its own opaque surface, which is the rule the bubble and the chip
        already follow and this line did not: she may be sitting on anything, a
        photograph included, so 45%-black text with a white shadow painted
        straight onto the wallpaper has no contrast guarantee whatsoever. It was
        also the state every cold start and every failure to draw shows.

        `fit-content` and an auto margin, so the surface is the width of the
        words rather than the width of the window.
      */
      #app {
        position: absolute;
        inset: auto 0 6px 0;
        width: fit-content;
        max-width: calc(100% - var(--s3));
        margin-inline: auto;
        padding: var(--s0) var(--s3);
        border-radius: var(--r-pill);
        background: var(--paper);
        box-shadow: var(--lift-1);
        color: var(--ink-2);
        font: var(--t-micro) / 1.4 var(--sans);
        text-align: center;
      }
      /*
        Required, not tidiness. `describe('listening')` returns the empty string
        on purpose -- there is no label worth writing under a face that is
        plainly listening -- and before this line had a surface, empty simply
        drew nothing. A pill that stayed under her for the whole session would be
        a regression introduced by fixing the contrast.
      */
      #app:empty {
        display: none;
      }
    </style>
    <!--
      There is no Content-Security-Policy here yet, and that is a named gap
      rather than an oversight.

      This document is loaded two ways: from the electron-vite dev server over
      http, and from disk over file:// in a build. `'self'` does not mean the
      same thing in both, so a policy checked only in development ships a control
      that is silently absent in the thing people actually run — which is worse
      than no policy, because it reads as solved. Whatever lands here has to be
      exercised in both modes first.
    -->
  </head>
  <body>
    <canvas id="face"></canvas>
    <main id="app">starting…</main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
