<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shelf</title>
    <link rel="stylesheet" href="../design/tokens.css" />
    <style>
      /*
        1a, at 1440 x 900: her state, her characters, the one that is open.

        The layout is the artifact's — a state strip that is always first, a row
        of character cards, then a 1fr/380px body with the open character on the
        left and an inspector on the right. What fills it is only what this
        build can actually do: the artifact draws a command palette, an
        installer and per-character session stats, and drawing chrome for a
        feature that does not exist is the same failure as offering her a tool
        she cannot call.

        Every value is a token, for the reason `tokens.css` gives: a literal
        here is a place this window and the design can drift without either of
        them looking wrong.
      */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        font: var(--t-ui) / 1.5 var(--sans);
        user-select: none;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* ---- the strip that is always first ---------------------------------- */
      .topbar-context {
        flex: none;
        display: flex;
        align-items: center;
        min-width: 0;
      }
      .topbar-context input[type='search'] {
        width: 340px;
        padding: var(--s1) var(--s4);
        border: 1px solid var(--rule);
        border-radius: var(--r-pill);
        background: var(--paper);
        color: inherit;
        font: inherit;
        font-size: var(--t-sm);
      }
      .topbar {
        flex: none;
        height: 60px;
        display: flex;
        align-items: center;
        gap: var(--s4);
        padding: 0 var(--s6);
        background: var(--paper-2);
        border-bottom: 1px solid var(--rule);
      }
      .topbar .divider {
        margin-inline: var(--s2);
      }
      /* Her face beside the wordmark, as the artifact draws it. */
      .mark {
        flex: none;
        display: block;
      }
      .wordmark {
        font-family: var(--narrow);
        font-weight: 700;
        font-size: var(--t-body);
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .divider {
        width: 1px;
        height: 22px;
        background: var(--rule);
      }
      .state {
        display: flex;
        align-items: baseline;
        gap: var(--s4);
      }
      .state .what {
        font-family: var(--narrow);
        font-size: var(--t-data);
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .state .how {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-2);
      }
      /*
        The microphone, as a pill you cannot miss. Green when it is open,
        because that is the state worth seeing from across a desk.
      */
      .pill {
        display: flex;
        align-items: center;
        flex: none;
        white-space: nowrap;
        gap: var(--s3);
        padding: var(--s0) var(--s3);
        border: 1px solid var(--rule);
        border-radius: var(--r-pill);
        background: var(--paper);
        font-family: var(--narrow);
        font-size: var(--t-data);
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-2);
      }
      .pill .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ink-3);
        flex: none;
      }
      .pill.open {
        color: var(--ink-brand);
        border-color: var(--her);
      }
      .pill.open .dot {
        background: var(--her);
      }
      .grow {
        flex: 1;
      }
      .stat {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }

      /* ---- the three named places ------------------------------------------ */
      /*
        A tab strip under the state bar, not beside the content. The window has
        one subject at a time now, so the switch belongs where a window title
        would be rather than inside either pane.
      */
      .shell-tabs {
        flex: none;
        display: flex;
        align-items: center;
        gap: var(--s1);
      }
      .shell-tab {
        padding: var(--s1) var(--s4);
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: var(--r-pill);
        background: transparent;
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: 700;
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--ink-3);
        cursor: default;
      }
      .shell-tab:hover {
        color: var(--ink-2);
      }
      /*
        Her colour, because which place you are in is chrome — and this palette's
        chrome has no hue of its own. `--her-deep` is the one that carries it.
      */
      /*
        A FILLED pill in her colour, not an underline.

        The underline was right while this strip was a row of its own; in the
        title strip it competes with the rule under it. Filled says "you are
        here" at a glance, and `--her-deep` is the token that exists so her
        colour can carry white — swept for every theme and refused by
        `contrastFailures` for a hue it would fail on.
      */
      .shell-tab[aria-current='true'] {
        background: var(--her-deep);
        color: var(--her-deep-ink);
        border-bottom-color: transparent;
      }
      /* Each pane owns the whole window under the strip. */
      .tab-pane {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      /* ---- archive: search first, one conversation at a time ---------------- */
      .archive {
        padding: var(--s5) var(--s6) 0;
        gap: var(--s5);
      }
      .archive > .search {
        flex: none;
      }
      .archive-body {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: var(--s6);
      }
      .archive-body > .list {
        border: 1px solid var(--rule);
        border-radius: var(--r3);
        background: var(--paper-2);
        margin: 0;
        overflow-y: auto;
      }
      .archive-body > .list .entry:first-child {
        border-top: 0;
      }
      /* The transcript column: its own scroll, clear of the drawer's hairline. */
      #talk {
        min-height: 0;
        overflow-y: auto;
        padding-right: var(--s4);
        margin-bottom: calc(var(--s6) * -1);
        padding-bottom: var(--s6);
      }

      /* ---- machine: the six groups, as they were ---------------------------- */
      .machine {
        display: grid;
        grid-template-columns: 196px minmax(0, 1fr) 320px;
        min-height: 0;
      }
      .nav-head {
        padding: 0 var(--s4) var(--s3);
      }
      /* The tool list, beside the grants that decide which rows it has. */
      .machine-tools {
        min-height: 0;
        overflow-y: auto;
        padding: var(--s5) var(--s6) var(--s6) 0;
      }
      /*
        NOT `.card`, which in this window means a CHARACTER card.
        
        It was, for one build. `.card .name` sets `--t-h3` for a character's
        name, so every tool name rendered at 21px and `recall_conversations`
        wrapped mid-word. Measured, not noticed: 21px where 13 was asked for.
        The third collision this window has had from a generic class name, and
        the reason `stylesheets.test.ts` checks the ones the renderer creates.
      */
      .machine-tools > .tool-card {
        background: var(--paper-2);
        border: 1px solid var(--rule);
        border-radius: var(--r3);
        padding: var(--s5);
      }
      .machine > .nav {
        display: flex;
        flex-direction: column;
        padding: var(--s5) var(--s3);
        gap: var(--s0);
        border-right: 1px solid var(--rule);
        overflow-y: auto;
      }
      .machine-pane {
        min-height: 0;
        overflow-y: auto;
        padding: var(--s5) var(--s6) var(--s6);
      }
      .tab {
        display: flex;
        align-items: center;
        gap: var(--s3);
        width: 100%;
        text-align: left;
        padding: var(--s2) var(--s4);
        border: 0;
        border-radius: var(--r2);
        background: transparent;
        color: var(--ink-2);
        font: inherit;
        font-size: var(--t-sm);
        cursor: default;
      }
      .tab:hover {
        background: var(--paper-hover);
      }
      .tab[aria-current='true'] {
        background: var(--chrome-wash);
        color: var(--ink);
        font-weight: 600;
      }
      /* A dot means somebody should look, not that something is off. */
      .tab .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--warn-line);
        margin-left: auto;
        flex: none;
      }
      .field {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: var(--s5);
        align-items: center;
        padding: var(--s3) 0;
      }
      .field > label {
        color: var(--ink-2);
        font-size: var(--t-sm);
      }
      .grant {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--s5);
        padding: var(--s4) 0;
        border-bottom: 1px solid var(--rule);
      }
      .grant .name,
      .cap .name {
        font-weight: 600;
      }
      .grant .desc,
      .cap .desc {
        margin: var(--s0) 0 0;
        font-size: var(--t-sm);
        color: var(--ink-2);
      }
      .grant .right {
        text-align: right;
        flex: none;
      }
      .grant .switch {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--s2);
      }
      .grant .used {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      .cap {
        padding: var(--s4) 0;
        border-bottom: 1px solid var(--rule);
      }
      .cap .name {
        font-family: var(--mono);
        font-size: var(--t-sm);
        color: var(--gold);
      }
      .folder {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s5);
        padding: var(--s3) 0;
        border-bottom: 1px solid var(--rule);
      }
      .folder .refused {
        font-size: var(--t-data);
        color: var(--red);
      }
      .note.bad {
        color: var(--red);
      }

      /* ---- characters ------------------------------------------------------ */
      .strip {
        flex: none;
        display: flex;
        align-items: baseline;
        gap: var(--s4);
        padding: var(--s6) var(--s6) 0;
      }
      h3 {
        margin: 0;
        font-family: var(--narrow);
        font-size: var(--t-data);
        font-weight: 700;
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--ink-3);
      }
      /*
        The cast, as a column of rows.

        It was a row of wide cards across the top of the window: the widest part
        of the screen spent on the characters you are NOT editing, with the one
        you are in a strip beneath. A list holds as many as you like in the
        space four cards needed, and it is what the artifact draws.
      */
      .cards {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s1);
        padding: 0 var(--s3) var(--s5);
        overflow-y: auto;
      }
      .card {
        display: flex;
        align-items: center;
        gap: var(--s3);
        padding: var(--s2) var(--s3);
        border: 1px solid transparent;
        border-radius: var(--r3);
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: default;
      }
      .card .tile {
        flex: none;
        display: block;
      }
      /*
        Her face could not be resolved, so the row says so instead of showing
        the built-in and letting a list of identical mochis pass for a design.
        A dashed hole is the smallest honest thing that fits where she goes.
      */
      .card.faceless .tile {
        width: 44px;
        height: 44px;
        border: 1px dashed var(--warn-line);
        border-radius: var(--r2);
      }
      .card .titles {
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1px;
      }
      /*
        NOT gold. In the artifact gold is what "STAGED · NOT GRANTED" is written
        in — a state that wants looking at — so a gold edge appearing under the
        pointer says a character has a problem every time the mouse crosses it.
      */
      .card:hover {
        background: var(--paper-hover);
      }
      /*
        The ring is one of the TWO jobs her colour keeps — the open character.
        Everything else that used to be green is gold now, because a selected
        row and a focus outline are things you operate rather than things that
        say who she is. See `tokens.css`.
      */
      .card[aria-current='true'] {
        background: var(--paper);
        border-color: var(--her);
        box-shadow: var(--lift-0);
      }
      .card .name {
        font-size: var(--t-ui);
        font-weight: 600;
        letter-spacing: -0.005em;
        overflow-wrap: anywhere;
      }
      .card .worn {
        font-family: var(--narrow);
        font-size: var(--t-nano);
        font-weight: 600;
        letter-spacing: var(--track-2);
        text-transform: uppercase;
        color: var(--ink-3);
      }
      /* Which one she IS, said once, on the row it is true of. */
      .card .wearing {
        flex: none;
        padding: 2px 7px;
        border-radius: var(--r-pill);
        background: var(--her-wash);
        color: var(--ink-brand);
        font-family: var(--narrow);
        font-size: var(--t-nano);
        font-weight: 700;
        letter-spacing: var(--track-2);
        text-transform: uppercase;
      }

      /* ---- cast: a list, the open character, and what she will be told ------ */
      .cast {
        display: grid;
        grid-template-columns: 268px minmax(0, 1fr) 360px;
        min-height: 0;
      }
      .cast-list {
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--paper-2);
        border-right: 1px solid var(--rule);
      }
      .cast-wake {
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: var(--s5) var(--s5) var(--s5);
        background: var(--paper-2);
        border-left: 1px solid var(--rule);
      }

      /* ---- the controls the sections hold ---------------------------------- */
      /* Which words she takes: three choices, not a dropdown of three. */
      .switchers {
        display: inline-flex;
        border: 1px solid var(--rule);
        border-radius: var(--r-pill);
        overflow: hidden;
      }
      .switchers button {
        border: 0;
        border-radius: 0;
        background: transparent;
        padding: var(--s1) var(--s4);
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: 700;
        letter-spacing: var(--track-2);
        text-transform: uppercase;
        color: var(--ink-3);
        cursor: default;
      }
      .switchers button[aria-current='true'] {
        background: var(--her-deep);
        color: var(--her-deep-ink);
      }
      /* Eight themes, drawn as her rather than as swatches of paint. */
      .themes {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
      }
      .theme {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border: 1px solid var(--rule);
        border-radius: var(--r2);
        background: var(--paper-2);
        padding: 0;
        cursor: default;
      }
      .theme[aria-current='true'] {
        border-color: var(--ink);
        box-shadow: var(--lift-0);
      }
      /*
        Ten voices as pills rather than a closed dropdown.

        They are all one word and the whole set fits in the width the dropdown
        would have taken shut, so a `<select>` here hid ten answers to save no
        room. The avatar list keeps its select: that one is as long as somebody's
        folder and has no bounded set to draw.
      */
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
      }
      .pills button {
        padding: var(--s2) var(--s4);
        border: 0;
        border-radius: var(--r-pill);
        background: var(--paper-2);
        box-shadow: inset 0 0 0 1px var(--rule);
        color: var(--ink-2);
        font: inherit;
        font-size: var(--t-sm);
        cursor: default;
      }
      .pills button:hover {
        box-shadow: inset 0 0 0 1px var(--ink-3);
        color: var(--ink);
      }
      .pills button[aria-current='true'] {
        background: var(--her-wash);
        box-shadow: inset 0 0 0 1px var(--her);
        color: var(--ink-brand);
        font-weight: 600;
      }
      /* The moods grid: eight tiles, each with the switch that decides it. */
      .moods {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: var(--s3);
      }
      .mood {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--s1);
        padding: var(--s4) var(--s3);
        border: 1px solid var(--rule);
        border-radius: var(--r3);
        background: var(--paper-2);
        text-align: center;
      }
      .mood.off {
        border-style: dashed;
        background: transparent;
      }
      .mood.off .tile {
        opacity: 0.4;
      }
      .mood .name {
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: 700;
        letter-spacing: var(--track-2);
        text-transform: uppercase;
      }
      .mood .when {
        font-size: var(--t-data);
        color: var(--ink-3);
        min-height: 2.4em;
      }
      .mood .allow {
        display: flex;
        align-items: center;
        gap: var(--s2);
        font-family: var(--narrow);
        font-size: var(--t-nano);
        letter-spacing: var(--track-2);
        text-transform: uppercase;
        color: var(--ink-3);
      }

      /* ---- what she will be told, down the right --------------------------- */
      #panel-wake {
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s2);
      }
      #panel-wake .row {
        align-items: baseline;
      }
      #panel-wake .note {
        margin: 0 0 var(--s2);
        font-size: var(--t-cap);
        line-height: 1.5;
        color: var(--ink-3);
      }
      #panel-wake .meta {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      /*
        The box scrolls, the column does not.

        `.sheet` is a document and takes the window's one vertical bar; this is a
        fixed panel beside it holding a string that can be any length, so it has
        to have its own. Two bars on one axis is what the `pre` rule below
        refuses — these are two different axes' worth of content, side by side.
      */
      .wake-box {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        border: 1px solid var(--rule);
        border-radius: var(--r2);
        background: var(--paper);
      }
      .wake-box > pre {
        border: 0;
        border-radius: 0;
        background: transparent;
      }

      /* ---- the open character's column ------------------------------------- */
      /*
        By id rather than by class.

        It was `.open`, and so is the microphone pill's lit state — one global
        stylesheet, two meanings, and this rule came second, so `display: flex;
        flex-direction: column; overflow-y: auto` landed on the PILL: its dot
        stacked above its label and it became a scroll container 43px tall. An
        id cannot collide with a state class, which is why the fix is here and
        not a more specific selector that would only postpone it.
      */
      #pane {
        min-height: 0;
        overflow-y: auto;
      }
      /*
        The stack of sections, and the reason it needs a rule of its own.

        `#pane` was `flex-direction: column` with a `gap`, and that gap governed
        `#pane`'s CHILDREN -- of which there is exactly one, this element.
        `characterSheet` wraps everything in it, so the gap styled a single
        wrapper and the contents inside had nothing between them at all:
        measured 0.0px on all six boundaries. Adjacent 1px borders read as a
        table rather than as an obvious fault, which is why it survived.

        The air is the SECTIONS' own padding now, so there is no container gap
        left to put on the wrong box.
      */
      .sheet {
        display: flex;
        flex-direction: column;
      }
      /*
        A section: a caps heading, a hint in mono beside it, and whatever
        control the field actually wants underneath.

        This replaced a `.plate` — one labelled row, a value, and a meta string
        — used for every field alike, which made her name, her colour and her
        memory look like rows of one table. Eight themes want a grid of faces, a
        prompt wants a textarea, a voice wants ten pills; a plate can offer one
        shape and did.
      */
      .section {
        display: flex;
        flex-direction: column;
        gap: var(--s4);
        padding: var(--s6) var(--s7);
        border-bottom: 1px solid var(--rule);
      }
      /* Nothing below the last one to divide it from. */
      .section:last-child {
        border-bottom: 0;
        padding-bottom: var(--s8);
      }
      .section > .head {
        display: flex;
        align-items: baseline;
        gap: var(--s4);
      }
      .section .hint {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      .section .note {
        margin: 0;
        max-width: 68ch;
        font-size: var(--t-ui-2);
        line-height: 1.55;
        color: var(--ink-2);
      }
      .section .note.bad {
        color: var(--warn-ink);
      }
      /*
        `.moment`, not `.field` — which this window already uses for the Machine
        tab's label-beside-control grid, at `align-items: center` and 150px of
        label. `.section .field` won on the properties it named and lost on the
        one it did not, so these two boxes were column-flexed AND centre-aligned:
        a caps label floating over a 157px input in a 374px cell.

        The sixth rule in this stylesheet to mean two things at once. Every one
        of them compiled and passed the suite.
      */
      .moment {
        display: flex;
        flex-direction: column;
        gap: var(--s1);
      }
      .moment .label,
      .who-facts .label {
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: 700;
        letter-spacing: var(--track-2);
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .moments {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--s4);
      }
      /*
        VERTICAL only. `resize: both` let the box be dragged wider than the
        column it sits in — and it made the textarea a scroll container, which
        is the second bar on one axis the `pre` rule below refuses.
      */
      .section textarea {
        resize: vertical;
      }

      /* ---- who she is, across the top of her column ------------------------ */
      /*
        `.who-band`, NOT `.who` — which this window already uses for the speaker
        label over a turn in a transcript. That is the fifth collision of this
        exact shape here: `.open` was the microphone pill and the open column,
        `.sheet` was styled on the wrong container, `.card` was a character and
        a tool, and each one compiled, linted, passed the suite and governed the
        wrong element. Two meanings in one global stylesheet is the defect;
        naming the specific thing is the fix.
      */
      .who-band {
        display: flex;
        align-items: flex-end;
        gap: var(--s6);
        padding: var(--s7) var(--s7) var(--s6);
        border-bottom: 1px solid var(--rule);
      }
      .who-band .tile {
        flex: none;
      }
      .who-of {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: var(--s2);
        padding-bottom: var(--s2);
      }
      /*
        Her name at h1, with no box until it is touched.

        The largest thing on the pane is her name; that it is editable is worth
        less than that it is her name. The underline appears on hover and focus,
        so the affordance is there the moment somebody goes looking for it.
      */
      /*
        `input[type='text'].who-name`, not `.who-name`.

        The bare class is (0,1,0) and the window's own `input[type='text']` rule
        is (0,1,1), so it WON — her name kept the ordinary field's box, border
        and 13px type however carefully this block described a title. Written up
        because it is the same family as the four class collisions above: a rule
        that reads as correct, compiles, and governs nothing.
      */
      input[type='text'].who-name {
        width: 100%;
        padding: var(--s0) 0;
        border: 0;
        border-bottom: 1px solid transparent;
        border-radius: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: var(--t-h1);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      input[type='text'].who-name:hover {
        border-bottom-color: var(--rule);
      }
      input[type='text'].who-name:focus {
        outline: none;
        border-bottom-color: var(--ink);
      }
      .who-facts {
        display: flex;
        align-items: center;
        gap: var(--s3);
      }
      .who-facts .sep {
        width: 1px;
        height: 18px;
        background: var(--rule);
      }
      .who-facts .meta {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
        overflow-wrap: anywhere;
      }
      input[type='text'].inline {
        width: 132px;
        padding: var(--s0) var(--s3);
        font-size: var(--t-sm);
      }

      pre,
      textarea {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
        padding: var(--s4);
        border: 1px solid var(--rule);
        border-radius: var(--r2);
        background: var(--paper);
        color: inherit;
        font-family: var(--mono);
        font-size: var(--t-label);
        line-height: 1.6;
        user-select: text;
      }
      /*
        A `pre` does NOT scroll on its own inside `#pane`.

        It used to: `max-height: 34vh; overflow-y: auto`, which put a second
        scrollbar a dozen pixels from the column's own, cut across the plate's
        8px corner, and made reading her notes a question of which of two bars
        the pointer happened to be over. One column, one axis, one bar. The
        inspector keeps its own, and should — `.panel` is a box of fixed height,
        not a document.
      */
      pre.empty-note {
        color: var(--ink-3);
      }

      /* ---- the inspector --------------------------------------------------- */
      aside {
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s4);
      }
      /*
        No `.panel[hidden]` here any more, and no `.warn[hidden]` either. Both
        were the same defect — an author `display` outranking the UA's rule for
        the attribute — and it is answered once, for all three windows, by
        `[hidden]` in `tokens.css`. Patching it per element is what let the
        drawer ship a chip that read "0 problems".
      */
      .panel {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s4);
        background: var(--paper-2);
        border: 1px solid var(--rule);
        border-radius: var(--r3);
        padding: var(--s5);
        overflow: hidden;
      }
      .panel h4 {
        margin: 0;
        font-family: var(--narrow);
        font-size: var(--t-data);
        font-weight: 700;
        letter-spacing: 0.1em;
      }
      .panel > pre {
        flex: 1;
        max-height: none;
      }
      .search input {
        width: 100%;
        padding: var(--s2) var(--s4);
        border: 1px solid var(--rule);
        border-radius: var(--r2);
        background: var(--paper);
        color: inherit;
        font: inherit;
        font-size: var(--t-sm);
        user-select: text;
      }
      .list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        margin: 0 calc(var(--s5) * -1) calc(var(--s5) * -1);
      }
      .entry {
        display: block;
        width: 100%;
        text-align: left;
        padding: var(--s3) var(--s5);
        border: 0;
        border-top: 1px solid var(--rule);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: default;
      }
      .entry:hover {
        background: var(--hair-soft);
      }
      .entry[aria-current='true'] {
        background: var(--gold-wash);
        box-shadow: inset 2px 0 0 var(--gold);
      }
      .entry .when {
        font-size: var(--t-sm);
        font-weight: 600;
      }
      .entry .count,
      .entry .snippet {
        font-size: var(--t-data);
        color: var(--ink-2);
      }
      .entry .snippet {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* ---- a conversation, as a conversation ------------------------------ */
      /*
        Bubbles carry the surfaces, so the field they sit on does not.

        The container had a card of its own one commit ago, which was the right
        answer while a transcript was bare paragraphs hanging in an empty column
        and the wrong one now: a bubble inside a card is two surfaces deep and
        reads as a panel of panels. The problem list still gets a card -- it is a
        report, not a conversation -- which is why it has its own class now
        rather than borrowing this one.
      */
      /*
        Full width of the column, and the measure moves to the BUBBLE.

        With `max-width: var(--reading)` here the right-aligned side hugged the
        edge of an invisible 82ch box rather than the edge of the pane, so your
        replies floated in the middle of a wide column and read as broken
        alignment. In a conversation the thing that needs a reading measure is
        the bubble; the field it sits on needs both edges, because which edge a
        bubble is on is what says who is speaking.
      */
      .transcript {
        display: flex;
        flex-direction: column;
        gap: var(--s5);
      }
      /* One speaker's unbroken stretch. Her face sits with the last bubble. */
      .run {
        display: flex;
        align-items: flex-end;
        gap: var(--s3);
      }
      .run.you {
        flex-direction: row-reverse;
      }
      .run .tile {
        flex: none;
        display: block;
        margin-bottom: 2px;
      }
      .run.faceless .tile {
        width: 28px;
        height: 28px;
        border: 1px dashed var(--warn-line);
        border-radius: var(--r-pill);
      }
      .said {
        display: flex;
        flex-direction: column;
        gap: var(--s1);
        /*
          Two limits, and the smaller wins. The percentage keeps a bubble from
          reaching both edges -- one that does is a paragraph with rounded
          corners and the shape stops saying anything. The `ch` keeps a wide
          window from producing a 700px line, which is past comfortable reading
          whatever shape it is in.
        */
        max-width: min(72%, 54ch);
        min-width: 0;
      }
      .run.you .said {
        align-items: flex-end;
      }
      .who {
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: 600;
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--ink-3);
        margin-bottom: var(--s0);
      }
      .run.her .who {
        color: var(--ink-brand);
      }
      /*
        Her side is HER colour, which is the design's second semantic rule doing
        real work rather than decorating. `--ink-brand` on `--her-wash` is the
        pairing `contrastFailures` already sweeps for every persona and
        `accent.test.ts` sweeps for all eight built-in themes -- so a character
        somebody else wrote cannot make her own words unreadable here.
      */
      .bubble {
        padding: var(--s3) var(--s4);
        border: 1px solid var(--rule);
        border-radius: var(--r4);
        background: var(--paper-2);
        font-size: var(--t-body);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
      }
      .run.her .bubble {
        background: var(--her-wash);
        border-color: transparent;
        color: var(--ink-brand);
      }
      /* The corner nearest the speaker is tightened. That is the whole tail. */
      .run.her .said > .bubble:last-of-type {
        border-bottom-left-radius: var(--r1);
      }
      .run.you .said > .bubble:last-of-type {
        border-bottom-right-radius: var(--r1);
      }
      .cut {
        margin-top: var(--s0);
        font-family: var(--narrow);
        font-size: var(--t-label);
        color: var(--warn-ink);
      }

      /* ---- the problem list, which is a report rather than a conversation --- */
      .report {
        background: var(--paper-2);
        border: 1px solid var(--rule);
        border-radius: var(--r3);
        padding: var(--s6);
      }
      .problem p,
      .lead {
        max-width: var(--reading);
      }
      .problem {
        margin: 0 0 var(--s5);
      }
      .problem .where {
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: 600;
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--red);
      }
      .problem p {
        margin: var(--s0) 0 0;
        font-size: var(--t-sm);
        white-space: pre-wrap;
      }
      .problem .subject {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      .lead {
        margin: 0 0 var(--s6);
        font-size: var(--t-sm);
        color: var(--ink-2);
      }
      /* Alone on the surface, it is the whole answer rather than an intro. */
      .lead:only-child {
        margin: 0;
      }
      /* Every empty surface says WHICH kind of empty it is. */
      .empty {
        max-width: 46ch;
        margin: var(--s7) auto;
        text-align: center;
        font-size: var(--t-sm);
        color: var(--ink-3);
      }

      /* ---- the strip along the bottom -------------------------------------- */
      .drawer {
        flex: none;
        height: 48px;
        display: flex;
        align-items: center;
        gap: var(--s5);
        padding: 0 var(--s6);
        background: var(--paper-2);
        border-top: 1px solid var(--rule);
      }
      .handle {
        width: 46px;
        height: 4px;
        border-radius: var(--r-pill);
        background: var(--rule);
        flex: none;
      }
      .warn {
        display: flex;
        align-items: center;
        gap: var(--s2);
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--warn-ink);
        background: none;
        border: 0;
        padding: 0;
        cursor: default;
      }
      .warn .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--warn-line);
        flex: none;
      }

      /* The button treatment is `button.btn` in tokens.css — a box, told apart
         from the select beside it by fill and weight rather than by border. */
      :focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 1px;
      }
      /*
        A field you TYPE in keeps its box; a field you CHOOSE from loses it.

        The artifact has no `<select>` anywhere — it writes the value as plain
        type with a quiet action beside it ("built-in mochi  94 × 73 pt · 100%"
        … "SWAP · TUNE"), and a column of grey dropdown chrome is the single
        biggest reason this window read as a form where the artifact reads as a
        document. The box comes back on hover and focus, so the affordance is
        still there the moment somebody goes looking for it.
      */
      input[type='text'] {
        padding: var(--s1) var(--s3);
        border: 1px solid var(--rule);
        border-radius: var(--r2);
        background: var(--paper);
        color: inherit;
        font: inherit;
        font-size: var(--t-sm);
      }
      select {
        appearance: none;
        padding: var(--s1) var(--s6) var(--s1) var(--s2);
        border: 1px solid transparent;
        border-radius: var(--r2);
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: var(--t-body);
        /* The chevron, drawn rather than shipped: one token, both schemes. */
        background-image:
          linear-gradient(45deg, transparent 50%, currentColor 50%),
          linear-gradient(135deg, currentColor 50%, transparent 50%);
        background-position:
          right 13px top 50%,
          right 8px top 50%;
        background-size:
          5px 5px,
          5px 5px;
        background-repeat: no-repeat;
      }
      select:hover,
      select:focus {
        border-color: var(--rule);
        background-color: var(--paper);
      }
      input[type='text'] {
        user-select: text;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s3);
        align-items: center;
      }
      .note {
        margin: var(--s2) 0 0;
        font-size: var(--t-cap);
        color: var(--ink-3);
      }
      code {
        font-family: var(--mono);
        font-size: var(--t-data);
        overflow-wrap: anywhere;
        user-select: text;
      }
      mark {
        background: var(--gold-wash);
        color: var(--gold);
        border-radius: var(--r0);
      }
      /* Says what happened, on its own opaque surface with an elevation. */
      #said {
        position: fixed;
        left: var(--s6);
        right: var(--s6);
        bottom: 56px;
        margin: 0;
        padding: var(--s3) var(--s5);
        border-radius: var(--r2);
        background: var(--paper-2);
        box-shadow: var(--lift-1);
        font-size: var(--t-sm);
      }
      #said.bad {
        color: var(--red);
        background: var(--red-bg);
      }
      #said:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!--
        One strip: who she is, where you are, and what this place needs.

        The tab bar was a second row under this one, which put two horizontal
        rules across the top of a window whose whole point is that it has one
        subject at a time. The three places live in the strip, the pane's own
        context sits in the middle, and her state stays on the right where it
        was — the microphone is the one thing here that is true whatever tab you
        are on.
      -->
      <div class="topbar">
        <canvas class="mark" id="mark"></canvas>
        <span class="wordmark">mochi</span>
        <span class="divider"></span>
        <nav class="shell-tabs" id="shell-tabs" role="tablist"></nav>
        <div class="topbar-context" id="topbar-context">
          <!--
          Search belongs to the strip, not to the pane: "search first" is the
          Archive's whole shape, and a field inside the pane put it below the
          rule that separates the window's subject from its chrome.
        -->
          <input
            id="q"
            type="search"
            placeholder="Search everything ever said"
            autocomplete="off"
          />
        </div>
        <span class="grow"></span>
        <span class="pill" id="mic"><span class="dot"></span><span id="mic-label"></span></span>
        <span class="state"
          ><span class="what" id="state"></span><span class="how" id="state-how"></span
        ></span>
        <span class="stat" id="count"></span>
      </div>

      <!--
        The open character gets the middle of the window, and her sections in
        order rather than a stack of identical plates.

        The cast was a row of cards across the top, which spent the widest part
        of the window on the characters you are NOT editing and left the one you
        are in a column beneath. A list holds as many as you like in the space a
        row of four needed.
      -->
      <section class="tab-pane cast" id="tab-cast">
        <aside class="cast-list">
          <div class="strip">
            <h3>Characters</h3>
            <span class="stat" id="characters-count"></span>
          </div>
          <div class="cards" id="characters"></div>
        </aside>
        <div id="pane"></div>
        <aside class="cast-wake">
          <div class="panel" id="panel-wake"></div>
        </aside>
      </section>

      <!--
        The archive gets the whole window: search across the top, conversations
        on the left, the transcript at a reading measure. It was a 380px column
        beside a character's fields, at whatever width was left over.
      -->
      <section class="tab-pane archive" id="tab-archive" hidden>
        <div class="archive-body">
          <div class="list" id="list"></div>
          <div id="talk"></div>
        </div>
      </section>

      <!--
        Three columns, not two. The tool list used to scroll under the grants,
        which is where you look last for the thing the grants are ABOUT — a
        withheld grant removes a row from it, so the two belong side by side or
        the connection is a scroll away.
      -->
      <section class="tab-pane machine" id="tab-machine" hidden>
        <nav class="nav" id="nav">
          <h3 class="nav-head">This machine</h3>
          <div id="nav-groups"></div>
        </nav>
        <div class="machine-pane" id="machine-pane"></div>
        <aside class="machine-tools" id="machine-tools"></aside>
      </section>

      <div class="drawer">
        <span class="handle"></span>
        <button class="warn" id="troubles" type="button" hidden>
          <span class="dot"></span><span id="troubles-label"></span>
        </button>
        <span class="grow"></span>
        <button class="btn" id="export" type="button">Export…</button>
      </div>
    </div>
    <p id="said" role="status" aria-live="polite"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
