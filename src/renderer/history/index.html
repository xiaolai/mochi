<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mochi</title>
    <link rel="stylesheet" href="../design/tokens.css" />
    <style>
      /*
        1a, at 1440 x 900: her state, her characters, the one that is open.

        The layout is the v2 delivery's — a rail that is always present, a
        masthead that says whose page this is, and one page at a time under it.
        Three arrangements, each closing at 1280 by its own arithmetic: her page
        spends 224 on apparatus, the machine 222 on its nav, the archive 368 on
        the list.

        What fills it is only what this build can actually do. Both deliveries
        drew chrome for features that do not exist — a command palette, an
        installer, per-character session stats — and drawing those is the same
        failure as offering her a tool she cannot call.

        Every value is a token, for the reason `tokens.css` gives: a literal
        here is a place this window and the design can drift without either of
        them looking wrong.
      */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        font: var(--t-ui) / 1.5 var(--sans);
        user-select: none;
      }
      /*
        NO BROWSER MARGIN on a paragraph.

        `<p>` carries a user agent `margin: 1em 0`, which is 13px here — so
        every note in this window put thirteen pixels above and below itself,
        collapsing against whatever gap its container had already decided. It
        showed as a machine pane whose rows sat 0 and 13px apart with no rule
        able to say why. Room between things is the container's decision in this
        design; a paragraph does not get a vote.
      */
      p {
        margin: 0;
      }
      /*
        A sentence of explanation, wherever one is written.

        This class is used forty-four times across this window and had NO rule
        of its own. Everything about it came from `.section .note` — so the same
        class was 12.5px at a 68ch measure inside a settings row, and body text
        running the full width of the column everywhere else: the machine's
        panes, the storage group, the margin. The prompts pane is where it
        showed, twenty-seven unmeasured paragraphs down one column.

        The face argument here was v1's and is spent: there were three faces,
        `body` was Sora, and every note inherited the operating face while the
        scale said of it "never prose". v2 has two faces and Outfit sets
        everything you read, so a note is already in the right one and weight
        carries what a third face used to.

        What survives is the MEASURE, which was never about the face: 62ch and
        `pretty`, so a line can be read without losing the start of the next and
        no single word is left alone on the last.

        62ch and `pretty` for the same reason they used them: a line somebody
        reads without losing the start of the next one, and no single word left
        alone on the last line.
      */
      .note {
        margin: 0;
        max-width: 62ch;
        font-family: var(--sans);
        font-size: var(--t-sm);
        line-height: var(--leading-long);
        color: var(--ink-2);
        text-wrap: pretty;
      }
      /*
        A line of things side by side, with room between them.

        `.row` is built in four files and had NO rule of its own — the only one
        naming it was `.wake .row`, and that set `align-items: center` on
        an element whose `display` was still `block`, so it did nothing, and so
        did the `.grow` spacer inside it. Save and Reset touched, edge to edge,
        under every one of the twenty-seven prompt editors.

        10px is the delivery's gap between adjacent buttons, which is what these
        rows mostly hold.
      */
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      /*
        A control and the word for it.

        Same defect: built in two panes, styled only as `.grant .switch`, so the
        one on the machine's On screen group was a block and its box sat above
        its label instead of beside it. What is particular to the grant is that
        it is RIGHT-aligned in a right-hand column, and that is all that rule
        says now.
      */
      .switch {
        display: flex;
        align-items: center;
        gap: var(--s2);
      }
      /*
        A machine-shaped annotation beside something: "edited", a count, a file.

        Built in three files, styled in two places, unstyled in the third — so
        the "edited" marker beside a catalogued prompt drew as 13px body text
        next to a 9.5px caps heading. Mono at 12px, which is the ceiling the
        scale sets for it: "never larger than the thing it annotates".
      */
      .meta {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      /*
        A caution, in the one colour this window uses for one.

        It drew in TWO: `--red` outside a section and `--warn-ink` inside one,
        for the same class with the same meaning — so the prompts pane's "over
        the limit" was red and her sheet's failing-contrast warning was gold —
        two families for one kind of sentence.

        Neither exists now: v2 is monochrome, so a warning is said in words and
        weight. `--ink-2` rather than `--ink` because it is still a note, and the
        thing it warns about is beside it.
      */
      .note.bad {
        color: var(--ink-2);
      }
      /*
        A button takes the page's face.

        The user agent gives one its own — Arial here — and several buttons in
        this window were on it: the numbered views, the month arrows, the day
        cells. It never showed, because each of them puts its text in a child
        span that names a face. That is luck, not a rule: the first button that
        puts text directly in itself gets Arial, and nothing about it looks
        wrong.
      */
      button {
        font-family: inherit;
        font-size: inherit;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /*
        Headings and machine-shaped text, which had no rule at all.

        `h3` fell back to the user agent's `1.17em` — 15.21px against a 13px
        context, a size that is not on this scale and could not be, because
        nothing chose it. `code` fell back to the browser's `monospace`, so
        every path, filename and capability name outside `.folder` was set in
        whatever the system calls mono rather than in DM Mono.

        Both were rules that went missing when the sections holding them were
        replaced. Neither shows in a screenshot as anything but "slightly
        wrong", and both were found by measuring every drawn element against
        the scale rather than by looking.

        The face argument that stood here — "in whatever the system calls mono
        rather than in DM Mono" — is spent. There are two faces now and this is
        not a machine shape, so it takes Outfit like everything else you read.
      */
      h3 {
        margin: 0;
        font-family: var(--sans);
        font-size: var(--t-label);
        font-weight: var(--w-medium);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--ink-3);
      }
      code {
        font-family: var(--mono);
        font-size: var(--t-data);
      }

      /* ---- the frame: a rail, and one page at a time -----------------------
        The rail is the window's table of contents and it never goes away. A
        character list that appears on one tab only is a list you have to
        navigate to in order to find out what you could navigate to.
      */
      .frame {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .rail {
        width: var(--rail-w);
        flex: none;
        display: flex;
        flex-direction: column;
        /*
          SUNKEN, not raised. "Chrome recedes, content advances" survives v2
          intact; what changes is which surface is the recessed one. The rail is
          `--paper-3` and the page it sits beside is `--paper`, so the recession
          is a step down rather than the step up `--paper-2` used to make.
        */
        background: var(--paper-3);
        border-right: var(--s-px) solid var(--rule);
        /*
          Padded on the sides now, because the rows are rounded.

          A 14px corner against the rail's own edge reads as a mistake rather
          than as a shape — the fill has to have somewhere to end. 12 either
          side is what the component is drawn with.
        */
        padding: var(--s4) var(--s3) 14px;
        overflow-y: auto;
      }
      /* "Two characters" — a heading, and the only one in the rail. */
      /*
        THE WORD AND THE NUMBER AT OPPOSITE ENDS, which is what `Rail.dc.html`
        draws: `CHARACTERS` in caps on the left, `2` in mono on the right,
        `padding: 0 8px 10px`.

        It was one sentence — "2 characters" — set entirely in the caps face, so
        a count that changes sat inside a heading that does not, and the number
        was drawn in the one face this window reserves for labels. Two facts, two
        elements, the same row.
      */
      .rail-head {
        margin: 0;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--s3);
        font-family: var(--sans);
        font-size: var(--t-label);
        font-weight: var(--w-medium);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--ink-3);
        padding: 0 var(--s2) 10px;
        max-width: none;
      }
      /* The count is a machine fact and takes the machine face — it is not part
         of the heading beside it. */
      .rail-count {
        font-family: var(--mono);
        font-size: var(--t-data-2);
        font-weight: var(--w-regular);
        letter-spacing: normal;
        text-transform: none;
      }
      .rail-cast {
        display: flex;
        flex-direction: column;
      }
      /*
        A row, and the chosen one gets ONE STEP OF GREY — V4.

        It got a bar, and an unchosen row carried 21px of left padding to pay the
        bar's 3px back, so names stayed on one vertical line whether or not they
        were chosen: a list whose text shifts sideways as the selection moves
        reads as two lists. The padding is symmetric now because there is no bar
        to pay for, and the fill is the whole state.
      */
      .rail-row {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 10px var(--s3);
        margin-bottom: var(--s0);
        border: 0;
        /* Cards and fields. The row IS the card here — there is no box around
           it, so the roundness is what says one row is one thing. */
        border-radius: var(--r-card);
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .rail-row:hover {
        background: var(--paper);
      }
      .rail-row[aria-current='true'] {
        background: var(--chosen);
      }
      /*
        Rule 6 — "the machine gets none of her colour" — is now true of every row
        rather than arranged for this one. v2 spends no hue on chrome at all, so
        the machine's chosen row and a character's are the same one step of grey,
        and there is nothing left to make an exception of. The rule is satisfied
        by the palette rather than by a selector somebody has to remember.
      */
      .rail-row .tile {
        flex: none;
      }
      /*
        A character who named a face and did not get it — contract C4.

        Dashed and empty rather than the built-in standing in for her: the face
        is the one thing that tells two characters apart, so substituting it
        makes the list stop doing its only job, and it looks deliberate.
      */
      .rail-row.faceless .tile {
        /*
          SIZED here, and it has to be.

          `faceTile` refuses to draw a face it does not have and returns a bare
          `<canvas>` — deliberately, so the tile is empty rather than showing
          somebody else, and deliberately without width or height attributes so
          it draws nothing at all. `faceTile` gives it its own width and height
          now, so the size is not this rule's job; what IS this rule's job is
          saying that the absence is deliberate.

          Dashed, so it reads as a marked absence rather than as a picture that
          failed to load — which is the whole reason the size could move into
          the element in the first place.
        */
        border: var(--s-px) dashed var(--rule-2);
        border-radius: var(--r-part);
      }
      /* The same admission at the subject's size. */
      .who-band.faceless .tile {
        border: var(--s-px) dashed var(--rule-2);
        border-radius: var(--r-part);
      }
      .rail-titles {
        display: flex;
        flex-direction: column;
        gap: var(--s-px);
        /* `flex: 1` with `min-width: 0`, both. Without the second a flex item
           refuses to shrink below its content, so a long name pushes the row
           wider than the rail instead of ellipsing — which is how "Wisp" and
           "worn now" came to need 368px in a 206px column. */
        flex: 1;
        min-width: 0;
      }
      .rail-name {
        font-family: var(--sans);
        font-size: var(--t-read);
        font-weight: var(--w-medium);
        line-height: 1.3;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /*
        The second line under a name, and it is MONO now.

        "she · ballad" is two machine facts about a character, which is exactly
        what the second face is for. It was Sora at 11px in small caps — the
        treatment for something you operate, on something you only read.

        ONE ink on every ground. The delivery writes `#55555c` on a chosen row
        and `#63636b` elsewhere, which a token handed to every row cannot do;
        `--ink-3` is the value that clears 4.5:1 on both, so the distinction
        costs nothing and the rule stays one rule.
      */
      .rail-worn {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--mono);
        font-size: var(--t-micro);
        margin-top: var(--s-px);
        color: var(--ink-3);
      }
      /*
        The machine's mark: a 30px rounded tile with a 12px square outlined in
        it, standing where a character's face stands. `Rail.dc.html`'s, and the
        reason is that this row is one of the rail's rows — it needs the thing on
        the left that every other row has, or it reads as a caption under the
        list rather than as a destination in it.
      */
      .rail-tile {
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--rule);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .rail-tile::before {
        content: '';
        width: var(--s3);
        height: var(--s3);
        border-radius: 3px;
        border: 1.5px solid var(--ink-2);
      }
      .rail-machine[aria-current='true'] .rail-tile {
        background: var(--paper);
      }
      .rail-machine[aria-current='true'] .rail-tile::before {
        border-color: var(--ink);
      }
      /*
        Making a character: two underlined words, exactly as drawn.

        `display: flex; gap: 14px; padding: 16px 18px 0; font-family: Sora;
        font-size: 11.5px; color: var(--ink-2)`, and each word carries a 1px
        rule in `--rule-2` with a pixel of space above it. Those are the
        delivery's own numbers.

        UNDERLINED AT REST, not on hover. An underline that appears when the
        pointer arrives is a control you have to find by sweeping; these are two
        words in a column of names and the rule is what says they are not a
        third name.

        Four bordered buttons and a text field stood here — the making of
        characters drawn heavier than the characters, on a rail whose job is
        saying who exists.
      */
      /*
        Making a character: two BUTTONS, which is what `Rail.dc.html` draws —
        white, a 1px `#d4d4d8` edge, a pill radius, `padding: 6px 14px` at
        12.5/500, the pair on `padding: 14px 8px 0` with an 8px gap.

        They were two underlined words at 12px in `--ink-2`, on the reading that
        the rail is a table of contents and a bordered control in it would be
        loud. The delivery disagrees, and it is right for a reason the reading
        missed: these two are the only things in this column that MAKE something,
        and everything else in it navigates. An underline is this window's mark
        for an editable field, so the two controls that are not fields were
        wearing the one shape reserved for fields.
      */
      .rail-make {
        display: flex;
        gap: var(--s2);
        padding: 14px var(--s2) 0;
      }
      /*
        THE PADDING, and nothing else — it is `button.btn` for everything else.

        `Rail.dc.html` draws New and Duplicate at `12.5/500, #fff, 1px #d4d4d8,
        pill`, which is `button.btn` exactly, on `padding: 6px 14px` — tighter
        than the button's 8/16 because the rail is 207px wide.

        This class carried the whole box, so it was a fifth vocabulary for one
        control, and it kept a hover written for the underline these used to be:
        `border-bottom-color`, which on a fully bordered pill darkens one side
        and reads as a bottom border arriving under the word. The window has one
        hover for an outlined button and it darkens the whole edge.

        `button.btn.rail-word`, at (0,2,1), and the specificity is load-bearing:
        `.rail-word` alone is (0,1,0) and loses to `button.btn` at (0,1,1).
        Matching at (0,1,1) does not help either, and that is the part worth
        knowing — THE BUILD INVERTS THE SHEET ORDER. In this file the link to
        `tokens.css` sits above the inline block, so a tie reads as "the block
        wins"; in `out/` the block is inlined FIRST and the extracted stylesheet
        follows it, so `tokens.css` wins every tie in the app while the source
        says the opposite. Anything here overriding a token rule has to
        out-specify it, never out-order it.
      */
      button.btn.rail-word {
        min-height: 0;
        min-width: 0;
        padding: 6px 14px;
      }
      .rail-foot {
        margin-top: auto;
        padding-bottom: var(--s3);
      }
      .rail-rule {
        height: var(--s-px);
        background: var(--rule);
        margin: var(--s4) var(--s2) var(--s2);
      }
      /*
        WORN, as a pill on the row it is true of.

        It was a word in the same slot as "SHE · BALLAD", so one element carried
        two different kinds of claim and the reader had to notice which. A pill
        is this vocabulary's shape for a small standing label, and it sits on
        `--paper` because the row under it is `--chosen` — the one place in the
        window where a lighter fill is the raised one.
      */
      /*
        What she has kept, one line per thing she recorded.

        A `<pre>` held the whole note as one block — which is what she wrote, but
        not what it IS: separate facts recorded at separate times, run together
        into what reads as a paragraph, set in a monospace measure inside a
        proportional column.
      */
      /*
        HER EIGHT FACES, at the size she is actually drawn.

        `auto-fill` rather than a fixed column count: her size is her own, so a
        character drawn at 60% needs a tighter grid than one at 140%, and a fixed
        four-across would leave one of them in a column of mostly air.
      */
      .faces {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: var(--s5);
      }

      .face-tile {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--s2);
        padding: var(--s4);
        border-radius: var(--r-card);
        background: var(--paper-3);
      }

      .face-name {
        font-family: var(--sans);
        font-size: var(--t-sm);
        font-weight: var(--w-medium);
        color: var(--ink);
      }

      /* Mono, because "cut off mid-sentence" is the OCCASION she wears it on —
         a machine fact about the tile above it rather than prose. */
      .face-when {
        margin: 0;
        font-family: var(--mono);
        font-size: var(--t-nano);
        line-height: var(--leading);
        color: var(--ink-2);
      }

      /*
        The word beside the switch, and it is not decoration.

        "开关一律配一个词" — every switch carries a word, because the meaning a
        mark carries has to exist as text for somebody who does not see it. It
        says which state the switch is IN rather than what pressing it would do,
        so it reads the same as the switch itself.
      */
      /* The word every switch carries. Not uppercase: A2c writes "allowed" and
         "withheld" as words, and small caps make a state read as a label. */
      .face-allow {
        font-family: var(--sans);
        font-size: var(--t-cap);
        color: var(--ink);
      }

      /*
        THE PROBLEMS DRAWER, in the top layer over whatever page is open.

        One of the three surfaces v2 allows a shadow on, and the reason is the
        rule rather than the look: it floats above the page rather than sitting
        in it, so a hairline would put it in the same plane as the thing it
        covers. The rendered gate's allow-list names this id.

        Anchored to the foot, because that is where the control that opens it
        is — a drawer that rose from the middle would be a dialog wearing a
        different word.
      */
      /*
        THE CONFIRMATION, and it had no rule of its own at all.

        It was drawing on the user agent's `<dialog>` defaults — a 2px inset
        border, white, black text — in a window that declares its own palette,
        its own radius ladder and its own type. The one irreversible action in
        the app looked like nothing else in the application.

        It is the second of the three surfaces v2 allows a shadow on, for the
        rule rather than the look: a modal covers the page it is asking about, so
        a hairline would put it in the same plane as the thing it is about to
        destroy. The gate's allow-list names this id.
      */
      /*
        The QUESTION is the largest thing on this surface.

        A5 sets it at 22 — the sheet asks one thing and everything else on it is
        the consequence of answering, so the sentence has to be read before the
        buttons are. It inherited the body size, which put the question at the
        same weight as the paragraph explaining it.
      */
      #sure h2 {
        margin: 0;
        font-family: var(--sans);
        font-size: var(--t-h2);
        font-weight: var(--w-medium);
        letter-spacing: var(--track-tight);
        color: var(--ink);
      }

      #sure {
        /* A5's: 520 wide, 30/32 of padding, and NO border — the lift is what
           lifts it, and a surface with both says the same thing twice. */
        max-width: 520px;
        padding: 30px var(--s6);
        border: 0;
        border-radius: var(--r-panel);
        background: var(--paper);
        box-shadow: var(--lift-top);
        color: var(--ink);
        font-family: var(--sans);
        font-size: var(--t-body);
      }

      /* Dimmed, so the page it covers reads as covered rather than as behind a
         floating box. */
      #sure::backdrop {
        background: light-dark(rgb(10 10 11 / 28%), rgb(0 0 0 / 55%));
      }

      /*
        A 520px PANEL over its own trigger — C1's — not a bar across the window.

        It was `left: 32px; right: 32px`, so 1216px at the default size for a
        surface holding one subject, one mono line, one sentence and two buttons.
        The width was the whole difference between "this came out of the status
        bar" and "a bar appeared": C1 rises it from the right, over the control
        that opens it, which is what makes the connection readable without
        anything saying so.
      */
      #troubles-drawer {
        position: fixed;
        left: auto;
        right: var(--s6);
        width: 520px;
        max-width: calc(100vw - var(--s6) * 2);
        bottom: calc(var(--status-h) + var(--s2));
        max-height: 60vh;
      }

      #troubles-head {
        margin: 0;
        font-family: var(--sans);
        font-size: var(--t-h3);
        font-weight: var(--w-medium);
        color: var(--ink);
      }

      #troubles-body {
        min-height: 0;
        overflow-y: auto;
      }

      /* The foot: what this surface is, in the face reserved for machine facts.
         It is the one line here that is true whether or not anything is wrong. */
      .note-mono {
        margin: 0;
        font-family: var(--mono);
        font-size: var(--t-micro);
        line-height: var(--leading);
        color: var(--ink-3);
      }

      /*
        How much matched, in both numbers.

        Mono, because it is a pair of counts rather than a sentence — the same
        rule every time, count and path in this window follows.
      */
      .found {
        margin: 0 0 var(--s3);
        font-family: var(--mono);
        font-size: var(--t-data-2);
        color: var(--ink-3);
      }

      /*
        The transcript's own facts, above its turns.

        A row rather than a stacked column: in the margin these were three blocks
        down a 224px strip, and on a 616px transcript the same three sit on one
        line — which is what the delivery draws and what makes them read as a
        head rather than as a sidebar that lost its side.
      */
      /*
        A3's head for a transcript: the clock, then everything else as one mono
        phrase beside it. It was three stacked apparatus blocks 245px tall, at
        the top of the reading column, above the first thing anybody said.
      */
      .talk-head {
        display: flex;
        align-items: baseline;
        gap: var(--s3);
      }
      .talk-when {
        font-size: var(--t-h3);
        font-weight: var(--w-medium);
        color: var(--ink);
      }
      .talk-facts-line {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      .talk-facts {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s5);
        padding-bottom: var(--s4);
        border-bottom: var(--s-px) solid var(--rule);
      }

      /*
        Said to a screen reader and to nobody else.

        The attention dot is a shape, and a shape is not a sentence. `panes.ts`
        already knows WHY a group wants attention — "the Codex CLI could not be
        found on this machine" — and that reason was being thrown away at the
        point of drawing, so the nav told a sighted reader something and a screen
        reader nothing.

        Clipped rather than `display: none`, which would take it out of the
        accessibility tree along with the layout.
      */
      .said-quietly {
        position: absolute;
        width: var(--s-px);
        height: var(--s-px);
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* A2b is two sections, so the screen is a column like any other page. */
      .kept-screen {
        display: flex;
        flex-direction: column;
        gap: var(--s5);
      }

      .kept {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /*
        Her lines, plainly — no rule down the side.

        A2b sets them at 14.5 in full ink, 10 apart, and that is all: they are
        the largest text on the screen because they are what the screen is FOR.
        The quoted-block treatment I gave them made four facts look like an
        excerpt from somewhere else, when the point is that she wrote them here.
      */
      .kept-line {
        margin: 0;
        font-size: var(--t-read);
        line-height: var(--leading);
        color: var(--ink);
      }

      .rail-mark {
        flex: none;
        padding: 3px var(--s2);
        border-radius: var(--r-pill);
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        font-size: var(--t-label-2);
        font-weight: var(--w-medium);
        letter-spacing: var(--track-2);
        text-transform: uppercase;
      }

      /*
        NOTHING. It is a rail row and it is laid out like one.

        This carried `justify-content: space-between`, which was correct for the
        markup it was written against: the button held a name and a `.rail-stat`
        sub-line, and the rule pushed them to opposite ends. The children are a
        tile and a name now — `Rail.dc.html`'s — so the rule sent the tile hard
        left and flushed "This machine" against the far edge of a 207px row,
        66px from its own tile, while every character row above it sits its name
        11px from its face. A column of rows whose labels do not start at the
        same x is not a list.

        The rule survived the markup it described. That is the failure this
        stylesheet already records five times over under other names, and it is
        why `rail-lines-up` is now a rendered check rather than something to
        notice.

        `Rail.dc.html` gives the machine row 14/500 against a character's 14.5,
        which is a distinction worth nothing here — one row, one weight.
      */

      /* ---- a page ----------------------------------------------------------
        Two of them, and only one on screen. `[hidden]` in the token file is
        what actually hides the other, with `!important`, for the reason stated
        there.
      */
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .page {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      /*
        THE SAME GUTTER as the column under it.

        It was `--s7` — 40 — where `.reading` is 32, so her name, the numbered
        views and the search field sat eight pixels right of every paragraph they
        head, and nine short of the margin's edge. On a layout whose structure is
        a printed page that reads as a mistake rather than as breathing room, and
        32 is not arbitrary: it is the gutter the width arithmetic closes on,
        232 + 32 + 760 + 32 + 224 = 1280.
      */
      /*
        26 at the top, not 32 — `HerHead.dc.html` is `padding: 26px 32px 0`.

        The six pixels matter because this band has a budget: `Mochi 窗口
        尺寸.dc.html` sizes the masthead at 152 and derives the whole window
        from it, and this header measured 193. Every pixel over comes out of the
        reading column on all four screens.
      */
      .head {
        flex: none;
        padding: 26px var(--s6) 0;
      }
      /*
        The subject row: her face, her name, and the search that is about her.

        `align-items: center` and `gap: 18px`, which are the delivery's numbers.
        The `flex: 1` spacer is what pushes the search to the far end rather
        than a `justify-content` on the row — the row has three items and only
        one of them is meant to move.
      */
      /*
        `subject-row`, NOT `subject` — which the renderer already writes on the
        SUBJECT LINE of a conversation and of a problem, as a `<div>` holding
        one string.

        So both of those were flex containers with `gap: 18px` and thirty pixels
        of padding under them, from a rule about the row across the top of a
        page. `.entry .said-of` asks for a line clamp, which a flex
        container does not give its anonymous item — every conversation title
        too long for its column was hard-clipped instead of ellipsised, and sat
        over thirty pixels of nothing.

        The eleventh name in this stylesheet to mean two things. Every one of
        them compiled, linted and passed the suite; `stylesheets.test.ts` now
        holds the shape.
      */
      /*
        `align-items: flex-start` and no bottom padding — the views' own
        `margin-top` is the gap under this row, which is what HerHead draws
        (`margin: 24px 0 0` on the pill). It had 22px of padding here AND the
        row's own trailing space, so the two stacked.
      */
      .subject-row {
        display: flex;
        align-items: flex-start;
        gap: var(--s6);
      }
      .subject-of {
        min-width: 0;
      }
      /*
        A RULED LINE, not a box.

        "Rules do the grouping. Boxes are reserved for the two things that need
        one: a control and a warning." A search field with something in it reads
        as a field; the box is what an empty one needs, and this one always has
        a placeholder saying what it searches. It was a bordered input on a row
        of its own, which is two of that sentence's rules broken at once.
      */
      /*
        A PILL, not a ruled line.

        Search is the one field on the masthead, and v2's field treatment is a
        fill with no edge at all — the fill is what says a field is a field, and
        a rule under it was the v1 answer to the same question. Round because
        every pressable and typable thing in this vocabulary is round.
      */
      .finding {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 320px;
        flex: none;
        padding: 10px 18px;
        border: 0;
        border-radius: var(--r-pill);
        background: var(--paper-3);
      }
      .finding-mark {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
        flex: none;
      }
      /*
        `#q`, not `.finding input`. The window's own `input[type='search']` rule
        is (0,1,1) and would beat a bare class — which is how her name kept the
        ordinary field's box for a build, and it is written up in `who.ts`.
      */
      #q {
        flex: 1;
        min-width: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        font-family: var(--sans);
        font-size: var(--t-body);
        color: var(--ink);
      }
      #q::placeholder {
        color: var(--ink-3);
      }
      #q:hover,
      #q:focus {
        border: 0;
        background: transparent;
      }
      /*
        THE RING GOES ON THE PILL, and until now nothing went anywhere.

        This opted the input out and gave the wrapper `border-bottom-width` and
        `border-bottom-color` to carry focus instead. `.finding` sets `border: 0`,
        which sets `border-style: none` — and a width and a colour on a side with
        no style paint nothing. So keyboard focus on the one field in the masthead
        was invisible, while `padding-bottom` DID apply and the pill lost height
        the moment it was reached.

        The comment that stood here argued the case for a ruled line, on a control
        that v2 draws as a pill with no rule at all. It was v1's answer carried
        across whole.

        It carried V5's answer — 2px ink inside the border box, no gap, no outer
        ring — which is the treatment `tokens.css` replaced. So one field in the
        masthead wore the system page's focus while every other control in the
        window wore the self-audit addendum's sandwich: one state, two
        definitions, in one build. That is the audit's own item B with a different
        body, and it is settled the same way — the addendum wins, because the
        system page is the file the audit says to stop trusting.

        The INPUT keeps opting out. `:focus-within` on the pill is what shows the
        state, or the pill and the box inside it would both ring; the sheet's own
        check requires an opt-out to have a rule beside it that paints, and this
        is that rule.
      */
      #q:focus-visible {
        outline: none;
      }
      /* The outer ring alone, like every other field — the pill is a filled well
         and an ink edge on its own boundary is that boundary drawn twice. */
      /* The outer ring alone and ON the pill's edge — it is a filled well like
         every other field, and an offset ring leaves a band of page between the
         fill and the thing meant to be around it. */
      .finding:focus-within {
        outline: var(--s-px) solid var(--ink);
        outline-offset: 0;
      }
      /*
        The three views, as a sub-navigation under her name.

        Numbered, because they are parts of one document rather than
        destinations — I, II, III reads as a contents list and Cast/Archive/
        Machine reads as three apps sharing a window.
      */
      /*
        A SEGMENTED CONTROL, which is what `HerHead.dc.html` draws.

        This was three 19px labels in a row under a hairline, each with a Roman
        numeral over it. The numerals were invented here — nothing in the
        delivery has them — and at 19px the three views were the loudest thing
        on the page after her name, on a header the sizing document budgets at
        152px total.

        The delivery draws the same pill this window already uses for `she|he|it`
        and for `Sent|Tools|Write`: one sunken track, the current one a raised
        white lozenge. Three switchers, one shape — and the two that were
        already right are what makes the third obviously wrong.
      */
      .views {
        display: flex;
        gap: 0;
        width: fit-content;
        margin-top: var(--s5);
        padding: 3px;
        border-radius: var(--r-pill);
        background: var(--paper-3);
      }
      .view {
        display: block;
        padding: var(--s2) 20px;
        border: 0;
        border-radius: var(--r-pill);
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .view-label {
        font-family: var(--sans);
        font-size: var(--t-ui);
        font-weight: var(--w-medium);
        color: var(--ink-2);
        white-space: nowrap;
      }
      /*
        The raised one carries `--paper`, and it needs a lift to read as raised
        on a track that is only one step darker than it.
      */
      /*
        FLAT. `HerHead` draws the raised one as plain `#fff` on `#f4f4f5` and
        gives it no shadow — one step of surface is the whole signal, which is
        the same argument `--chosen-2` makes for a picked row. The lift was added
        here and it is one of the two places `tokens.css` says a small lift does
        not go.
      */
      .view[aria-current='true'] {
        background: var(--paper);
      }
      .view[aria-current='true'] .view-label {
        color: var(--ink);
      }
      .view:hover .view-label {
        color: var(--ink);
      }
      .view-head {
        display: flex;
        flex-direction: column;
      }
      .view-head:empty {
        display: none;
      }

      /* ---- the reading column, and the margin ------------------------------
        "Its structure is a printed page: a subject, a reading column, and a
        margin for apparatus." Nothing to the right of the rule is a thing you
        came to read.
      */
      /*
        THREE arrangements, one per page, and each one closes at 1280.

          her page   rail 232 + (32 + 760 + 32) + apparatus 224 = 1280
          archive    rail 232 + list 368 + (32 + 616 + 32)      = 1280
          machine    rail 232 + nav 222 + (32 + 760 + 32)       ≈ 1280

        Her page and the machine's have the same body width by different
        arithmetic, which is the delivery's own point: the pane is 760 wherever
        exactly one side column exists, and the archive is narrower because it
        has two.
      */
      .spread,
      .machine-spread {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) var(--margin-w);
      }
      /*
        The archive trades the apparatus column for the list.

        Not both: the delivery draws no apparatus on this page, and the reason is
        arithmetic rather than taste — 232 + 368 + 224 leaves 456 for a transcript
        that holds a 600px measure. What the margin would have said here is on
        the transcript's own head instead.
      */
      .spread.three {
        grid-template-columns: var(--list-w) minmax(0, 1fr);
      }
      /*
        And no apparatus column at all on this page.

        Without this the aside is a third child of a two-column grid and wraps
        onto an implicit row underneath the two it was meant to sit beside — a
        failure that clips nothing and passes every width check, which is why it
        is stated rather than left to the track count.
      */
      .spread.three > .margin {
        display: none;
      }
      /*
        AT THE FLOOR the apparatus column goes and the list narrows.

        1120 = 232 + 328 + (32 + 496 + 32), and on her page the reading column
        simply takes the width back. Collapsing rather than scaling, because a
        224px column of mono facts at 60% of its width is not a smaller version
        of itself — it is the same facts wrapped onto three lines each.

        The threshold is the DEFAULT size rather than a number between: the
        artboards draw the apparatus column at 1280 and the floor drawing does
        not have it, so those are the two arrangements that were designed.
      */
      @media (max-width: 1279px) {
        .spread {
          grid-template-columns: minmax(0, 1fr) 0;
        }
        .spread > .margin {
          display: none;
        }
        .spread.three {
          grid-template-columns: var(--list-narrow-w) minmax(0, 1fr);
        }
      }
      /* TWO tracks: the nav and the pane. `232 + 222 + (32 + 760 + 32) ≈ 1280`
         is what the delivery draws, and the third track was the thing that
         would have broken it. */
      .machine-spread {
        grid-template-columns: var(--machine-nav-w) minmax(0, 1fr);
      }
      .reading,
      .machine-pane {
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      /*
        THE GUTTERS ARE THE PADDING, and they are equal.

        24 top and 32 either side, which is what closes the width: her page is
        rail 232 + (32 + 760 + 32) + apparatus 224 = 1280. It was 26/22/32/40 —
        four different numbers, none of them the same on the two sides, so the
        column was not centred in its own track and the arithmetic could not be
        checked against anything.
      */
      .reading {
        gap: 26px;
        padding: 24px var(--s6) var(--s6);
      }
      /*
        The machine's rows carry their own rhythm — `padding: 12px 0` and a rule
        above each — so the column adds none. With both, one field sat 26px from
        the next and another 48px, for no reason either could state.

        Said ONCE. This class was declared three times, twice here and again in
        the machine's own section of the sheet: a 26px gap, then no gap, then a
        different padding. Two of the three had no effect and nothing said which.
      */
      /* The same gutter as every other pane, and the sections' own rhythm. */
      .machine-pane {
        gap: 26px;
        padding: var(--s5) var(--s6);
      }
      /*
        A section on the MACHINE's page is tighter than one on hers.

        B1 through B7 put `margin-bottom: 12px` under every heading and
        `margin: 10px 0 0` above every note. Her page is flat — A1 is one column
        of siblings at 22, heading and row alike — so the same `section()` builds
        both and only one of them wanted 22 inside it. The machine's read as
        three loose parts with no group holding them.

        12 for both joints rather than 12 and 10: the two pixels are below
        noticing and the alternative is a negative margin on the note.
      */
      .machine-pane .section {
        gap: var(--s3);
      }
      /*
        One catalogued prompt: a title, what it is for, the text, and the two
        controls that write it.

        A rule above each, like every other row on this page. They were flat
        siblings in a column with no gap, so one prompt's Save sat against the
        next one's title — twenty-seven times down the page, with nothing saying
        where one ended.
      */
      .prompt-block {
        display: flex;
        flex-direction: column;
        gap: var(--s3);
        padding: var(--s5) 0;
        border-top: var(--s-px) solid var(--rule);
      }
      .prompt-block:first-of-type {
        border-top: 0;
        padding-top: 0;
      }
      /*
        An ordinary textarea, sized by its own `rows`.

        It wore `.wake-edit` — the system prompt editor, which is `flex: 1` with
        a 220px floor and only a top edge because it fills a column and the
        column's border says where it is. Twenty-seven of those is twenty-seven
        220px voids with no box around any of them, and the `rows` this pane
        computes from the text was ignored entirely.
      */
      .prompt-box {
        width: 100%;
        resize: vertical;
        font-size: var(--t-data);
        line-height: var(--leading);
      }
      /*
        THE APPARATUS COLUMN, at the artboard's own measurements.

        224 wide, 24 and 22 of padding, and the same 22px rhythm as the page
        beside it — one rhythm in the window rather than one per column. It sat
        on `--paper-2` with 26/26/32/22 of padding, which is four numbers and a
        second surface for a column whose job is to recede.

        No fill at all now: the hairline is what separates it, which is the rule
        the whole window runs on. A pane that recedes by being a different colour
        AND by having a rule is saying it twice.
      */
      .margin {
        border-left: var(--s-px) solid var(--rule);
        padding: 24px var(--s5);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: var(--s5);
      }
      /*
        The margin's bodies carry the column's gap.

        `.margin` sets `gap: 18px` and its children are the three per-view
        bodies, so the gap never reached the blocks inside them — the same shape
        as `.sheet`, where the reading column's rhythm stopped at `#pane`. Each
        body is a column in its own right and has to say so.
      */
      #margin-hers,
      #margin-permits {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      /*
        A LABEL AND ITS FACT, tight — 4px, because the pair is one thing and the
        22px between pairs is what separates them from the next.
      */
      .margin-block {
        display: flex;
        flex-direction: column;
        gap: var(--s1);
      }
      .margin-head {
        margin: 0;
        font-family: var(--sans);
        font-size: var(--t-label-2);
        font-weight: var(--w-medium);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-3);
        max-width: none;
      }
      /*
        The fact takes full ink. It is the answer — "asleep", "14 May · 13:04",
        "built-in · no file" — and the label above it is the quiet half.
      */
      .margin-facts {
        display: flex;
        flex-direction: column;
        gap: var(--s0);
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink);
      }
      .margin-rule {
        height: var(--s-px);
        background: var(--rule);
      }

      /* ---- this machine ----------------------------------------------------
        Its own mark, and none of her colour anywhere on the page.
      */
      /*
        `#page-machine` REDEFINED her eight variables here, and the block is gone.

        Rule 6 — "the machine is not her. It gets its own page, its own mark, and
        none of her colour" — was held by overriding `--her`, `--her-hover`,
        `--her-ink`, `--her-wash`, `--her-deep`, `--her-deep-ink`, `--her-veil`
        and `--ink-brand` for this subtree, so every control inside it drew in ink
        without needing a machine variant of each rule. That was the right shape
        for a window whose chrome was washed in her hue.

        v2 spends no hue on chrome anywhere, so the rule is true of every page
        rather than arranged for this one, and four of those eight names are not
        tokens any more — the block was keeping `--ink-brand` alive by
        declaring it. A rule that holds by construction does not also need a
        selector somebody has to remember, and `rule-6` in the rendered gate is
        what says so.
      */
      /*
        THE MACHINE'S MASTHEAD, which is HerHead with a mark instead of a face.

        Same shape, same place, same job — the band that says whose page this
        is. It carried a rule under it that her page does not have, so the two
        pages disagreed about what a masthead is; the rule under the BODY does
        that separating for both.
      */
      .machine-subject {
        display: flex;
        align-items: flex-start;
        gap: 20px;
      }
      /*
        Where her face goes on her page, at the same 60px — a sunken tile with a
        small outlined square in it. It is not a picture of anything: the machine
        has no face, and drawing one would be the claim this whole page exists to
        refuse.
      */
      .machine-mark {
        width: 60px;
        height: 60px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 18px;
        background: var(--paper-3);
        color: var(--ink-2);
        font-size: var(--t-h3);
        /* The mark is DRAWN, not typed. It was `&#9636;`, so a 22px box was
           whatever face on the machine happens to carry U+25A4 — never Outfit,
           and different on a machine that has a different fallback. Two
           declarations on a pseudo-element cannot do that. */
        font-size: 0;
      }
      .machine-mark::before {
        content: '';
        width: var(--s5);
        height: var(--s5);
        border-radius: 6px;
        border: 1.5px solid var(--ink-2);
      }
      .machine-titles h1 {
        margin: 0;
        font-family: var(--sans);
        font-size: var(--t-h1);
        font-weight: var(--w-medium);
        letter-spacing: var(--track-tight);
        color: var(--ink);
      }
      /*
        13.5 in `--ink-2`, which is what B1 through B7 draw and what every other
        explanatory line on that page uses. It was 12 in `--ink-3` — the page's
        second-most-read line, set quieter than the sentences under its own
        fields.
      */
      .machine-says {
        margin: var(--s1) 0 0;
        font-family: var(--sans);
        font-size: var(--t-sm);
        color: var(--ink-2);
        max-width: none;
      }
      /*
        `padding: 22px 12px`, which is `MachineNav.dc.html`'s.

        It was `22 32 0 40`, so a 222px column gave its rows 150px of content
        against the component's 198 — and "Looking things up" wrapped onto a
        second line, making the current tab 55px tall where every other one is
        37. A nav whose rows change height depending on which is open is a
        column that moves when you use it.
      */
      .groups {
        border-right: var(--s-px) solid var(--rule);
        padding: var(--s5) var(--s3);
        overflow-y: auto;
      }
      /* ---- the day strip ---------------------------------------------------
        "A whole month at a glance. Days with nothing in them are pale and do
        not respond — they are not offering anything."

        One row of 31, a numeral over a dot. It replaced a seven-column month
        grid, which answered a question this window never asked: what day of the
        week the 14th was. The strip answers the one it does ask — when did we
        talk — and it costs one line instead of six.
      */
      /*
        ONE ROW: the month, and the days of it.

        They were on one row already and did not look it — a day cell is a
        numeral above a dot, so the strip is two lines tall, and `align-items:
        center` dropped the month to the middle of that while the numerals sat
        at the top. Aligned to the numerals now, which is the line the eye reads
        across.
      */
      /* A3's row: 18 above, 12 below, 18 between the month nav and the days. */
      .daystrip {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 18px 0 var(--s3);
      }
      .month-nav {
        display: flex;
        align-items: center;
        /* 8, A3's — it was 4, which crowded two 26px discs against the slot. */
        gap: var(--s2);
        flex: none;
      }
      .month-wrap {
        display: inline-flex;
      }
      /*
        The month is a BUTTON, because it opens something.

        It was a `<div>` between two arrows, which is a label; a label that
        opens a popover is the affordance this window has been bitten by before
        — the underline is what says it can be pressed.
      */
      /*
        A FIXED SLOT, and not an underlined word.

        Two defects in one rule. It was `border: 0; border-bottom: 1px solid` on
        a transparent ground — the third instance of the underlined-word button,
        after the rail's New/Duplicate and the foot's five, and the one my sweep
        for that class missed because the sweep also required `border-radius: 0`
        and this rule never set it.

        And it was SHRINK-TO-FIT at 12px. A6 gives it `width: 78px` at 14/500,
        and the width is the load-bearing part: "May 2026" and "September 2026"
        are different widths, so paging a month slid the `›` arrow and all
        thirty-one day cells sideways under the pointer that was pressing them.
        A fixed slot is what makes the strip hold still while it changes.
      */
      .daystrip .month {
        width: 78px;
        padding: 3px 0;
        border: var(--s-px) solid transparent;
        border-radius: var(--r-pill);
        background: transparent;
        font-family: var(--sans);
        font-size: var(--t-read);
        font-weight: var(--w-medium);
        color: var(--ink);
        text-align: center;
        white-space: nowrap;
        cursor: pointer;
      }
      /* C2 rings it while the picker it opens is up — the only time a reader
         needs to be told which control the card belongs to. */
      .daystrip .month:hover,
      .daystrip .month[aria-expanded='true'] {
        border-color: var(--ink);
      }
      /*
        The button is the ANCHOR the picker hangs off.

        A popover is in the top layer, which means its `position: absolute` is
        resolved against the viewport and NOT against whatever it sits inside —
        so `.month-wrap { position: relative }` did nothing and `left: 0` put
        the picker at the left edge of the window, in the rail, a third of the
        way down. Naming an anchor is the only way to tie a top-layer element to
        an ordinary one.
      */
      .daystrip .month {
        anchor-name: --month-button;
      }
      /*
        The picker, in the top layer.

        `popover` rather than a positioned menu: Escape and a click outside
        close it, and the top layer is what stops it being clipped by the
        column it hangs off — which this window has already had happen to a
        dropdown once.
      */
      .month-pick {
        /*
          THE ANCHORING COMES FIRST, and it is not optional.

          A popover is in the top layer, so `position: absolute` resolves
          against the window rather than against whatever it sits inside — the
          rule above gives the button an `anchor-name` and this binds to it.
          Rewriting this block to C2's numbers dropped the four declarations
          that do it, and the picker went back to the left edge of the window.
          `anchored` caught it, which is the check that exists because it
          happened once before.
        */
        position: absolute;
        position-anchor: --month-button;
        inset: auto;
        margin: 0;
        /*
          C2's card: 340 wide, a panel radius, 20/22 of padding. It was 12px of
          padding at the PART radius — the rung for a control — on a surface
          that holds three of them.
        */
        width: 340px;
        padding: 20px var(--s5);
        border: var(--s-px) solid var(--rule-2);
        border-radius: var(--r-panel);
        background: var(--paper);
        box-shadow: var(--lift-top);
        flex-direction: column;
        gap: var(--s4);
      }
      /* The year, its label and how much archive there is, on one line. */
      .month-year-row {
        display: flex;
        align-items: center;
        gap: var(--s3);
      }
      .month-year-of {
        font-family: var(--sans);
        font-size: var(--t-label);
        font-weight: var(--w-medium);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .month-year-kept {
        font-family: var(--mono);
        font-size: var(--t-data-2);
        color: var(--ink-3);
        white-space: nowrap;
      }
      .month-note {
        font-size: var(--t-cap);
      }
      /*
        `display` ONLY when it is open.

        This rule said `display: flex` unconditionally, and an author `display`
        beats the user agent's `[popover]:not(:popover-open) { display: none }`
        — author styles win over UA styles whatever the specificity. So the
        picker was painted permanently: `open=false`, `display=flex`, a 157×175
        box sitting under the month at all times.

        The exact defect `[hidden]` in the token file argues about at length,
        and the third time this window has had it: `.panel` was `display: flex`
        so an inactive tab's contents sat under the active one, `.warn` was
        `display: flex` so a chip reading "0 problems" stayed in the drawer, and
        now this. The token file carries the general protection; this rule is
        written the way that protection expects.
      */
      .month-pick:popover-open {
        display: flex;
        /*
          Under the button it belongs to, left edges aligned, and above it
          instead when there is no room below — `flip-block` is what makes that
          the browser's problem rather than a resize listener's.
        */
        top: anchor(bottom);
        left: anchor(left);
        margin-top: var(--s2);
        position-try-fallbacks: flip-block;
      }
      .month-year {
        flex: 1;
        min-width: 0;
        font-family: var(--mono);
        font-size: var(--t-cap);
      }
      .month-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        /* 6, C2's. It was 4 — the rung below — which read as a block of text
           rather than as twelve things you choose between. */
        gap: 6px;
      }
      /*
        A PILL, like every other thing in this window you choose between — the
        voices, the pronouns, the views. It was an 8px-radius box, which is the
        rung for a field.
      */
      .month-one {
        padding: var(--s2) 0;
        border: var(--s-px) solid transparent;
        border-radius: var(--r-pill);
        background: transparent;
        font-family: var(--sans);
        font-size: var(--t-cap);
        color: var(--ink);
        font-weight: var(--w-medium);
      }
      /*
        A month with nothing in it. Pale, and `disabled` in the markup so it is
        not merely a colour — C2 draws these at `#c4c4c9` and the sentence under
        the grid says why they do not respond.
      */
      .month-one:disabled {
        color: var(--ink-off);
        font-weight: var(--w-regular);
        background: transparent;
        border-color: transparent;
      }
      .month-one:hover {
        border-color: var(--rule-2);
        color: var(--ink);
      }
      /* The month being shown: solid ink, reversed out — C2's `#fff on #0a0a0b`.
         The others that have something in them carry the sunken grey. */
      .month-one:not(:disabled) {
        background: var(--paper-3);
      }
      .month-one[aria-current='true'] {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--paper);
      }
      /*
        26px discs on the sunken grey, which is what A3 and A6 draw. They were
        17px bare icons on nothing — the two controls that page the archive,
        smaller than the day cells they move.
      */
      .daystrip .step {
        width: 26px;
        height: 26px;
        padding: 0;
        border: 0;
        border-radius: var(--r-pill);
        background: var(--paper-3);
        color: var(--ink-2);
      }
      .daystrip .step:hover:not(:disabled) {
        color: var(--ink);
      }
      /*
        `--ink-off`, not `--rule-2`. A rule colour used as ink is the drift the
        two-name convention exists to prevent — and this one already has a name
        that means exactly "cannot be pressed now", deliberately under the
        contrast floor, with the gate exempting anything that also says
        `disabled`. Which this does.
      */
      .daystrip .step:disabled {
        color: var(--ink-off);
      }
      .daystrip .step svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
      }
      .strip {
        flex: 1;
        min-width: 0;
        display: grid;
        grid-template-columns: repeat(31, 1fr);
      }
      /* No day has anything in it, said where the days would be. Compounded,
         because it is added at runtime — see the check that says why. */
      .strip.strip-empty {
        display: block;
        font-family: var(--sans);
        font-size: var(--t-cap);
        color: var(--ink-3);
      }
      /*
        A day. Pale and inert unless something happened on it.

        `disabled` rather than a class, so it is the browser and the
        accessibility tree that refuse the press rather than a missing click
        handler — contract A1.
      */
      /*
        A 25px DISC, because the picked state has to have something to fill.

        The cell had no width, no height and no radius, so the only difference
        between "today" and "this day is filtering the two columns below" was a
        4px dot going to full opacity and 1.4× — and a day with nothing on it has
        no dot at all, so on a today with nothing said, the two states were
        pixel-identical. A3 draws the picked day as an ink disc with a white
        numeral, which is the strongest fill in the window, spent on the one
        control whose state decides what the rest of the page shows.

        The comment under `.day .dot` diagnoses the same failure one state over —
        a numeral moving 4.63:1 to 4.94:1, "which nobody can see". This was that,
        one step further along.
      */
      .day {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--s1);
        width: 25px;
        height: 25px;
        justify-self: center;
        padding: 0;
        border: 0;
        border-radius: var(--r-pill);
        background: transparent;
        color: var(--ink-3);
      }
      .day:disabled {
        color: var(--ink-off);
        cursor: default;
      }
      .day-n {
        font-family: var(--mono);
        font-size: var(--t-data-2);
      }
      .day.has {
        color: var(--ink-2);
      }
      .day.has:hover {
        color: var(--ink);
      }
      .day.today .day-n {
        font-weight: var(--w-medium);
        color: var(--ink);
      }
      /*
        The dot is the whole indication, so a day with nothing has none — an
        empty circle would be a mark that means "no mark".

        INK, not her colour, and the difference was a contrast failure the gate
        could not see. `--her` at 0.55 composites to about `#95b2a2` on white —
        roughly 2.2:1, under the 3.0 a mark needs — and the sweep only measures
        elements with a text child, so a 4px `<span>` with nothing in it is never
        looked at. The fallback said little: a day with conversations moves its
        numeral from `--ink-3` to `--ink-2`, 4.63:1 to 4.94:1, which nobody can
        see. So the only legible carrier of "something happened here" was the one
        mark below the floor.

        Ink at 0.55 is about 4.5:1, and the current day still separates itself by
        going to full strength and 1.4x — a difference of weight rather than hue,
        which is the whole of V4 applied to a mark.
      */
      .day .dot {
        width: var(--s1);
        height: var(--s1);
        border-radius: var(--r-pill);
        background: var(--ink);
        opacity: 0.55;
      }
      /*
        THE FILL is the picked state — A3's ink disc, white numeral.

        It was the same two declarations `today` already sets, plus a dot that
        grows. Two states cannot be told apart by a mark that one of them may not
        have.
      */
      .day[aria-current='true'] {
        background: var(--ink);
      }
      .day[aria-current='true'] .day-n {
        color: var(--paper);
        font-weight: var(--w-medium);
      }
      /* Reversed out with the numeral, or it disappears into the fill. */
      .day[aria-current='true'] .dot {
        background: var(--paper);
        opacity: 1;
      }
      /*
        How much is in the archive, in the foot beside the problem count.

        It was `.day-head` in the header — a rule with a bottom border, set to
        sit under the day strip. In the foot it is apparatus like everything else
        on that side of the bar: mono, third ink, no border of its own, because
        the bar already has one across its top.
      */
      .count-of {
        margin: 0;
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
        max-width: none;
        white-space: nowrap;
      }
      /* ---- machine: the seven groups ---------------------------------------- */
      /*
        `.machine` used to define this page's grid, and it was the SIXTH class
        collision in this stylesheet: the delivered frame gives every page a
        `.page` that is a flex column, and `.machine` — later in the sheet at
        equal specificity — turned the machine's page back into a three-column
        grid, so its header rendered beside its navigation instead of above it.

        The grid is `.machine-spread` now, defined once in the frame section
        with the delivery's own track widths. What survives here is the rule
        that COLLAPSES the third track, which is contract M2 and tested.
      */
      /*
        `.machine-tools` and its collapse rule stood here.

        A third grid track for a tool column, zeroed by
        `:not(:has(> .machine-tools > .tool-card))` whenever the aside was empty
        — which was every render of every group. `renderMachine` filled it by
        splitting a pane at its first top-level heading and no pane in
        `settings/pane/` returns one, so the card was never built and the
        `:has()` always matched.

        Deleted with the split. B1 to B7 draw no apparatus column and A7 keeps
        the capability texts in its reading column, so there is nothing for the
        track to hold; leaving it meant that the day a pane did return a heading,
        224px would appear here and the pane would drop from 760 to about 538.
      */
      /*
        The groups fill the column, so the footer under them sits at the bottom.
      */
      #nav-groups {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        gap: var(--s0);
      }
      /* What this page is NOT about, said where somebody looking for her voice
         in here would read it. */
      .nav-foot {
        margin: auto 0 0;
        padding-top: var(--s4);
        font-family: var(--sans);
        font-size: var(--t-label);
        letter-spacing: var(--track-2);
        color: var(--ink-3);
        max-width: none;
      }
      /*
        A numbered row, separated by a rule rather than boxed.

        It was a filled, rounded chip per group — six boxes down a column, which
        is the treatment "boxes are reserved for a control and a warning"
        excludes. The rule between them does the grouping and the numeral does
        the counting.
      */
      /*
        A GROUP IN THE MACHINE'S NAV, and it is the rail's row in miniature.

        The rules between them are gone. v2 groups by space and by one step of
        grey, so a list of seven items separated by six hairlines was six marks
        doing what the gap already does — and the hairlines fought the rounded
        fill of the chosen one, which cannot sit on a line it also crosses.
      */
      .tab {
        display: flex;
        align-items: center;
        gap: var(--s3);
        width: 100%;
        text-align: left;
        padding: 10px 14px;
        border: 0;
        border-radius: var(--r-card);
        background: transparent;
        color: var(--ink-2);
        font-family: var(--sans);
        font-size: var(--t-body);
        cursor: pointer;
      }
      /* The first has nothing above it to be separated from. */
      #nav-groups .tab:first-of-type {
        border-top: 0;
      }
      .tab-n {
        flex: none;
        /* A fixed column, so seven single digits line their labels up. Without
           it a "1" and a "7" are different widths and the names step sideways
           down the list. */
        width: 9px;
        font-family: var(--mono);
        font-size: var(--t-label);
        color: var(--ink-3);
      }

      /* Takes the slack, so the attention dot sits at the far end of the row
         rather than against the last letter of a name. */
      .tab-label {
        flex: 1;
        min-width: 0;
      }
      .tab:hover {
        color: var(--ink);
      }
      .tab[aria-current='true'] {
        background: var(--chosen-2);
        color: var(--ink);
        font-weight: var(--w-medium);
      }
      .tab[aria-current='true'] .tab-n {
        color: var(--ink-2);
      }
      /*
        The chip's fill and its second `aria-current` rule stood here, later in
        the sheet than the numbered-row rules above and therefore winning: the
        open group kept a filled, rounded block behind it. Chosen is weight and
        ink, and the rule between rows is the grouping.
      */
      /* A dot means somebody should look, not that something is off. */
      .tab .dot {
        width: 7px;
        height: 7px;
        border-radius: var(--r-pill);
        background: var(--rule-2);
        margin-left: auto;
        flex: none;
      }
      /*
        What this machine's Codex is worth, above the settings that depend on it.

        A CARD rather than a bare note, and drawn in both the healthy and the
        unhappy case. This used to be one red line that appeared only when the
        CLI was missing, which gave "nothing here" two meanings — everything is
        fine, and the check has not finished — for a check that genuinely has a
        not-finished-yet state.

        The colour argument here is spent — there is no `--warn-*` and no
        `--red`. What it was protecting survives in the shape: an unusable Codex
        is a machine somebody has to go and fix rather than a fault in this
        application, so the card is outlined rather than alarmed, and only when
        the state is actually KNOWN to be unusable. See `rules/readiness.ts`.
      */
      /*
        A SUNKEN PANEL, not a bordered card.

        B1 draws the readiness card as `--paper-3` at the panel radius with no
        edge at all — a recessed area on the page rather than an object sitting
        on it. A border plus a fill is two ways of saying the same boundary, and
        this window's whole vocabulary is that the fill does it.
      */
      .codex {
        display: flex;
        flex-direction: column;
        gap: var(--s2);
        padding: 18px 20px;
        border: 0;
        border-radius: var(--r-panel);
        background: var(--paper-3);
      }
      .codex.bad {
        border-color: var(--rule-2);
        background: var(--paper-3);
      }
      /*
        The light, the state, and the button — one line, in that order.

        `grow` on the sentence rather than `margin-left: auto` on the button, so
        the button is pushed by the thing it is about rather than pulling itself
        away from it. The difference shows the moment the sentence wraps: the
        button stays on the first line's baseline either way.
      */
      .codex-head {
        display: flex;
        align-items: center;
        gap: var(--s3);
      }
      .codex-said {
        flex: 1;
        min-width: 0;
        font-size: var(--t-cap);
        color: var(--ink-2);
      }
      .codex.bad .codex-said {
        color: var(--ink-2);
        font-weight: var(--w-semibold);
      }
      .codex-head .btn {
        flex: none;
      }
      /*
        THREE SHAPES, because there are three answers — and no colour at all.

        It was green when working and a neutral grey when not, on the argument
        that an unusable Codex is an errand rather than a crash so red would
        overstate it. That argument survives; the colours do not, because v2
        spends no hue on chrome. What replaced them says MORE: filled when she
        can look things up, hollow when she cannot, and a dashed ring when
        nobody knows — the third being the state a two-colour light had no way
        to draw and therefore drew as "cannot".

        8px, and no ring around the lit one. It carried `--s3` (12) with a 3px
        `--chosen-2` glow, on the argument that "an 8px dot on paper reads as a
        bullet; the glow is what makes it a light". That is an argument, and it
        is an argument against a drawing that was made: B1b draws all seven
        states at 8px flat, in a card padded 16 to 18. A stylesheet comment is
        not where a disagreement with an artboard gets settled — if the glow is
        right the board should gain it.
      */
      .light {
        width: var(--s2);
        height: var(--s2);
        flex: none;
        border-radius: var(--r-pill);
        background: var(--rule-2);
      }
      /*
        THREE shapes, because there are three answers — B1b.

        Filled means she can look things up, hollow means she cannot, and a
        dashed ring means nobody knows. The third is the one a boolean had no way
        to draw and therefore drew as "cannot" — which is how a network blip came
        to look like a broken install.

        `rules/readiness.ts` picks between them. These class names are assembled
        from that answer rather than written as literals, so
        `stylesheets.test.ts`'s correspondence check cannot see them — it reads
        the literal arguments to `element()`. Named here deliberately for that
        reason: the check that would have caught a missing rule is blind to this
        one, so the rule has to be written on purpose rather than noticed later.
      */
      .light.on {
        background: var(--ink);
      }

      /* INK, which is B1b's. `--ink-3` made the hollow one quieter than the
         dashed one, inverting the two: not-usable is a stronger claim than
         nobody-knows. */
      .light.off {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--ink);
      }

      /* `--ink-2`, B1b's `#5b5b60` — one step under the hollow one, which is
         the right order: not-usable is a firmer claim than nobody-knows. */
      .light.unknown {
        background: transparent;
        border: 1.5px dashed var(--ink-2);
      }
      .codex .note {
        margin: 0;
      }
      /*
        `.btn.arming` was here, and the pattern went with it.

        Click once to turn the label into "Really forget it all?", click again to
        erase — which contract D2 forbids and a double-click defeats, both clicks
        landing. It was the last one in the window; erasing her notes goes
        through the confirmation sheet now, like every other destruction here.
      */
      /* Her size: a slider and the number it is showing. */
      .size-row {
        display: flex;
        align-items: center;
        gap: var(--s3);
      }
      /*
        A SOLID bar, drawn here rather than by the browser.

        It had no rule at all: only a width, with the track, the fill and the
        thumb all whatever Chromium happens to give — which is a hairline with
        a hollow look and a thumb sized for a form. This window draws every
        other control it has; a slider is not an exception because styling one
        is fiddly.

        The join is a gradient reading `--along`, which `size.ts` writes on every
        `input`. Chromium can fill the left half of a native range on its own,
        through `accent-color` — and stops the moment `appearance: none` makes
        the track stylable at all, which is the trade this makes: control of
        both halves, at the cost of computing the join.
      */
      .size-slider {
        /*
          Declared here so it is a property of the control rather than a name
          the sheet hopes somebody sets — `size.ts` writes it on every `input`,
          and 100% is what a slider that has never moved should look like.
        */
        --along: 100%;
        /*
          300, and it does not grow. A slider's width is its RESOLUTION — how
          many pixels one percent is worth — so a control that is 300 on one
          window and 710 on another is two different instruments. The delivery
          fixes it at 300 and the reason is that number, not the tidiness.
        */
        width: var(--measure-slider);
        flex: none;
        min-width: 0;
        appearance: none;
        /*
          FOUR pixels, not eight. The artboard draws the track as a rule she sits
          on rather than as a bar — the thumb is the control, and a track half its
          height is what makes that read.
        */
        height: var(--s1);
        border-radius: var(--r-pill);
        background: linear-gradient(
          to right,
          var(--ink) 0 var(--along),
          var(--paper-3) var(--along) 100%
        );
        cursor: pointer;
      }
      /*
        WHITE with an edge, sitting on the track rather than filling it.

        It was ink with a paper ring, which on an ink-filled track is a bulge in
        the bar rather than a thing on it. Paper with a hairline is what the
        artboard draws, and it stays findable at either end where the fill behind
        it changes.
      */
      /*
