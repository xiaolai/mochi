<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shelf</title>
    <link rel="stylesheet" href="../design/tokens.css" />
    <style>
      /*
        1a, at 1440 x 900: her state, her characters, the one that is open.

        The layout is the artifact's — a state strip that is always first, a row
        of character cards, then a 1fr/380px body with the open character on the
        left and an inspector on the right. What fills it is only what this
        build can actually do: the artifact draws a command palette, an
        installer and per-character session stats, and drawing chrome for a
        feature that does not exist is the same failure as offering her a tool
        she cannot call.

        Every value is a token, for the reason `tokens.css` gives: a literal
        here is a place this window and the design can drift without either of
        them looking wrong.
      */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        font: var(--t-ui) / 1.5 var(--sans);
        user-select: none;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* ---- the strip that is always first ---------------------------------- */
      .topbar {
        flex: none;
        height: 60px;
        display: flex;
        align-items: center;
        gap: var(--s6);
        padding: 0 var(--s6);
        background: var(--paper-2);
        border-bottom: 1px solid var(--rule);
      }
      .wordmark {
        font-family: var(--narrow);
        font-weight: 700;
        font-size: var(--t-body);
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .divider {
        width: 1px;
        height: 22px;
        background: var(--rule);
      }
      .state {
        display: flex;
        align-items: baseline;
        gap: var(--s4);
      }
      .state .what {
        font-family: var(--narrow);
        font-size: var(--t-data);
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .state .how {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-2);
      }
      /*
        The microphone, as a pill you cannot miss. Green when it is open,
        because that is the state worth seeing from across a desk.
      */
      .pill {
        display: flex;
        align-items: center;
        flex: none;
        white-space: nowrap;
        gap: var(--s3);
        padding: var(--s0) var(--s3);
        border: 1px solid var(--rule);
        border-radius: var(--r-pill);
        background: var(--paper);
        font-family: var(--narrow);
        font-size: var(--t-data);
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-2);
      }
      .pill .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ink-3);
        flex: none;
      }
      .pill.open {
        color: var(--ink-brand);
        border-color: var(--her);
      }
      .pill.open .dot {
        background: var(--her);
      }
      .grow {
        flex: 1;
      }
      .stat {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }

      /* ---- characters ------------------------------------------------------ */
      .strip {
        flex: none;
        display: flex;
        align-items: baseline;
        gap: var(--s4);
        padding: var(--s6) var(--s6) 0;
      }
      h3 {
        margin: 0;
        font-family: var(--narrow);
        font-size: var(--t-data);
        font-weight: 700;
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--ink-3);
      }
      /*
        The band the characters sit in, and it has to BE a band. The cards were
        floating in the same undifferentiated field as the document below them,
        20px from it, so the row had no bottom and the scrolling content below
        began wherever it happened to begin. The hairline closes it.
      */
      .cards {
        flex: none;
        display: flex;
        gap: var(--s6);
        padding: var(--s5) var(--s6) var(--s7);
        border-bottom: 1px solid var(--rule);
        overflow-x: auto;
      }
      .card {
        width: 236px;
        flex: none;
        text-align: left;
        background: var(--paper-2);
        border: 1px solid var(--rule);
        border-radius: var(--r4);
        padding: var(--s5);
        color: inherit;
        font: inherit;
        cursor: default;
        display: flex;
        flex-direction: column;
        gap: var(--s4);
      }
      .card:hover {
        border-color: var(--gold);
      }
      /*
        The ring is one of the TWO jobs her colour keeps — the worn character.
        Everything else that used to be green is gold now, because a selected
        row and a focus outline are things you operate rather than things that
        say who she is. See `tokens.css`.
      */
      .card[aria-current='true'] {
        border-color: var(--her);
        box-shadow:
          var(--lift-1),
          inset 0 0 0 1px var(--her);
      }
      .card .name {
        font-size: var(--t-h3);
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .card .worn {
        font-family: var(--narrow);
        font-size: var(--t-data);
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-brand);
      }
      .card dl {
        display: grid;
        grid-template-columns: auto 1fr;
        /* 4px between rows read as a dense list rather than three facts. */
        gap: var(--s2) var(--s4);
        margin: 0;
        font-size: var(--t-sm);
      }
      .card dt {
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .card dd {
        margin: 0;
        color: var(--ink-2);
        overflow-wrap: anywhere;
      }

      /* ---- the body: what is open, and the inspector beside it ------------- */
      .body {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        /* 8px + the column's own 12px of scrollbar lane = the 20px it was. */
        gap: var(--s3);
        padding: var(--s5) var(--s6) var(--s6);
      }
      /*
        The open character's column, by id rather than by class.

        It was `.open`, and so is the microphone pill's lit state — one global
        stylesheet, two meanings, and this rule came second, so `display: flex;
        flex-direction: column; overflow-y: auto` landed on the PILL: its dot
        stacked above its label and it became a scroll container 43px tall. An
        id cannot collide with a state class, which is why the fix is here and
        not a more specific selector that would only postpone it.
      */
      #pane {
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: var(--s4);
        /*
          The 12px on the right of that padding is a lane for the scrollbar.
          macOS draws an overlay bar that reserves no width -- `scrollbar-gutter`
          cannot help, the gutter is already zero -- so without it the bar is
          painted ON the plates' right border. `.body` gives the same 12px back
          out of its column gap, so the inspector has not moved.
        */
        /*
          Content stops existing at the top of this box, and it used to do so
          against nothing: a plate was sliced through its middle by an invisible
          line 16px below a real one, which reads as a rendering fault rather
          than as "there is more above".

          The fix is where the air is, not what is drawn. The box now runs edge
          to edge between the cards' hairline and the drawer's, and carries the
          spacing as its OWN padding — so at rest there is 16px of room under
          the line, and scrolled, the content travels up through that padding
          and disappears exactly AT the line. A hairline is already this
          window's word for an edge; the topbar and the drawer both use one.

          A gradient stood here first and was worth deleting rather than
          keeping: the covers-and-shadows trick needs a scroll box whose content
          is transparent, and every plate paints `--paper-2` over the parent's
          background. It could not have worked, and it looked like it did.
        */
        margin: calc(var(--s5) * -1) 0 calc(var(--s6) * -1);
        padding: var(--s5) var(--s4) var(--s6) 0;
      }
      /*
        A plate: a labelled row with its value, what it resolved to, and the one
        thing you can do to it. Three of the four are real fields; the fourth
        says out loud that it is not.
      */
      .plate {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s5);
        border: 1px solid var(--rule);
        border-radius: var(--r3);
        background: var(--paper-2);
        padding: var(--s4) var(--s5);
      }
      .plate .label {
        font-family: var(--narrow);
        font-size: var(--t-data);
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-3);
        flex: none;
        width: 92px;
      }
      .plate .value {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: var(--s4);
      }
      .plate .value > input[type='text'],
      .plate .value > select {
        flex: none;
        width: 220px;
      }
      .plate .meta {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      /* The prompt is the one the design lifts: her own edge and an elevation. */
      .plate.prompt {
        display: block;
        border-color: var(--ink);
        box-shadow: var(--lift-1);
        padding: 0;
      }
      .plate.prompt .head {
        display: flex;
        align-items: center;
        gap: var(--s5);
        padding: var(--s4) var(--s5);
        border-bottom: 1px solid var(--rule);
      }
      .plate.prompt .head .label {
        color: var(--ink);
      }
      .plate.prompt .body-pad {
        padding: var(--s5);
      }

      pre,
      textarea {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
        padding: var(--s4);
        border: 1px solid var(--rule);
        border-radius: var(--r2);
        background: var(--paper);
        color: inherit;
        font-family: var(--mono);
        font-size: var(--t-label);
        line-height: 1.6;
        user-select: text;
      }
      /*
        A `pre` does NOT scroll on its own inside `#pane`.

        It used to: `max-height: 34vh; overflow-y: auto`, which put a second
        scrollbar a dozen pixels from the column's own, cut across the plate's
        8px corner, and made reading her notes a question of which of two bars
        the pointer happened to be over. One column, one axis, one bar. The
        inspector keeps its own, and should — `.panel` is a box of fixed height,
        not a document.
      */
      pre.empty-note {
        color: var(--ink-3);
      }

      /* ---- the inspector --------------------------------------------------- */
      aside {
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s4);
      }
      .tabs {
        flex: none;
        display: flex;
        gap: var(--s0);
      }
      .tab {
        padding: var(--s1) var(--s3);
        border: 0;
        border-radius: var(--r1);
        background: transparent;
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: 700;
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--ink-3);
        cursor: default;
      }
      .tab[aria-current='true'] {
        background: var(--gold-wash);
        color: var(--gold);
      }
      /*
        No `.panel[hidden]` here any more, and no `.warn[hidden]` either. Both
        were the same defect — an author `display` outranking the UA's rule for
        the attribute — and it is answered once, for all three windows, by
        `[hidden]` in `tokens.css`. Patching it per element is what let the
        drawer ship a chip that read "0 problems".
      */
      .panel {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s4);
        background: var(--paper-2);
        border: 1px solid var(--rule);
        border-radius: var(--r3);
        padding: var(--s5);
        overflow: hidden;
      }
      .panel h4 {
        margin: 0;
        font-family: var(--narrow);
        font-size: var(--t-data);
        font-weight: 700;
        letter-spacing: 0.1em;
      }
      .panel > pre {
        flex: 1;
        max-height: none;
      }
      .search input {
        width: 100%;
        padding: var(--s2) var(--s4);
        border: 1px solid var(--rule);
        border-radius: var(--r2);
        background: var(--paper);
        color: inherit;
        font: inherit;
        font-size: var(--t-sm);
        user-select: text;
      }
      .list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        margin: 0 calc(var(--s5) * -1) calc(var(--s5) * -1);
      }
      .entry {
        display: block;
        width: 100%;
        text-align: left;
        padding: var(--s3) var(--s5);
        border: 0;
        border-top: 1px solid var(--rule);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: default;
      }
      .entry:hover {
        background: var(--hair-soft);
      }
      .entry[aria-current='true'] {
        background: var(--gold-wash);
        box-shadow: inset 2px 0 0 var(--gold);
      }
      .entry .when {
        font-size: var(--t-sm);
        font-weight: 600;
      }
      .entry .count,
      .entry .snippet {
        font-size: var(--t-data);
        color: var(--ink-2);
      }
      .entry .snippet {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* ---- a transcript, at reading width ---------------------------------- */
      .transcript {
        max-width: var(--reading);
      }
      .turn {
        margin: 0 0 var(--s5);
      }
      .turn .who {
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: 600;
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .turn.her .who {
        color: var(--ink-brand);
      }
      .turn p {
        margin: var(--s0) 0 0;
        font-size: var(--t-body);
        white-space: pre-wrap;
        user-select: text;
      }
      .cut {
        margin-top: var(--s0);
        font-family: var(--narrow);
        font-size: var(--t-label);
        color: var(--warn-ink);
      }
      .problem {
        margin: 0 0 var(--s5);
      }
      .problem .where {
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: 600;
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--red);
      }
      .problem p {
        margin: var(--s0) 0 0;
        font-size: var(--t-sm);
        white-space: pre-wrap;
      }
      .problem .subject {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      .lead {
        margin: 0 0 var(--s5);
        font-size: var(--t-sm);
        color: var(--ink-2);
      }
      /* Every empty surface says WHICH kind of empty it is. */
      .empty {
        max-width: 46ch;
        margin: var(--s7) auto;
        text-align: center;
        font-size: var(--t-sm);
        color: var(--ink-3);
      }

      /* ---- the strip along the bottom -------------------------------------- */
      .drawer {
        flex: none;
        height: 48px;
        display: flex;
        align-items: center;
        gap: var(--s5);
        padding: 0 var(--s6);
        background: var(--paper-2);
        border-top: 1px solid var(--rule);
      }
      .handle {
        width: 46px;
        height: 4px;
        border-radius: var(--r-pill);
        background: var(--rule);
        flex: none;
      }
      .warn {
        display: flex;
        align-items: center;
        gap: var(--s2);
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--warn-ink);
        background: none;
        border: 0;
        padding: 0;
        cursor: default;
      }
      .warn .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--warn-line);
        flex: none;
      }

      /* The button treatment is `button.btn` in tokens.css — an underline
         rather than a box, so it cannot be mistaken for the select beside it. */
      :focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 1px;
      }
      input[type='text'],
      select {
        padding: var(--s2) var(--s4);
        border: 1px solid var(--rule);
        border-radius: var(--r2);
        background: var(--paper);
        color: inherit;
        font: inherit;
        font-size: var(--t-sm);
      }
      input[type='text'] {
        user-select: text;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s3);
        align-items: center;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s3);
        align-items: center;
        padding-top: var(--s5);
        border-top: 1px solid var(--rule);
      }
      .note {
        margin: var(--s2) 0 0;
        font-size: var(--t-cap);
        color: var(--ink-3);
      }
      code {
        font-family: var(--mono);
        font-size: var(--t-data);
        overflow-wrap: anywhere;
        user-select: text;
      }
      mark {
        background: var(--gold-wash);
        color: var(--gold);
        border-radius: var(--r0);
      }
      /* Says what happened, on its own opaque surface with an elevation. */
      #said {
        position: fixed;
        left: var(--s6);
        right: var(--s6);
        bottom: 56px;
        margin: 0;
        padding: var(--s3) var(--s5);
        border-radius: var(--r2);
        background: var(--paper-2);
        box-shadow: var(--lift-1);
        font-size: var(--t-sm);
      }
      #said.bad {
        color: var(--red);
        background: var(--red-bg);
      }
      #said:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="topbar">
        <span class="wordmark">mochi</span>
        <span class="divider"></span>
        <span class="state"
          ><span class="what" id="state"></span><span class="how" id="state-how"></span
        ></span>
        <span class="pill" id="mic"><span class="dot"></span><span id="mic-label"></span></span>
        <span class="grow"></span>
        <span class="stat" id="count"></span>
      </div>

      <div class="strip">
        <h3>Characters</h3>
        <span class="stat" id="characters-count"></span>
      </div>
      <div class="cards" id="characters"></div>

      <div class="body">
        <div id="pane"></div>
        <aside>
          <div class="tabs" id="tabs"></div>
          <div class="panel" id="panel-wake"></div>
          <div class="panel" id="panel-talks" hidden>
            <div class="search">
              <input id="q" type="search" placeholder="Search what was said" autocomplete="off" />
            </div>
            <div class="list" id="list"></div>
          </div>
        </aside>
      </div>

      <div class="drawer">
        <span class="handle"></span>
        <button class="warn" id="troubles" type="button" hidden>
          <span class="dot"></span><span id="troubles-label"></span>
        </button>
        <span class="grow"></span>
        <button class="btn" id="export" type="button">Export…</button>
        <button class="btn" id="settings" type="button">Settings…</button>
      </div>
    </div>
    <p id="said" role="status" aria-live="polite"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
