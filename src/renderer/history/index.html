<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mochi</title>
    <link rel="stylesheet" href="../design/tokens.css" />
    <style>
      /*
        1a, at 1440 x 900: her state, her characters, the one that is open.

        The layout is the artifact's — a state strip that is always first, a row
        of character cards, then a 1fr/380px body with the open character on the
        left and an inspector on the right. What fills it is only what this
        build can actually do: the artifact draws a command palette, an
        installer and per-character session stats, and drawing chrome for a
        feature that does not exist is the same failure as offering her a tool
        she cannot call.

        Every value is a token, for the reason `tokens.css` gives: a literal
        here is a place this window and the design can drift without either of
        them looking wrong.
      */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        font: var(--t-ui) / 1.5 var(--sans);
        user-select: none;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* ---- the strip that is always first ----------------------------------
        Only what is true on every page: the mark, and her state. The three
        places and the search field used to live here too, which put the
        window's navigation and one pane's control on the same strip as a fact
        about the running app. Navigation is the rail's job now and search
        belongs to the view that searches.
      */
      .topbar {
        height: var(--topbar-h);
        flex: none;
        display: flex;
        align-items: center;
        gap: var(--s2);
        padding: 0 14px 0 var(--s3);
        background: var(--paper-2);
        border-bottom: var(--s-px) solid var(--rule);
      }
      .mark {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .wordmark {
        font-family: var(--sans);
        font-size: var(--t-cap);
        font-weight: var(--w-medium);
        letter-spacing: var(--track-narrow);
        color: var(--ink-2);
      }
      .grow {
        flex: 1;
      }
      /* Apparatus: what she is doing, and the keys that change it. */
      .state {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: var(--mono);
        font-size: var(--t-data-2);
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: var(--track-2);
      }
      .state .how {
        text-transform: none;
        letter-spacing: 0;
      }
      .mic {
        display: flex;
        align-items: center;
        flex: none;
        color: var(--ink-3);
      }
      .mic svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
      }
      .mic.open {
        color: var(--her);
      }
      .mic.open .cap {
        fill: currentColor;
        stroke: none;
      }
      .mic {
        position: relative;
      }
      .ghost {
        position: absolute;
        width: var(--s-px);
        height: var(--s-px);
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* ---- the frame: a rail, and one page at a time -----------------------
        The rail is the window's table of contents and it never goes away. A
        character list that appears on one tab only is a list you have to
        navigate to in order to find out what you could navigate to.
      */
      .frame {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .rail {
        width: var(--rail-w);
        flex: none;
        display: flex;
        flex-direction: column;
        background: var(--paper-2);
        border-right: var(--s-px) solid var(--rule);
        padding-top: var(--s4);
        overflow-y: auto;
      }
      .rail-head,
      .rail-says {
        margin: 0;
        font-family: var(--sans);
        font-size: var(--t-label);
        font-weight: var(--w-medium);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--ink-3);
        padding: 0 18px var(--s3);
        max-width: none;
      }
      .rail-cast {
        display: flex;
        flex-direction: column;
      }
      /*
        A row, and the chosen one gets a BAR.

        The 21px left padding on an unchosen row is the bar's 3px paid back, so
        every name starts on the same vertical line whether or not it is chosen
        — a list whose text shifts sideways as the selection moves is one that
        reads as two lists.
      */
      .rail-row {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 9px 18px 9px 21px;
        border: 0;
        border-left: var(--chosen-bar) solid transparent;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .rail-row:hover {
        background: var(--paper);
      }
      .rail-row[aria-current='true'] {
        background: var(--paper);
        border-left-color: var(--her);
        padding-left: 18px;
      }
      /* Rule 6: the machine gets none of her colour, so its bar is ink. */
      .rail-machine[aria-current='true'] {
        border-left-color: var(--ink-2);
      }
      .rail-row .tile {
        flex: none;
      }
      /*
        A character who named a face and did not get it — contract C4.

        Dashed and empty rather than the built-in standing in for her: the face
        is the one thing that tells two characters apart, so substituting it
        makes the list stop doing its only job, and it looks deliberate.
      */
      .who-band.faceless .tile,
      .rail-row.faceless .tile {
        /*
          SIZED here, and it has to be.

          `faceTile` refuses to draw a face it does not have and returns a bare
          `<canvas>` — deliberately, so the tile is empty rather than showing
          somebody else, and deliberately without width or height attributes so
          it draws nothing at all. `faceTile` gives it its own width and height
          now, so the size is not this rule's job; what IS this rule's job is
          saying that the absence is deliberate.

          Dashed, so it reads as a marked absence rather than as a picture that
          failed to load — which is the whole reason the size could move into
          the element in the first place.
        */
        border: var(--s-px) dashed var(--rule-2);
        border-radius: var(--r-control);
      }
      .rail-titles {
        display: flex;
        flex-direction: column;
        gap: var(--s-px);
        /* `flex: 1` with `min-width: 0`, both. Without the second a flex item
           refuses to shrink below its content, so a long name pushes the row
           wider than the rail instead of ellipsing — which is how "Wisp" and
           "worn now" came to need 368px in a 206px column. */
        flex: 1;
        min-width: 0;
      }
      .rail-name {
        font-family: var(--serif);
        font-size: var(--t-sm);
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rail-worn,
      .rail-stat {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--sans);
        font-size: var(--t-label);
        letter-spacing: var(--track-2);
        text-transform: uppercase;
        color: var(--ink-3);
      }
      /*
        Making and deleting characters: WORDS, not boxes.

        "Rules do the grouping. Boxes are reserved for the two things that need
        one: a control and a warning." Four bordered buttons stacked under a
        list of two characters made the making of characters heavier than the
        characters, which is the wrong way round on a rail whose job is saying
        who exists.

        The name field keeps its box, because an empty field with no edge is a
        placeholder floating over paper — the one case `tokens.css` argues a box
        IS needed.
      */
      .rail-make {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: var(--s1) 14px;
        padding: var(--s4) 18px 0;
      }
      .rail-make .row {
        display: contents;
      }
      .rail-make input[type='text'] {
        flex: 1 1 100%;
        min-width: 0;
        font-size: var(--t-cap);
      }
      .rail-make .btn {
        min-height: 0;
        min-width: 0;
        padding: 0;
        border: 0;
        border-bottom: var(--s-px) solid transparent;
        border-radius: 0;
        background: transparent;
        font-family: var(--sans);
        font-size: var(--t-cap);
        font-weight: var(--w-regular);
        color: var(--ink-2);
      }
      .rail-make .btn:hover:not(:disabled) {
        color: var(--ink);
        border-bottom-color: var(--rule-2);
      }
      .rail-make .btn.primary {
        color: var(--ink);
        font-weight: var(--w-medium);
      }
      /* The destructive one stays legible and stays a word. It is red, and it
         is not a box, which is the delivery's own rule for it. */
      .rail-make .btn.bad {
        color: var(--red);
      }
      .rail-foot {
        margin-top: auto;
        padding-bottom: var(--s3);
      }
      .rail-rule {
        height: var(--s-px);
        background: var(--rule);
        margin: var(--s4) 18px var(--s2);
      }
      .rail-machine {
        justify-content: space-between;
      }
      .rail-machine .rail-name {
        font-family: var(--sans);
        font-size: var(--t-ui);
      }

      /* ---- a page ----------------------------------------------------------
        Two of them, and only one on screen. `[hidden]` in the token file is
        what actually hides the other, with `!important`, for the reason stated
        there.
      */
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .page {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .head {
        flex: none;
        padding: var(--s6) var(--s7) 0;
      }
      .subject {
        display: flex;
        align-items: center;
        gap: 26px;
        padding-bottom: var(--s5);
      }
      .subject:empty {
        display: none;
      }
      /*
        The three views, as a sub-navigation under her name.

        Numbered, because they are parts of one document rather than
        destinations — I, II, III reads as a contents list and Cast/Archive/
        Machine reads as three apps sharing a window.
      */
      .views {
        display: flex;
        gap: var(--s6);
        border-bottom: var(--s-px) solid var(--rule-2);
      }
      .view {
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 0 0 9px;
        border: 0;
        border-bottom: var(--chosen-underline) solid transparent;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .view-numeral {
        font-family: var(--mono);
        font-size: var(--t-nano);
        letter-spacing: var(--track);
        color: var(--ink-3);
      }
      .view-label {
        font-family: var(--serif);
        font-size: var(--t-h3);
        color: var(--ink-3);
        white-space: nowrap;
      }
      .view[aria-current='true'] {
        border-bottom-color: var(--her);
      }
      .view[aria-current='true'] .view-label,
      .view[aria-current='true'] .view-numeral {
        color: var(--ink);
      }
      .view:hover .view-label {
        color: var(--ink-2);
      }
      .view-head {
        display: flex;
        flex-direction: column;
      }
      .view-head:empty {
        display: none;
      }

      /* ---- the reading column, and the margin ------------------------------
        "Its structure is a printed page: a subject, a reading column, and a
        margin for apparatus." Nothing to the right of the rule is a thing you
        came to read.
      */
      .spread,
      .machine-spread {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) var(--margin-w);
      }
      .machine-spread {
        grid-template-columns: var(--machine-nav-w) minmax(0, 1fr) var(--margin-w);
      }
      .reading,
      .machine-pane {
        min-width: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 26px;
        padding: 26px var(--s5) var(--s6) var(--s7);
      }
      .margin {
        border-left: var(--s-px) solid var(--rule);
        background: var(--paper-2);
        padding: 26px 26px var(--s6) var(--s5);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .margin-block {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .margin-head {
        margin: 0;
        font-family: var(--sans);
        font-size: var(--t-label);
        font-weight: var(--w-medium);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--ink-3);
        max-width: none;
      }
      .margin-facts {
        display: flex;
        flex-direction: column;
        gap: var(--s0);
        font-family: var(--mono);
        font-size: var(--t-data-2);
        color: var(--ink-2);
      }
      .margin-rule {
        height: var(--s-px);
        background: var(--rule);
      }

      /* ---- this machine ----------------------------------------------------
        Its own mark, and none of her colour anywhere on the page.
      */
      .machine-subject {
        display: flex;
        align-items: center;
        gap: var(--s5);
        padding-bottom: var(--s5);
        border-bottom: var(--s-px) solid var(--rule-2);
      }
      .machine-mark {
        width: 52px;
        height: 52px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        border: var(--s-px) solid var(--rule-2);
        border-radius: var(--r-control);
        color: var(--ink-3);
        font-size: var(--t-h2);
      }
      .machine-titles h1 {
        margin: 0;
        font-family: var(--serif);
        font-size: var(--t-h1);
        font-weight: var(--w-regular);
        color: var(--ink);
      }
      .machine-says {
        margin: var(--s1) 0 0;
        font-family: var(--sans);
        font-size: var(--t-cap);
        color: var(--ink-3);
        max-width: none;
      }
      .groups {
        border-right: var(--s-px) solid var(--rule);
        padding: var(--s5) var(--s6) 0 var(--s7);
        overflow-y: auto;
      }
      /* ---- the day strip ---------------------------------------------------
        "A whole month at a glance. Days with nothing in them are pale and do
        not respond — they are not offering anything."

        One row of 31, a numeral over a dot. It replaced a seven-column month
        grid, which answered a question this window never asked: what day of the
        week the 14th was. The strip answers the one it does ask — when did we
        talk — and it costs one line instead of six.
      */
      .daystrip {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 0 var(--s3);
      }
      .daystrip .head {
        display: flex;
        align-items: center;
        gap: var(--s2);
        flex: none;
      }
      .daystrip .month {
        font-family: var(--sans);
        font-size: var(--t-cap);
        font-weight: var(--w-medium);
        color: var(--ink-2);
        white-space: nowrap;
      }
      .daystrip .step {
        display: flex;
        padding: var(--s0);
        border: 0;
        background: transparent;
        color: var(--ink-3);
        cursor: pointer;
      }
      .daystrip .step:hover:not(:disabled) {
        color: var(--ink);
      }
      .daystrip .step:disabled {
        color: var(--rule-2);
      }
      .daystrip .step svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
      }
      .strip {
        flex: 1;
        min-width: 0;
        display: grid;
        grid-template-columns: repeat(31, 1fr);
      }
      /*
        A day. Pale and inert unless something happened on it.

        `disabled` rather than a class, so it is the browser and the
        accessibility tree that refuse the press rather than a missing click
        handler — contract A1.
      */
      .day {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--s1);
        padding: 0 0 var(--s1);
        border: 0;
        background: transparent;
        color: var(--ink-3);
        cursor: pointer;
      }
      .day:disabled {
        color: var(--rule-2);
        cursor: default;
      }
      .day-n {
        font-family: var(--mono);
        font-size: var(--t-nano);
      }
      .day.has {
        color: var(--ink-2);
      }
      .day.has:hover {
        color: var(--ink);
      }
      .day.today .day-n {
        font-weight: var(--w-medium);
        color: var(--ink);
      }
      /* The dot is the whole indication, so a day with nothing has none — an
         empty circle would be a mark that means "no mark". */
      .day .dot {
        width: var(--s1);
        height: var(--s1);
        border-radius: var(--r-pill);
        background: var(--her);
        opacity: 0.55;
      }
      .day[aria-current='true'] .day-n {
        color: var(--ink);
        font-weight: var(--w-medium);
      }
      .day[aria-current='true'] .dot {
        opacity: 1;
        transform: scale(1.4);
      }
      /* The day being read, and how many are on it. */
      .day-head {
        margin: 0;
        display: flex;
        align-items: baseline;
        gap: var(--s3);
        padding-bottom: 10px;
        border-bottom: var(--s-px) solid var(--rule);
        font-family: var(--sans);
        font-size: var(--t-cap);
        color: var(--ink-3);
        max-width: none;
      }
      /* ---- machine: the six groups, as they were ---------------------------- */
      /*
        `.machine` used to define this page's grid, and it was the SIXTH class
        collision in this stylesheet: the delivered frame gives every page a
        `.page` that is a flex column, and `.machine` — later in the sheet at
        equal specificity — turned the machine's page back into a three-column
        grid, so its header rendered beside its navigation instead of above it.

        The grid is `.machine-spread` now, defined once in the frame section
        with the delivery's own track widths. What survives here is the rule
        that COLLAPSES the third track, which is contract M2 and tested.
      */
      /*
        NO EMPTY THIRD COLUMN.

        Two of the seven panes emit a tool list -- `may do` and `prompts`, the
        ones whose `h3` `main.ts` splits the render on. The other five leave the
        aside empty, and the track was 320px regardless: `Hearing you`,
        `On screen`, `Keys`, `Looking things up` and `About` each gave up 320px
        of a pane to a column with nothing in it. That is what made their fields
        stop short of the window with dead space to the right.

        `:has` rather than a class `main.ts` toggles, because the sheet can ask
        the question the renderer has ALREADY answered by building the card or
        not. A toggled class is a second copy of that fact, and a second copy
        can disagree -- which is the failure this window has had three times
        from class names alone.

        The aside leaves the flow as well as the track being zeroed.
        `.machine-tools` carries padding, and padding on a zero-width track
        still draws: the column would be gone and a sliver of it would remain.

        The cost is a reflow when moving between a pane with tools and one
        without. That is the right way round -- five panes are full width, and
        two shift once on arrival.
      */
      .machine-spread:not(:has(> .machine-tools > .tool-card)) {
        grid-template-columns: var(--machine-nav-w) minmax(0, 1fr) 0;
      }
      .machine-spread:not(:has(> .machine-tools > .tool-card)) > .machine-tools {
        display: none;
      }
      /* The tool list, beside the grants that decide which rows it has. */
      .machine-tools {
        min-height: 0;
        overflow-y: auto;
        padding: var(--s5) var(--s6) var(--s6) 0;
      }
      /*
        NOT `.card`, which in this window means a CHARACTER card.
        
        It was, for one build. `.card .name` sets `--t-h3` for a character's
        name, so every tool name rendered at 21px and `recall_conversations`
        wrapped mid-word. Measured, not noticed: 21px where 13 was asked for.
        The third collision this window has had from a generic class name, and
        the reason `stylesheets.test.ts` checks the ones the renderer creates.
      */
      .machine-tools > .tool-card {
        background: var(--paper-2);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r3);
        padding: var(--s5);
      }
      /*
        The groups fill the column, so the footer under them sits at the bottom.
      */
      #nav-groups {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        gap: var(--s0);
      }
      /* What this page is NOT about, said where somebody looking for her voice
         in here would read it. */
      .nav-foot {
        margin: auto 0 0;
        padding-top: var(--s4);
        font-family: var(--sans);
        font-size: var(--t-label);
        letter-spacing: var(--track-2);
        color: var(--ink-3);
        max-width: none;
      }
      .machine-pane {
        min-height: 0;
        overflow-y: auto;
        padding: var(--s5) var(--s6) var(--s6);
      }
      /*
        A numbered row, separated by a rule rather than boxed.

        It was a filled, rounded chip per group — six boxes down a column, which
        is the treatment "boxes are reserved for a control and a warning"
        excludes. The rule between them does the grouping and the numeral does
        the counting.
      */
      .tab {
        display: flex;
        align-items: baseline;
        gap: 10px;
        width: 100%;
        text-align: left;
        padding: 7px 0;
        border: 0;
        border-top: var(--s-px) solid var(--rule);
        border-radius: 0;
        background: transparent;
        color: var(--ink-2);
        font-family: var(--serif);
        font-size: var(--t-sm);
        cursor: pointer;
      }
      /* The first has nothing above it to be separated from. */
      #nav-groups .tab:first-of-type {
        border-top: 0;
      }
      .tab-n {
        font-family: var(--mono);
        font-size: var(--t-nano);
        color: var(--ink-3);
      }
      .tab:hover {
        color: var(--ink);
      }
      .tab[aria-current='true'] {
        color: var(--ink);
        font-weight: var(--w-medium);
      }
      .tab[aria-current='true'] .tab-n {
        color: var(--ink-2);
      }
      /*
        The chip's fill and its second `aria-current` rule stood here, later in
        the sheet than the numbered-row rules above and therefore winning: the
        open group kept a filled, rounded block behind it. Chosen is weight and
        ink, and the rule between rows is the grouping.
      */
      /* A dot means somebody should look, not that something is off. */
      .tab .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--warn-line);
        margin-left: auto;
        flex: none;
      }
      /*
        What this machine's Codex is worth, above the settings that depend on it.

        A CARD rather than a bare note, and drawn in both the healthy and the
        unhappy case. This used to be one red line that appeared only when the
        CLI was missing, which gave "nothing here" two meanings — everything is
        fine, and the check has not finished — for a check that genuinely has a
        not-finished-yet state.

        `--warn-*` rather than `--red`: an unusable Codex is a machine somebody
        has to go and fix, not a fault in this application, and the same family
        marks the problems chip in the drawer for the same reason.
      */
      .codex {
        display: flex;
        flex-direction: column;
        gap: var(--s2);
        margin-bottom: var(--s5);
        padding: var(--s4) var(--s5);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r3);
        background: var(--paper-2);
      }
      .codex.bad {
        border-color: var(--warn-line);
        background: var(--warn-bg);
      }
      /*
        The light, the state, and the button — one line, in that order.

        `grow` on the sentence rather than `margin-left: auto` on the button, so
        the button is pushed by the thing it is about rather than pulling itself
        away from it. The difference shows the moment the sentence wraps: the
        button stays on the first line's baseline either way.
      */
      .codex-head {
        display: flex;
        align-items: center;
        gap: var(--s3);
      }
      .codex-said {
        flex: 1;
        min-width: 0;
        font-size: var(--t-cap);
        color: var(--ink-2);
      }
      .codex.bad .codex-said {
        color: var(--warn-ink);
        font-weight: var(--w-semibold);
      }
      .codex-head .btn {
        flex: none;
      }
      /*
        Green when it is working, and NOT red when it is not.

        `--ok` is the fourth status family and the only one that means "this is
        fine" — see `tokens.css` for why it is fixed rather than hers, and for
        the measurements. Unlit is `--warn-line`, not `--red`: an unusable Codex
        is a machine somebody has to go and fix, not a fault in this
        application, and red would make an errand look like a crash.

        A ring around the lit one only. An 8px dot of colour on paper reads as a
        bullet; the glow is what makes it a light, and it should only be there
        when there is something to be pleased about.
      */
      .light {
        width: var(--s3);
        height: var(--s3);
        flex: none;
        border-radius: 50%;
        background: var(--warn-line);
      }
      .light.on {
        background: var(--ok);
        box-shadow: 0 0 0 3px var(--ok-wash);
      }
      .codex .note {
        margin: 0;
      }
      /* A destructive button that has been armed and wants a second press. */
      .btn.arming {
        color: var(--red);
        border-color: var(--red);
      }
      /* Her size: a slider and the number it is showing. */
      .size-row {
        display: flex;
        align-items: center;
        gap: var(--s3);
      }
      .size-slider {
        flex: 1 1 auto;
        min-width: 0;
      }
      .size-reading {
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
        min-width: 4ch;
        text-align: right;
      }
      .field {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: var(--s5);
        align-items: center;
        padding: var(--s3) 0;
      }
      .field > label {
        color: var(--ink-2);
        font-size: var(--t-sm);
      }
      .grant {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--s5);
        padding: var(--s4) 0;
        border-bottom: var(--s-px) solid var(--rule);
      }
      .grant .name,
      .cap .name {
        font-weight: var(--w-semibold);
      }
      .grant .desc,
      .cap .desc {
        margin: var(--s0) 0 0;
        font-size: var(--t-sm);
        color: var(--ink-2);
      }
      .grant .right {
        text-align: right;
        flex: none;
      }
      .grant .switch {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--s2);
      }
      .grant .used {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      .cap {
        padding: var(--s4) 0;
        border-bottom: var(--s-px) solid var(--rule);
      }
      .cap .name {
        font-family: var(--mono);
        font-size: var(--t-sm);
        color: var(--gold);
      }
      .folder {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s5);
        padding: var(--s3) 0;
        border-bottom: var(--s-px) solid var(--rule);
      }
      /*
        A field and the button that fills it, on one line.

        The button sits AFTER the input and does not grow: the field is the part
        that has to be readable at a glance -- a workspace is a long path -- and
        a two-column grid would give a four-word button as much room as it.
      */
      .picker {
        display: flex;
        align-items: center;
        gap: var(--s3);
        min-width: 0;
      }
      .picker > input {
        flex: 1 1 auto;
        min-width: 0;
      }
      .picker > .btn {
        flex: none;
      }
      .folder .refused {
        font-size: var(--t-data);
        color: var(--red);
      }
      .keys-right {
        display: flex;
        align-items: center;
        gap: var(--s3);
        flex: none;
      }
      /*
        The combination, as the control that changes it.

        Monospaced and fixed-width so a row does not jump as the label swaps
        between a combination and "Press a combination…" -- a button that
        resizes under the pointer is one that gets mis-clicked.
      */
      .btn.key {
        font-family: var(--mono);
        font-size: var(--t-data);
        min-width: 18ch;
        text-align: center;
      }
      /*
        Listening. It takes HER colour rather than a warning colour: nothing is
        wrong, the control is waiting, and her colour is the one thing on screen
        that already means "this is live".

        `--her`, not `--accent`. There is no `--accent` — `accent.ts` renamed it
        and says why — and a rule naming one would have been a state that draws
        exactly like the resting one, which is a capture control with no way to
        tell whether it is capturing.
      */
      .btn.key.listening {
        border-color: var(--her);
        color: var(--her);
      }
      .note.bad {
        color: var(--red);
      }

      /* ---- the day's conversations, and the one being read ------------------
        A list of what was said on the chosen day, above the transcript. Rows
        rather than cards, and rules rather than boxes: "Rules do the grouping.
        Boxes are reserved for the two things that need one: a control and a
        warning."
      */
      .list {
        display: flex;
        flex-direction: column;
      }
      /* The day being read, and how many are on it. */
      .picked {
        display: flex;
        align-items: baseline;
        gap: var(--s3);
        padding-bottom: 10px;
        border-bottom: var(--s-px) solid var(--rule);
      }
      .picked .what {
        font-family: var(--serif);
        font-size: var(--t-h3);
        color: var(--ink);
      }
      .stat {
        font-family: var(--mono);
        font-size: var(--t-data-2);
        color: var(--ink-3);
      }
      .entry {
        display: flex;
        align-items: center;
        gap: var(--s3);
        width: 100%;
        padding: 9px 0;
        border: 0;
        border-bottom: var(--s-px) solid var(--rule);
        border-left: var(--chosen-bar) solid transparent;
        padding-left: var(--s3);
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .entry:hover {
        background: var(--paper-2);
      }
      /*
        Chosen is a BAR and a word, never a fill alone: her hue behind a chosen
        row measures 1.01:1 against the surface on some characters, and a fill
        nobody can see is not a state.
      */
      .entry[aria-current='true'] {
        background: var(--her-wash);
        border-left-color: var(--her);
      }
      .entry .when {
        display: flex;
        align-items: center;
        gap: var(--s2);
        font-family: var(--mono);
        font-size: var(--t-data-2);
        color: var(--ink-2);
      }
      /*
        The box that says whether this row is picked for deletion.

        A CHARACTER, not a styled square: it has to be legible without colour
        and it has to survive being read aloud, and `☐` / `☑` do both without
        the row having to carry a real checkbox it would then have to keep in
        step with the selection.
      */
      .tick {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      .entry[data-picked='true'] .tick {
        color: var(--her);
      }
      /* Only while a selection is being made, so the column of boxes is not a
         permanent invitation to delete something. */
      .list:not(.picking) .tick {
        display: none;
      }
      .fact {
        display: inline-flex;
        align-items: center;
        gap: var(--s1);
        color: var(--ink-3);
      }
      .fact svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
      }
      /* ---- what she is told, in the margin ---------------------------------
        The three-column Cast tab is gone: a list of characters down the left, her
        sheet in the middle and a "next wake" panel down the right. The list is
        the rail now and the panel is the margin of view III, which is where it
        belongs — what she is TOLD she can do is apparatus for what she may do,
        not a third column standing beside her name.
      */
      /*
        How tall the system prompt panel's two views are, at least.

        A local custom property rather than the number twice: the whole point is
        that the readout and the editor cannot disagree, and two literals is
        exactly how they would come to. It went missing when the three-column
        Cast tab's rules were replaced, and `design-values.test.ts` caught it —
        an undefined custom property makes the whole declaration invalid at
        computed-value time, so the panel simply had no floor.
      */
      #app {
        --wake-floor: 220px;
      }

      /* ---- the controls the sections hold ---------------------------------- */
      /*
        A LIST BOX is not a dropdown, and the field rules in `tokens.css` are
        written for a dropdown.

        `Hearing you` asks which languages are spoken and the answer is genuinely
        plural, so that control is `multiple` with `size = 8`. Three of the rules
        it inherits are wrong for that, and together they left it with no visible
        box at all:

        - `appearance: none` strips the native list frame. On a collapsed select
          that frame is replaced by the border and fill; on a list box nothing
          replaced it.
        - The border and background are TRANSPARENT at rest. That is the quiet
          treatment, and it rests on there being something to read — a collapsed
          select always shows its value, and eight rows with no frame are not a
          control.
        - The chevron is drawn at `top 50%`, so on a tall list it floats in the
          middle of the rows pointing at nothing that opens.

        So: no chevron, no room reserved for one, and the box drawn at rest.
      */
      select[multiple] {
        background-image: none;
        padding-right: var(--s2);
        border-color: var(--rule-2);
        background-color: var(--paper);
      }
      /*
        FOCUS is left exactly as it is for every other field: the fill without
        the border, so the focus outline is not doubled by a hairline a pixel
        inside it. Restated here only because the rule above is later in the
        cascade at equal specificity and would otherwise win.
      */
      select[multiple]:focus {
        border-color: transparent;
      }
      /*
        Which words she takes: three choices, not a dropdown of three.

        A TRACK with a pill inside it, rather than a pill-shaped group whose
        current item is a full-bleed segment of it. Under the old rule the group
        carried the only radius and `overflow: hidden` clipped the fill to it —
        so the selected item was a rectangle in the middle and a half-pill at
        either end, and which shape it had depended on where it happened to sit
        in the list rather than on it being selected.

        The inner pill is also the shape the voice row beside it uses for the
        same job, so the pane now says "this one" one way instead of two.
      */
      .switchers {
        display: inline-flex;
        gap: var(--s0);
        padding: var(--s0);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r-pill);
      }
      .switchers button {
        border: 0;
        border-radius: var(--r-pill);
        background: transparent;
        padding: var(--s1) var(--s4);
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: var(--w-bold);
        letter-spacing: var(--track-2);
        text-transform: uppercase;
        color: var(--ink-3);
        cursor: default;
      }
      .switchers button:hover:not([aria-current='true']) {
        background: var(--paper-hover);
        color: var(--ink);
      }
      .switchers button[aria-current='true'] {
        background: var(--her-deep);
        color: var(--her-deep-ink);
      }
      /* Eight themes, drawn as her rather than as swatches of paint. */
      .themes {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
      }
      .theme {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: var(--r3);
        background: transparent;
        padding: 0;
        cursor: default;
      }
      .theme:hover {
        background: var(--paper-hover);
      }
      /*
        A FILL, not a box — the same answer the cast rows and the Machine nav
        give, and for the same reason: an outline is a shape and a wash is a
        state. Eight boxed swatches in a row read as eight buttons with one of
        them focused, rather than as one of eight colours being the one she is.
      */
      .theme[aria-current='true'] {
        background: var(--chrome-wash);
      }
      /*
        Ten voices as pills rather than a closed dropdown.

        They are all one word and the whole set fits in the width the dropdown
        would have taken shut, so a `<select>` here hid ten answers to save no
        room. The avatar list keeps its select: that one is as long as somebody's
        folder and has no bounded set to draw.
      */
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
      }
      .pills button {
        display: inline-flex;
        align-items: center;
        gap: var(--s2);
        padding: var(--s2) var(--s4);
        border: 0;
        border-radius: var(--r-pill);
        background: var(--paper-2);
        box-shadow: inset 0 0 0 1px var(--rule);
        color: var(--ink-2);
        font: inherit;
        font-size: var(--t-sm);
        cursor: default;
      }
      /*
        The mark on a recommended voice, and on the sentence that explains it.

        HER colour rather than the warning family: this is a suggestion, not
        something wrong. `--her-deep` so it carries against both the pill's
        `--paper-2` and the selected pill's `--her-wash`, where plain `--her`
        would nearly vanish.

        The word "recommended" is in the button's accessible name — see
        `chooser` — because an icon alone is only a statement to somebody
        already looking at it.
      */
      .pills .dot,
      .note .dot {
        width: var(--s2);
        height: var(--s2);
        border-radius: 50%;
        background: var(--her-deep);
        flex: none;
      }
      .note .dot {
        display: inline-block;
        vertical-align: middle;
      }
      .pills button:hover {
        box-shadow: inset 0 0 0 1px var(--ink-3);
        color: var(--ink);
      }
      .pills button[aria-current='true'] {
        background: var(--her-wash);
        box-shadow: inset 0 0 0 1px var(--her);
        color: var(--ink-brand);
        font-weight: var(--w-semibold);
      }
      /* The moods grid: eight tiles, each with the switch that decides it. */
      .moods {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: var(--s3);
      }
      .mood {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--s1);
        padding: var(--s4) var(--s3);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r3);
        background: var(--paper-2);
        text-align: center;
      }
      /*
        The face is a control now: click it to see that expression on her.

        Bare of every button default — a `<button>` does not inherit `font`, and
        it arrives with its own border, background and padding, all of which
        would draw a second box around a drawing that is already inside one.

        The affordance is the WASH, appearing on hover. A permanent outline
        around eight faces would read as eight buttons rather than as eight
        faces, which is the wrong subject: the drawing is what somebody came to
        this grid to look at.
      */
      .mood-try {
        display: block;
        padding: var(--s1);
        border: 0;
        border-radius: var(--r3);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: default;
      }
      .mood-try:hover {
        background: var(--paper-hover);
      }
      /* Dimmed with the tile it sits in, so a face she may not use does not
         advertise itself more loudly than one she may. Still clickable — being
         able to look at one before enabling it is the point. */
      .mood.off .mood-try:hover {
        background: var(--hair-soft);
      }
      .mood.off {
        border-style: dashed;
        background: transparent;
      }
      .mood.off .tile {
        opacity: 0.4;
      }
      .mood .name {
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: var(--w-bold);
        letter-spacing: var(--track-2);
        text-transform: uppercase;
      }
      .mood .when {
        font-size: var(--t-data);
        color: var(--ink-3);
        min-height: 2.4em;
      }
      .mood .allow {
        display: flex;
        align-items: center;
        gap: var(--s2);
        font-family: var(--narrow);
        font-size: var(--t-nano);
        letter-spacing: var(--track-2);
        text-transform: uppercase;
        color: var(--ink-3);
      }

      /* ---- what she will be told, down the right --------------------------- */
      /*
        The panel IS the column, not a block sitting at the top of one.

        `.cast-wake` is a grid item and stretches to the full height of the row;
        this was content-sized inside it, so `flex: 1` on the box below had no
        free space to distribute and the writing surface stopped dead at its
        220px floor. On a full-height window that left several hundred pixels of
        blank paper under the box you write paragraphs in.

        Filling the column is what lets the box grow to the sidebar, and what
        gives Save and Cancel a bottom edge to sit on instead of following the
        text up to wherever it happened to end.
      */
      #panel-wake {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s2);
      }
      /*
        CENTRE, not baseline. The count beside the heading is mono and the
        heading is narrow-caps; aligning their baselines pushed the h3 down by
        the difference between two fonts' metrics, which is how one of these two
        columns ended up with its title 13px lower than the other.
      */
      #panel-wake .row {
        align-items: center;
      }
      #panel-wake .note {
        margin: 0 0 var(--s2);
        font-size: var(--t-cap);
        line-height: var(--leading);
        color: var(--ink-3);
      }
      #panel-wake .meta {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      /*
        The box scrolls, the column does not.

        `.sheet` is a document and takes the window's one vertical bar; this is a
        fixed panel beside it holding a string that can be any length, so it has
        to have its own. Two bars on one axis is what the `pre` rule below
        refuses — these are two different axes' worth of content, side by side.
      */
      /*
        Ruled off, not boxed in.

        It was a bordered, rounded card inside a bordered column — a box in a
        box, and the inner one was carrying no information the outer one did not
        already give. The column's own edge says where this is; a single rule
        says where the assembled string starts.

        Full width by cancelling the column's padding, so the text runs to the
        same edges the heading above it does.
      */
      .wake-box {
        flex: 1;
        min-height: var(--wake-floor);
        overflow-y: auto;
        margin: 0 calc(var(--s6) * -1) 0;
        border-top: var(--s-px) solid var(--rule);
      }
      .wake-box > pre {
        border: 0;
        border-radius: 0;
        background: transparent;
        padding: var(--s4) var(--s6);
      }
      /*
        The editor, occupying exactly what the readout beside it does.

        Both are `flex: 1` in the same column and only one is ever shown, so
        switching between Sent and Write must not move anything else on the
        panel — a Save button that jumped when you pressed a tab would read as
        the tab having done something else.

        Edge to edge, like `.wake-box`, so a long line disappears AT a drawn
        rule rather than at an arbitrary inset — the finding the shelf's scroll
        regions were rebuilt around.
      */
      .wake-edit {
        flex: 1;
        /*
          The SAME floor as the readout, and now ONLY a floor.

          It used to be the size. The panel was content-driven, so `flex: 1` had
          nothing to distribute: the textarea's `rows` set one height and the
          `<pre>`'s content set the other, and the panel grew by 35px when you
          pressed Write. Measured, not noticed: 166 against 201 in the same
          window.

          The panel fills the column now, so both views take everything the
          heading, the notes and the action row leave — the same amount, because
          they are the same box in the same place. What the floor still does is
          stop that amount going to nothing in a 560px window, which is as short
          as this one is allowed to get.
        */
        min-height: var(--wake-floor);
        margin: 0 calc(var(--s6) * -1) 0;
        /*
          The READOUT's inset, not the base rule's.

          `pre, textarea` pads by `--s4`, and `.wake-box > pre` overrides the
          horizontal half to `--s6` so the assembled string starts under the
          heading. The editor kept the 12px and nothing said so: the first
          character of the document you write sat 8px left of the first
          character of the string it produces, and the text shifted under the
          pointer when you pressed Write. The panel already refuses to move its
          two views relative to each other; this is that same promise about
          where the words begin.
        */
        padding: var(--s4) var(--s6);
        border-width: var(--s-px) 0 0;
        border-radius: 0;
        resize: none;
      }
      /*
        NO ring on this one. The rule it hangs from darkens instead.

        `:focus-visible` is 2px of gold, which is right for a control with an
        edge of its own for a ring to sit outside. This box has no edges: its
        sides are cancelled and its negative margins put it against the column's
        rule on one side and the window's edge on the other. So the ring drew a
        gold rectangle around the one thing on this panel that is deliberately
        not a rectangle — straddling the column's border on the way out, and
        boxing in a full-bleed writing surface when pulled back inside. There is
        no offset that makes a box correct where there is no box.

        The hairline going to ink says the same thing and says it in the
        window's own voice. It is the answer her name already gives on the pane
        beside this one, where the shared field box is undone for the same
        reason and a single line carries the focus.

        `:focus` rather than `:focus-visible` — a text box matches the latter
        however focus arrived, and matching the wider rule is what keeps a click
        and a Tab looking the same.
      */
      .wake-edit:focus-visible {
        outline: none;
      }
      .wake-edit:focus {
        border-top-color: var(--ink);
      }
      /*
        A prompt nobody has written must not read as one somebody has.

        The placeholder is four lines of prose in the document's own mono, at
        its size, in its ink — so an empty file looked like a written one, and
        `0 chars` beside the heading was the only thing on the panel that
        disagreed. `--ink-3` is the answer this window already gives to the same
        question one column over, where `pre.empty-note` says what an empty
        memory means.

        Mono still, and deliberately: `{style}` and `{notes}` are strings
        somebody types, and a proportional font would stop them looking like it.
      */
      .wake-edit::placeholder {
        color: var(--ink-3);
      }
      /*
        The two tabs, at the size of the heading they sit beside.

        `.switchers` is the pronoun control's shape and this borrows it whole —
        one way of saying "this one, not that one" in this window. Smaller here
        because it shares a line with an h3 rather than standing under one.
      */
      .wake-tabs button {
        padding: var(--s0) var(--s3);
        font-size: var(--t-nano);
      }
      /*
        On the bottom edge, under a box that has taken everything above them.

        `flex: none`, so the box grows and these keep their height rather than
        the other way round. The margin is because they are what you do when you
        have STOPPED writing — pressed against the writing surface they read as
        part of it. The air underneath is the column's own bottom padding, so
        the two gaps are set in one place each and neither is a number.
      */
      .wake-actions {
        flex: none;
        justify-content: flex-end;
        margin-top: var(--s4);
      }

      /* ---- the open character's column ------------------------------------- */
      /*
        By id rather than by class.

        It was `.open`, and so is the microphone pill's lit state — one global
        stylesheet, two meanings, and this rule came second, so `display: flex;
        flex-direction: column; overflow-y: auto` landed on the PILL: its dot
        stacked above its label and it became a scroll container 43px tall. An
        id cannot collide with a state class, which is why the fix is here and
        not a more specific selector that would only postpone it.
      */
      #pane {
        min-height: 0;
        overflow-y: auto;
      }
      /*
        The stack of sections, and the reason it needs a rule of its own.

        `#pane` was `flex-direction: column` with a `gap`, and that gap governed
        `#pane`'s CHILDREN -- of which there is exactly one, this element.
        `characterSheet` wraps everything in it, so the gap styled a single
        wrapper and the contents inside had nothing between them at all:
        measured 0.0px on all six boundaries. Adjacent 1px borders read as a
        table rather than as an obvious fault, which is why it survived.

        The air is the SECTIONS' own padding now, so there is no container gap
        left to put on the wrong box.
      */
      .sheet {
        display: flex;
        flex-direction: column;
      }
      /*
        A section: a caps heading, a hint in mono beside it, and whatever
        control the field actually wants underneath.

        This replaced a `.plate` — one labelled row, a value, and a meta string
        — used for every field alike, which made her name, her colour and her
        memory look like rows of one table. Eight themes want a grid of faces, a
        prompt wants a textarea, a voice wants ten pills; a plate can offer one
        shape and did.
      */
      .section {
        display: flex;
        flex-direction: column;
        gap: var(--s4);
        padding: var(--s6) var(--s7);
        border-bottom: var(--s-px) solid var(--rule);
      }
      /* Nothing below the last one to divide it from. */
      .section:last-child {
        border-bottom: 0;
        padding-bottom: var(--s8);
      }
      .section > .head {
        display: flex;
        align-items: baseline;
        gap: var(--s4);
      }
      .section .hint {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      .section .note {
        margin: 0;
        max-width: 68ch;
        font-size: var(--t-ui-2);
        line-height: var(--leading);
        color: var(--ink-2);
      }
      .section .note.bad {
        color: var(--warn-ink);
      }
      /*
        `.moment`, not `.field` — which this window already uses for the Machine
        tab's label-beside-control grid, at `align-items: center` and 150px of
        label. `.section .field` won on the properties it named and lost on the
        one it did not, so these two boxes were column-flexed AND centre-aligned:
        a caps label floating over a 157px input in a 374px cell.

        The sixth rule in this stylesheet to mean two things at once. Every one
        of them compiled and passed the suite.
      */
      .moment {
        display: flex;
        flex-direction: column;
        gap: var(--s1);
      }
      .moment .label,
      .who-facts .label {
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: var(--w-bold);
        letter-spacing: var(--track-2);
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .moments {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--s4);
      }
      /*
        VERTICAL only. `resize: both` let the box be dragged wider than the
        column it sits in — and it made the textarea a scroll container, which
        is the second bar on one axis the `pre` rule below refuses.
      */
      .section textarea {
        resize: vertical;
      }

      /* ---- who she is, across the top of her column ------------------------ */
      /*
        `.who-band`, NOT `.who` — which this window already uses for the speaker
        label over a turn in a transcript. That is the fifth collision of this
        exact shape here: `.open` was the microphone pill and the open column,
        `.sheet` was styled on the wrong container, `.card` was a character and
        a tool, and each one compiled, linted, passed the suite and governed the
        wrong element. Two meanings in one global stylesheet is the defect;
        naming the specific thing is the fix.
      */
      /*
        HER FACE AND HER NAME, as the page's subject rather than its first
        section.

        It was the first block of the scrolling column, with the column's own
        padding and a rule under it — so the thing the page is about scrolled
        away, and what stayed at the top read as belonging to nobody. It sits
        above the views now, which is what makes "Who she is" and "What she has
        said" mean anything: they are views OF a subject, and the subject has to
        be visible while you read them.

        No padding and no rule of its own: `.head` places it and the views'
        border is the line under it. Two rules a few pixels apart is what the
        old arrangement drew.
      */
      .who-band {
        display: flex;
        align-items: center;
        gap: var(--s5);
        width: 100%;
        min-width: 0;
      }
      .who-band .tile {
        flex: none;
      }
      .who-of {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: var(--s2);
        padding-bottom: var(--s2);
      }
      /*
        Her name at h1, with no box until it is touched.

        The largest thing on the pane is her name; that it is editable is worth
        less than that it is her name. The underline appears on hover and focus,
        so the affordance is there the moment somebody goes looking for it.
      */
      /*
        `input[type='text'].who-name`, not `.who-name`.

        The bare class is (0,1,0) and the window's own `input[type='text']` rule
        is (0,1,1), so it WON — her name kept the ordinary field's box, border
        and 13px type however carefully this block described a title. Written up
        because it is the same family as the four class collisions above: a rule
        that reads as correct, compiles, and governs nothing.
      */
      input[type='text'].who-name {
        width: 100%;
        padding: var(--s0) 0;
        border: 0;
        border-bottom: var(--s-px) solid transparent;
        border-radius: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: var(--t-h1);
        font-weight: var(--w-bold);
        letter-spacing: var(--track-tight);
      }
      /*
        The two shared states are UNDONE here, not merely added to.

        `tokens.css` gives every field a `--rule` border and a `--paper` fill on
        hover and focus. Winning on specificity is not enough, because the
        cascade runs per DECLARATION: a rule that names only
        `border-bottom-color` leaves the shared `border-color` and
        `background-color` in force however specific it is, and her name would
        grow the full box this whole block exists to remove — on hover only,
        which is exactly the kind of thing a screenshot of a resting window does
        not show. So every property the shared rule sets is named back.
      */
      input[type='text'].who-name:hover,
      input[type='text'].who-name:focus {
        border-color: transparent;
        background-color: transparent;
      }
      input[type='text'].who-name:hover {
        border-bottom-color: var(--rule);
      }
      input[type='text'].who-name:focus {
        outline: none;
        border-bottom-color: var(--ink);
      }
      .who-facts {
        display: flex;
        align-items: center;
        gap: var(--s3);
      }
      .who-facts .meta {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
        overflow-wrap: anywhere;
      }
      input[type='text'].inline {
        width: 132px;
        padding: var(--s0) var(--s3);
        font-size: var(--t-sm);
      }

      pre,
      textarea {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
        padding: var(--s4);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r2);
        background: var(--paper);
        color: inherit;
        font-family: var(--mono);
        /*
          `--t-data`, which is what every other piece of mono in this window is
          set in — the hints beside the headings, the paths, the counts, the
          problem chip in the drawer. This said `--t-label`, and `--t-label` is
          11px because it is the size of a CAPS LABEL of two or three words.
          These three boxes are documents: the prompt you write, the string it
          produces, and the note she keeps. One pixel, and it is the difference
          between glancing at a word and reading a paragraph.
        */
        font-size: var(--t-data);
        line-height: var(--leading-long);
        user-select: text;
      }
      /*
        A `pre` does NOT scroll on its own inside `#pane`.

        It used to: `max-height: 34vh; overflow-y: auto`, which put a second
        scrollbar a dozen pixels from the column's own, cut across the plate's
        8px corner, and made reading her notes a question of which of two bars
        the pointer happened to be over. One column, one axis, one bar. The
        column beside it keeps its own, and should — `.wake-box` is a panel of
        fixed height holding a string of any length, not a document.
      */
      pre.empty-note {
        color: var(--ink-3);
      }

      /* ---- the inspector --------------------------------------------------- */
      aside {
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s4);
      }
      .list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        margin: 0 calc(var(--s5) * -1) calc(var(--s5) * -1);
      }
      .entry {
        display: block;
        width: 100%;
        text-align: left;
        padding: var(--s3) var(--s5);
        border: 0;
        border-top: var(--s-px) solid var(--rule);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: default;
      }
      .entry:hover {
        background: var(--hair-soft);
      }
      .entry[aria-current='true'] {
        background: var(--gold-wash);
        box-shadow: inset 2px 0 0 var(--gold);
      }
      /* The clock and the facts, on one line — `09:41 · 14 turns · 7 min`. */
      .entry .when {
        display: flex;
        align-items: center;
        gap: var(--s3);
        font-size: var(--t-ui-2);
        font-weight: var(--w-semibold);
      }
      .entry .snippet {
        font-size: var(--t-data);
        color: var(--ink-2);
        /*
          The clamp lived in a SECOND `.entry .snippet` block directly below
          this one. Two consecutive rules for one component read as two
          components until you check the selectors, and the next person to
          change the colour changes it in the first and leaves the clamp
          somewhere they never scrolled to.
        */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      /*
        What the conversation was about, under the clock.

        Darker and heavier than a snippet, because it is the thing somebody
        scans the column FOR — the snippet is evidence for a search, and this is
        the row's own name for itself.

        Clamped to one line, not two. A subject is bounded at 80 characters, so
        a second line only happens in a narrow column — and a title that wraps
        stops being scannable, which is the whole reason it is not the first
        line of the transcript.
      */
      .entry .subject {
        font-size: var(--t-sm);
        color: var(--ink);
        font-weight: var(--w-medium);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ---- a conversation, as a conversation ------------------------------ */
      /*
        Bubbles carry the surfaces, so the field they sit on does not.

        The container had a card of its own one commit ago, which was the right
        answer while a transcript was bare paragraphs hanging in an empty column
        and the wrong one now: a bubble inside a card is two surfaces deep and
        reads as a panel of panels. The problem list still gets a card -- it is a
        report, not a conversation -- which is why it has its own class now
        rather than borrowing this one.
      */
      /*
        Full width of the column, and the measure moves to the BUBBLE.

        With `max-width: var(--reading)` here the right-aligned side hugged the
        edge of an invisible 82ch box rather than the edge of the pane, so your
        replies floated in the middle of a wide column and read as broken
        alignment. In a conversation the thing that needs a reading measure is
        the bubble; the field it sits on needs both edges, because which edge a
        bubble is on is what says who is speaking.
      */
      .transcript {
        /*
          A measure, centred. A transcript set to the full width of a 900px
          column is a line long enough to lose your place in — the artifact
          holds it to 78ch and centres it, which is what every other document
          in this window is already doing by having a narrower column.
        */
        max-width: 78ch;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: var(--s6);
      }
      /*
        What this conversation was, over the top of it.

        The artifact draws a row of tool chips here too — `ask_workspace ×2`.
        Nothing archives a call: `transcripts.ts` stores `{at, who, text, cut}`
        and a capability's answer reaches the model and the problem log and
        never the record. Drawing the chips would be inventing them —
        `plan-v2.md` W5 has what it would take.
      */
      /*
        What she reached for, on its own row under the facts.

        Wrapping, because the number of capabilities is not bounded by this
        stylesheet -- a build with six would otherwise push the row off its
        column rather than taking a second line.
      */
      /*
        A chip reads as a THING SHE DID, not as a control.

        No border and no pointer: nothing here is clickable, and a pill with an
        outline in a window whose other pills are buttons would invite the
        click it cannot answer. The wash carries her colour, so the row belongs
        to the character whose conversation it is.
      */
      .tool-chip {
        display: inline-flex;
        align-items: baseline;
        gap: var(--s1);
        padding: var(--s0) var(--s3);
        border-radius: var(--r-pill);
        background: var(--her-wash);
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-2);
      }
      .tool-name {
        font-weight: var(--w-medium);
      }
      /* Drawn only above one, and quieter than the name it qualifies. */
      .tool-uses {
        color: var(--ink-3);
      }
      /*
        A glyph and a number, in the two places that draw the same two facts.

        `14 turns · 7 min` was the same two nouns down a whole column, and the
        numbers are what somebody is comparing. The noun survives as the
        accessible name and the tooltip — see `glyph.ts` — so nothing is lost to
        anybody who cannot see the picture.

        Quieter than what it sits beside: in the list the clock is the row's
        subject and these are its footnotes, so they take `--ink-3` against the
        entry's own weight rather than matching it.
      */
      .fact {
        display: inline-flex;
        align-items: center;
        gap: var(--s1);
        flex: none;
        font-family: var(--mono);
        font-size: var(--t-data);
        font-weight: var(--w-regular);
        color: var(--ink-3);
      }
      .fact svg {
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* One speaker's unbroken stretch. Her face sits with the last bubble. */
      .run {
        display: flex;
        align-items: flex-end;
        gap: var(--s3);
      }
      .run.you {
        flex-direction: row-reverse;
      }
      .run .tile {
        flex: none;
        display: block;
        margin-bottom: var(--s0);
      }
      .run.faceless .tile {
        width: 28px;
        height: 28px;
        border: var(--s-px) dashed var(--warn-line);
        border-radius: var(--r-pill);
      }
      .said {
        display: flex;
        flex-direction: column;
        gap: var(--s1);
        /*
          Two limits, and the smaller wins. The percentage keeps a bubble from
          reaching both edges -- one that does is a paragraph with rounded
          corners and the shape stops saying anything. The `ch` keeps a wide
          window from producing a 700px line, which is past comfortable reading
          whatever shape it is in.
        */
        max-width: min(72%, 54ch);
        min-width: 0;
      }
      .run.you .said {
        align-items: flex-end;
      }
      .who {
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: var(--w-semibold);
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--ink-3);
        margin-bottom: var(--s0);
      }
      .run.her .who {
        color: var(--ink-brand);
      }
      /*
        Her side is HER colour, which is the design's second semantic rule doing
        real work rather than decorating. `--ink-brand` on `--her-wash` is the
        pairing `contrastFailures` already sweeps for every persona and
        `accent.test.ts` sweeps for all eight built-in themes -- so a character
        somebody else wrote cannot make her own words unreadable here.
      */
      .bubble {
        position: relative;
        padding: var(--s3) var(--s4);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r4);
        background: var(--paper-2);
        font-size: var(--t-body);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
      }
      /*
        Take this turn. ON the bubble's top-right corner, on hover and on focus.

        Top, because that is where people already look for it. It was moved to
        the bottom for a measured reason — the last line of a wrapped bubble has
        room to spare and the first line is full by definition, so the bottom
        corner covers 0px of text against 2px at the top — and 2px is a sliver
        inside the corner radius, which is a smaller cost than a control sitting
        where the hand does not expect it.

        Straddling the corner, not inside it. Fully inside, a 21px button covers
        11px of the line beside it, which on "Bye." — a 56px bubble holding 30px
        of text — masks the last character. The alternative was reserving the
        button's width as padding on every bubble forever so that one of them
        can be hovered.

        `background: inherit` takes whichever surface its own bubble is painted
        with — `--her-wash` on her side, `--paper-2` on yours — so the part that
        overlaps reads as the bubble rather than as a hole in it. One
        declaration rather than a rule per side, and it cannot drift when either
        colour changes.
      */
      .bubble .copy {
        position: absolute;
        top: -7px;
        right: -7px;
        display: flex;
        padding: var(--s1);
        border: 0;
        /*
          Round, with an edge and a lift. Square-cornered and flat it read as a
          bump ON the bubble's own outline rather than as something resting on
          it — the shape has to say "separate object" precisely because it is
          painted in the bubble's own colour.
        */
        border-radius: var(--r-pill);
        background: inherit;
        box-shadow:
          var(--lift-0),
          0 0 0 1px var(--rule);
        color: var(--ink-3);
        cursor: default;
        opacity: 0;
        /* Untouchable while invisible, so it cannot take a click meant for the
           words underneath it. */
        pointer-events: none;
      }
      .bubble:hover .copy,
      .bubble:focus-within .copy {
        opacity: 1;
        pointer-events: auto;
      }
      .bubble .copy:hover {
        background: var(--paper-hover);
        color: var(--ink);
      }
      .bubble .copy svg {
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linejoin: round;
      }
      .run.her .bubble {
        background: var(--her-wash);
        border-color: transparent;
        color: var(--ink-brand);
      }
      /* The corner nearest the speaker is tightened. That is the whole tail. */
      .run.her .said > .bubble:last-of-type {
        border-bottom-left-radius: var(--r1);
      }
      .run.you .said > .bubble:last-of-type {
        border-bottom-right-radius: var(--r1);
      }
      .cut {
        margin-top: var(--s0);
        font-family: var(--narrow);
        font-size: var(--t-label);
        color: var(--warn-ink);
      }

      /* ---- the problem list, which is a report rather than a conversation --- */
      .report {
        background: var(--paper-2);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r3);
        padding: var(--s6);
      }
      .problem p,
      .lead {
        max-width: var(--reading);
      }
      .problem {
        margin: 0 0 var(--s5);
      }
      .problem .where {
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: var(--w-semibold);
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--red);
      }
      .problem p {
        margin: var(--s0) 0 0;
        font-size: var(--t-sm);
        white-space: pre-wrap;
      }
      .problem .subject {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      .lead {
        margin: 0 0 var(--s6);
        font-size: var(--t-sm);
        color: var(--ink-2);
      }
      /* Alone on the surface, it is the whole answer rather than an intro. */
      .lead:only-child {
        margin: 0;
      }
      /* Every empty surface says WHICH kind of empty it is. */
      .empty {
        max-width: 46ch;
        margin: var(--s7) auto;
        text-align: center;
        font-size: var(--t-sm);
        color: var(--ink-3);
      }

      /* ---- the strip along the bottom --------------------------------------
        What just happened, and whether anything has gone wrong, both always in
        the same place.

        This was a toast that appeared and faded, plus a chip in a drawer. A
        message that removes itself is one somebody can miss entirely, and the
        answer to "did that save?" should be readable a minute later rather than
        for four seconds after the fact. The bar is always there, so its being
        empty is itself an answer.
      */
      .status {
        height: var(--status-h);
        flex: none;
        display: flex;
        align-items: center;
        gap: var(--s2);
        padding: 0 18px;
        background: var(--paper-2);
        border-top: var(--s-px) solid var(--rule);
      }
      #said {
        margin: 0;
        display: flex;
        align-items: center;
        gap: var(--s2);
        min-width: 0;
        font-family: var(--sans);
        font-size: var(--t-cap);
        color: var(--ink-2);
        max-width: none;
      }
      #said-what {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #said-shut {
        display: flex;
        flex: none;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--ink-3);
        cursor: pointer;
      }
      #said-shut svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
      }
      #said-shut:hover {
        color: var(--ink);
      }
      /*
        The problem count, as a word and a mark.

        `--live` and `--live-off` are the blue family, and this is the one place
        that spends it: a count of things that have gone wrong is not a warning
        about what you are about to do — the two status families are for that —
        it is a report, and it reads as one.
      */
      .warn {
        display: flex;
        align-items: center;
        gap: var(--s1);
        flex: none;
        padding: var(--s0) var(--s2);
        border: var(--s-px) solid transparent;
        border-radius: var(--r-control);
        background: transparent;
        font-family: var(--sans);
        font-size: var(--t-cap);
        color: var(--live);
        cursor: pointer;
      }
      .warn:hover {
        border-color: var(--live-line);
        background: var(--live-bg);
      }
      .warn .dot {
        width: 6px;
        height: 6px;
        border-radius: var(--r-pill);
        background: currentColor;
      }
      /* Nothing wrong, and it says so rather than showing nothing. */
      .warn.quiet {
        color: var(--live-off);
      }
      .status .btn {
        flex: none;
      }
    </style>
  </head>
  <body>
    <!--
      Two pages and a rail, which is the delivered architecture rather than a
      strip of three tabs. `dev-docs/design-system/STRUCTURE.md` records where
      each number here comes from; the short version is that this window is one
      document about somebody, and the machine is a different document that gets
      its own page because it is not about her.
    -->
    <div id="app">
      <!--
        The topbar carries only what is true on every page: the mark, and her
        state. It used to hold the three tabs and the search field as well,
        which put the window's navigation and one pane's control on the same
        strip as a fact about the running app.
      -->
      <div class="topbar">
        <canvas class="mark" id="mark"></canvas>
        <span class="wordmark">mochi</span>
        <span class="grow"></span>
        <span class="state"
          ><span class="what" id="state"></span><span class="how" id="state-how"></span
        ></span>
        <!--
          The microphone, last and as a mark. The words are KEPT as the
          accessible name and the tooltip: a microphone that is open with
          nothing saying so is the worst thing this app can do, and an icon
          alone is only a statement to somebody already looking at it. Three
          states told apart by SHAPE and not only colour — filled for open,
          hollow for closed, struck through for a grant that is withheld.
        -->
        <span class="mic" id="mic">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <rect class="cap" x="6" y="1.6" width="4" height="7.2" rx="2"></rect>
            <path class="arc" d="M3.6 7.4a4.4 4.4 0 0 0 8.8 0"></path>
            <path class="stem" d="M8 11.9V14.2"></path>
          </svg>
          <span class="ghost" id="mic-label"></span>
        </span>
      </div>

      <div class="frame">
        <!--
          The rail is the window's table of contents and it is always present:
          who exists, and the machine underneath them. A character list that
          only appears on one tab is a list you have to navigate to in order to
          find out what you could navigate to.
        -->
        <nav class="rail" aria-label="Characters, and this machine">
