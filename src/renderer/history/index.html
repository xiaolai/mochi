        A 1.5px INK RING, not a hairline — A1's, and the reason is the track.

        The thumb sat on `--rule-2` with the small lift. At the left end the fill
        behind it is ink, so a `#d4d4d8` hairline against it is very nearly
        nothing, and the thing that has to stay findable at both ends of a slider
        is its edge. The artboard rings it in ink and lifts it; that pairing is
        one of the two places the small lift IS drawn.
      */
      .size-slider::-webkit-slider-thumb {
        appearance: none;
        width: var(--s4);
        height: var(--s4);
        border: 0;
        border-radius: var(--r-pill);
        background: var(--paper);
        box-shadow:
          0 0 0 1.5px var(--ink),
          0 1px 3px rgb(0 0 0 / 18%);
      }
      /*
        The RING deepens on hover, not the fill.

        This filled the thumb with `--ink-2`, which turns it into "a bulge in the
        bar rather than a thing on it" — the phrase four lines up in the rule
        that rejects exactly this shape. A paper thumb on an ink track is the
        drawing; hovering thickens its edge and leaves the object alone.
      */
      .size-slider:hover::-webkit-slider-thumb {
        box-shadow:
          0 0 0 2px var(--ink),
          0 1px 3px rgb(0 0 0 / 18%);
      }
      .size-reading {
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
        min-width: 4ch;
        text-align: right;
      }
      .grant {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--s5);
        padding: var(--s4) 0;
        border-bottom: var(--s-px) solid var(--rule);
      }
      /*
        UNSCOPED, because three files build these now.

        `.grant .name, .cap .name` reached the two places its author was looking
        at, so a key's row — B5 draws a name over a sentence, exactly like a
        grant — got the browser's defaults: a `div` at the body weight above
        another at the body size, which is a two-line row with no hierarchy in
        it. This is the fourth rule in `stylesheets.test.ts` and its most
        frequent defect.
      */
      /*
        WHICH BUILD THIS IS — B7's title and the line under it.

        Set as a heading rather than as a labelled field: it is the answer to
        the one question somebody opens this group for, and a 150px label
        reading "Application" beside it was a word explaining a word.
      */
      /* The two lines together, so the section's own gap does not separate a
         title from the line that qualifies it. */
      .build {
        display: flex;
        flex-direction: column;
      }
      .build-name {
        font-size: var(--t-h1);
        font-weight: var(--w-medium);
        letter-spacing: var(--track-tight);
        color: var(--ink);
      }
      .build-facts {
        margin-top: var(--s1);
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-2);
      }
      /* What it stands on: a name and its licence, one pair per row. */
      /* The folders, as a list rather than as loose rows. Its own container so
         the section's heading has one child to sit over. */
      .on-disk {
        display: flex;
        flex-direction: column;
      }
      .built-on {
        display: flex;
        flex-direction: column;
      }
      .built-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--s5);
        padding: var(--s3) 0;
        border-top: var(--s-px) solid var(--rule);
      }
      .built-what {
        font-family: var(--mono);
        font-size: var(--t-sm);
        color: var(--ink);
      }
      .built-detail {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
        text-align: right;
      }

      .name {
        font-weight: var(--w-semibold);
      }
      .desc {
        margin: var(--s0) 0 0;
        font-size: var(--t-sm);
        color: var(--ink-2);
      }
      .grant .right {
        text-align: right;
        flex: none;
      }
      /* The grant's sits in a right-hand column, and that is the only thing
         about it that is not every switch's. */
      .grant .switch {
        justify-content: flex-end;
      }
      .grant .used {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      .cap {
        padding: var(--s4) 0;
        border-bottom: var(--s-px) solid var(--rule);
      }
      .cap .name {
        font-family: var(--mono);
        font-size: var(--t-sm);
        color: var(--ink-2);
      }
      .folder {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s5);
        padding: var(--s3) 0;
        border-bottom: var(--s-px) solid var(--rule);
      }
      /*
        The path shrinks; the button does not.

        A `<code>` holding an absolute path has a min-content width of the whole
        path, and a flex item will not shrink below that without `min-width: 0`
        — so at the window's floor the row grew past the pane and took its
        button with it, two pixels at a time. The path is the part that can be
        elided and the button is the part that has to stay pressable.
      */
      .folder > div:first-child {
        min-width: 0;
      }
      .folder code {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .folder > .btn {
        flex: none;
      }
      /*
        A field and the button that fills it, on one line.

        The button sits AFTER the input and does not grow: the field is the part
        that has to be readable at a glance -- a workspace is a long path -- and
        a two-column grid would give a four-word button as much room as it.
      */
      .picker {
        display: flex;
        align-items: center;
        gap: var(--s3);
        min-width: 0;
      }
      .picker > input {
        flex: 1 1 auto;
        min-width: 0;
      }
      .picker > .btn {
        flex: none;
      }
      .folder .refused {
        font-size: var(--t-data);
        color: var(--ink);
      }
      .keys-right {
        display: flex;
        align-items: center;
        gap: var(--s3);
        flex: none;
      }
      /*
        The combination, as the control that changes it.

        Monospaced and fixed-width so a row does not jump as the label swaps
        between a combination and "Press a combination…" -- a button that
        resizes under the pointer is one that gets mis-clicked.
      */
      .btn.key {
        font-family: var(--mono);
        font-size: var(--t-data);
        min-width: 18ch;
        text-align: center;
      }
      /*
        Listening. It takes HER colour rather than a warning colour: nothing is
        wrong, the control is waiting, and her colour is the one thing on screen
        that already means "this is live".

        `--her`, not `--accent`. There is no `--accent` — `accent.ts` renamed it
        and says why — and a rule naming one would have been a state that draws
        exactly like the resting one, which is a capture control with no way to
        tell whether it is capturing.
      */
      .btn.key.listening {
        border-color: var(--ink);
        color: var(--ink);
        font-weight: var(--w-medium);
      }
      /* ---- the day's conversations, and the one being read ------------------
        A list of what was said on the chosen day, above the transcript. Rows
        rather than cards, and rules rather than boxes: "Rules do the grouping.
        Boxes are reserved for the two things that need one: a control and a
        warning."
      */
      /*
        The column, at A3's numbers: 368 wide, 18/16 of padding, 3px between
        cards. The gap is what separates one row from the next now that the
        hairline under each has gone, and it is deliberately small — these are a
        list, not a set of unrelated panels.
      */
      .list {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        padding: 18px var(--s4);
        border-right: var(--s-px) solid var(--rule);
      }

      .picked {
        display: flex;
        align-items: baseline;
        gap: var(--s3);
        padding-bottom: 10px;
        border-bottom: var(--s-px) solid var(--rule);
      }
      .picked .what {
        font-family: var(--sans);
        font-size: var(--t-h3);
        color: var(--ink);
      }
      .stat {
        font-family: var(--mono);
        font-size: var(--t-data-2);
        color: var(--ink-3);
      }
      /*
        A CARD IN A COLUMN, not a row with a rule under it — A3's shape.

        The row was a flex ROW with everything on one line and a hairline under
        it, which was right while the only content was a clock and two numbers.
        It now carries what was said above the clock, so a row is a stack: three
        children laid out in a line could not shrink to the column, and the
        1120px floor caught it as a control cutting off its own label.

        The rule goes with it. A3 separates these by the gap between them and
        marks the open one with a fill, which is one signal doing one job instead
        of a border that divides and a fill that selects.
      */
      .entry {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: var(--s2);
        width: 100%;
        min-width: 0;
        padding: 13px 15px;
        border: 0;
        border-radius: var(--r-card);
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      /*
        Somebody's own words, and they can be a URL with no spaces in it.

        `overflow-wrap: anywhere` rather than trusting the line clamp: the clamp
        limits the HEIGHT and says nothing about a single token wider than the
        column, which is a row that pushes the list past the window's edge. The
        text here is arbitrary — it is whatever was said.
      */
      .entry .said-of {
        overflow-wrap: anywhere;
      }
      /* `--paper-hover`, which is the sheet's one hover surface and had lost its
         only reader. A list row picking `--paper-2` by hand is how a window ends
         up with two hover greys that agree until one of them is changed. */
      .entry:hover {
        background: var(--paper-hover);
      }
      /*
        Chosen is a FILL, and that became safe when the hue left.

        It was a bar and a word, never a fill alone, because her hue behind a
        chosen row measured 1.01:1 against the surface on some characters and a
        fill nobody can see is not a state. `--chosen-2` is a step of grey — one
        value, not a computed hue — so the objection is gone with the thing it
        objected to.
      */
      /*
        On the chosen row, the facts take `--ink-2`.

        The reason has changed and the rule has not. It was that `--ink-3` on HER
        WASH measured 4.04:1 in dark, and the wash was computed from the worn
        character's hue — so the built-in's green passing said nothing about the
        next character's. There is no wash now; the ground is `--chosen-2`, where
        `--ink-3` measures 5.00:1 and would pass. `--ink-2` stays because a
        chosen row is the one row somebody is reading, and the step is free.
      */
      .entry[aria-current='true'] .fact,
      .entry[aria-current='true'] .when {
        color: var(--ink-2);
      }
      .entry[aria-current='true'] {
        background: var(--chosen-2);
      }
      .entry .when {
        display: flex;
        align-items: center;
        gap: var(--s2);
        font-family: var(--mono);
        font-size: var(--t-data-2);
        color: var(--ink-2);
      }
      /*
        The box that says whether this row is picked for deletion.

        A CHARACTER, not a styled square: it has to be legible without colour
        and it has to survive being read aloud, and `☐` / `☑` do both without
        the row having to carry a real checkbox it would then have to keep in
        step with the selection.
      */
      .tick {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      .entry[data-picked='true'] .tick {
        color: var(--ink);
      }
      /* Only while a selection is being made, so the column of boxes is not a
         permanent invitation to delete something. */
      .list:not(.picking) .tick {
        display: none;
      }
      .fact {
        display: inline-flex;
        align-items: center;
        gap: var(--s1);
        color: var(--ink-3);
      }
      .fact svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
      }
      /* ---- what she is told, in the margin ---------------------------------
        The three-column Cast tab is gone: a list of characters down the left, her
        sheet in the middle and a "next wake" panel down the right. The list is
        the rail now and the panel is the margin of view III, which is where it
        belongs — what she is TOLD she can do is apparatus for what she may do,
        not a third column standing beside her name.
      */
      /*
        How tall the system prompt panel's two views are, at least.

        A local custom property rather than the number twice: the whole point is
        that the readout and the editor cannot disagree, and two literals is
        exactly how they would come to. It went missing when the three-column
        Cast tab's rules were replaced, and `design-values.test.ts` caught it —
        an undefined custom property makes the whole declaration invalid at
        computed-value time, so the panel simply had no floor.
      */
      #app {
        --wake-floor: 220px;
      }

      /* ---- the controls the sections hold ---------------------------------- */
      /*
        `select[multiple]` stood here, and it went with its control.

        It undid three rules `tokens.css` writes for a DROPDOWN — the stripped
        native frame, the transparent border and fill at rest, the chevron at
        `top 50%` — none of which suit an eight-row list box. The rules were
        right about their subject; the subject is gone. `Hearing you` draws
        twenty-four pills now, for a reason that is not about styling: a plain
        click in a list box deselects everything else, and that pane saves on
        `change`. See `settings/pane/hearing.ts`.

        This window builds no `select` in `multiple` any more, so the guard in
        `stylesheets.test.ts` that kept these rules alive is retired too.
      */
      /*
        Which words she takes: three choices, not a dropdown of three.

        A TRACK with a pill inside it, rather than a pill-shaped group whose
        current item is a full-bleed segment of it. Under the old rule the group
        carried the only radius and `overflow: hidden` clipped the fill to it —
        so the selected item was a rectangle in the middle and a half-pill at
        either end, and which shape it had depended on where it happened to sit
        in the list rather than on it being selected.

        The inner pill is also the shape the voice row beside it uses for the
        same job, so the pane now says "this one" one way instead of two.
      */
      /*
        The pronoun, as three words rather than a segmented control.

        It was a bordered capsule holding three uppercase pills, one of which
        was filled with `--her-deep` and reversed to white. The delivery draws
        no capsule and no fill on the two you did not pick:

            gap 2px · Sora 12px · baseline
            chosen   padding 4px 10px · background --her-wash · colour --her
                     weight 600 · radius 3px
            others   padding 4px 10px · colour --ink-3

        A capsule is a box, and a box is reserved for a control and a warning.
        Three words beside her name are neither — and the segmented shape said
        "one of these three is a mode", where what is true is "she takes these
        words".
      */
      /*
        NO GAP between the words, because each already carries 10px of its own.

        The delivery's 2px sat between two 10px paddings, so the three words
        were 22px apart — and on her page they share a line with "calls you
        nothing yet", where 22px is a word space made of nothing. So "she he it
        calls you nothing yet" read as six words in a row and the control did
        not read as a control at all. The delivery never had that problem
        because it drew the chooser on the name's line, alone.

        Inside the control 20px, outside it 40px: see `.who-facts`.
      */
      /*
        A TRACK, and the chosen one is filled.

        The artboard draws every one-of-several chooser the same way: a sunken
        pill holding the options, 3px of padding, and the current one as an
        INK-filled pill with paper text. It was a bare row of buttons whose
        current one took a grey fill — which is the LIST's treatment, not the
        chooser's, and made "she / he / it" read as three things you could
        select rather than one setting with three positions.
      */
      .switchers {
        display: inline-flex;
        align-items: center;
        gap: 0;
        padding: 3px;
        border-radius: var(--r-pill);
        background: var(--paper-3);
      }
      .switchers button {
        padding: 5px 13px;
        border: 0;
        border-radius: var(--r-pill);
        background: transparent;
        font-family: var(--sans);
        font-size: var(--t-ui-2);
        font-weight: var(--w-medium);
        color: var(--ink-2);
        cursor: pointer;
      }
      .switchers button:hover:not([aria-current='true']) {
        color: var(--ink);
      }
      /*
        INK for the word, one step of grey for the ground.

        This is the site that taught the window the lesson v2 then applied
        everywhere. The delivery wrote `color: var(--her)` here, and its `--her`
        is deep enough to carry text where ours was not: `accent.ts` computes it
        from the worn character's hue as a FILL, so a character whose colour
        resolved to a light mint drew "ballad" at 1.72:1 against her own wash.
        Only `verify:rendered` saw it — the built-in's green passes, so nothing
        was wrong until somebody made a character.

        The fix then was a second token deep enough for text. The fix now is that
        chosen is a step of grey and the word is ink, so there is no hue to be
        deep enough and nothing computed at runtime for a check to have to chase.
      */
      .switchers button[aria-current='true'] {
        background: var(--ink);
        color: var(--paper);
        font-weight: var(--w-medium);
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
      }
      /* The eight colour swatches, each one HER at that theme. */
      /*
        A TRAY, and it is as wide as its contents.

        A1 draws the eight appearances inside one sunken 22px panel — the panel
        is what says they are one choice. Eight loose squares on the page read as
        eight things, and `width: fit-content` is what stops the tray becoming a
        band across a 760px column with six squares of air in it.
      */
      .themes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        width: fit-content;
        padding: 10px 14px;
        border-radius: var(--r-panel);
        background: var(--paper-3);
      }
      /*
        52 x 44, which is her face's own proportion rather than a square.

        A square put her in a box and left daylight above and below; the artboard
        draws the tile to the shape of the drawing it holds. Unchosen ones sit at
        0.9 — a step of presence rather than of colour, so which one is worn
        survives somebody who cannot see the difference between two greens.
      */
      .theme {
        width: 52px;
        height: 44px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: var(--r-card);
        background: transparent;
        padding: 0;
        opacity: 0.9;
        cursor: pointer;
      }
      /* The tile has no border to colour — it is a fill and an opacity now, so
         hover moves the opacity. A  on  paints nothing,
         which is the same defect the search field had. */
      /*
        The tile has no border to colour — it is a fill and an opacity now, so
        hover moves the opacity. This was `border-color: var(--rule-2)` over
        `border: 0`, which paints nothing: the same defect the search field had,
        found here by the token check rather than by looking.
      */
      .theme:hover {
        opacity: 1;
      }
      /*
        A FILL AND A RULE, not a fill alone.

        It was `--chrome-wash` and nothing else — which on a chosen swatch is
        barely a state, and is the same fill the surface behind it may already
        be. The wash says which, and her own colour on the edge says it again
        without depending on the wash being visible: "chosen must remain
        perceivable without colour" cuts both ways, and a wash this pale is
        close to no colour at all.
      */
      .theme[aria-current='true'] {
        background: var(--paper);
        opacity: 1;
      }
      /*
        THE SAME SHAPE AS THE PRONOUN, because it is the same question.

        These had a 1px border where `.switchers` has none — two controls that
        both mean "this one, not that one", drawn differently, on the same page.
        A person should learn what chosen means once; learning it twice is the
        defect §4 of the brief records, and it had four expressions at one point.

        The delivery states this pattern once, on the pronoun: bare words,
        `padding: 4px 10px`, and the chosen one taking her wash at `radius 3px`.
        So that is what a chooser looks like here, whatever it is choosing.
      */
      /*
        OUTLINED pills, and the chosen one fills.

        Ten voices are ten options, not ten labels: each carries its own edge so
        the row reads as a set of things you can press. It was a bare row at
        `--t-data` — the mono size — for a list of words that are names.
      */
      .pills button {
        display: inline-flex;
        align-items: center;
        gap: var(--s2);
        padding: 6px 15px;
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r-pill);
        background: transparent;
        color: var(--ink-2);
        font-family: var(--sans);
        font-size: var(--t-ui);
        cursor: pointer;
      }

      /*
        `aria-pressed` beside `aria-current`, because this row is chosen two
        different ways.

        A voice or a pronoun is ONE of a set, which is `aria-current`. A
        language is on or off, independently of every other one, which is
        `aria-pressed` — a toggle button, not a position in a list. The two
        carry the same drawing and must not carry the same attribute: announcing
        twenty-four languages as "current" would tell a screen reader that
        twenty-three of them had just been left.
      */
      .pills button:hover[aria-current='false'],
      .pills button:hover[aria-pressed='false'] {
        border-color: var(--rule-2);
        color: var(--ink);
      }
      /*
        The mark on a recommended voice, and on the sentence that explains it.

        HER colour rather than the warning family: this is a suggestion, not
        something wrong. `--her-deep` so it carries against both the pill's
        `--paper-2` and the selected pill's `--her-wash`, where plain `--her`
        would nearly vanish.

        The word "recommended" is in the button's accessible name — see
        `chooser` — because an icon alone is only a statement to somebody
        already looking at it.
      */
      .pills .dot,
      .note .dot {
        display: inline-block;
        vertical-align: middle;
        width: var(--s2);
        height: var(--s2);
        border-radius: var(--r-pill);
        background: var(--her-deep);
        flex: none;
      }
      /*
        BOTH states excluded, not one.

        This is more specific than the chosen rule below it, so a chosen pill
        under the pointer takes its colour from here. With only `aria-current`
        named, a pressed language pill matched — `--ink` text on the `--ink`
        fill of its own chosen state, which is a word that disappears when you
        point at it.
      */
      .pills button:hover:not([aria-current='true']):not([aria-pressed='true']) {
        color: var(--ink);
      }
      .pills button[aria-current='true'],
      .pills button[aria-pressed='true'] {
        border-color: var(--ink);
        background: var(--ink);
        color: var(--paper);
        font-weight: var(--w-medium);
      }
      /*
        The face is a control now: click it to see that expression on her.

        Bare of every button default — a `<button>` does not inherit `font`, and
        it arrives with its own border, background and padding, all of which
        would draw a second box around a drawing that is already inside one.

        The affordance is the WASH, appearing on hover. A permanent outline
        around eight faces would read as eight buttons rather than as eight
        faces, which is the wrong subject: the drawing is what somebody came to
        this grid to look at.
      */
      /* Dimmed with the tile it sits in, so a face she may not use does not
         advertise itself more loudly than one she may. Still clickable — being
         able to look at one before enabling it is the point. */

      /* ---- what she will be told, down the right --------------------------- */
      /*
        The panel IS the column, not a block sitting at the top of one.

        `.cast-wake` is a grid item and stretches to the full height of the row;
        this was content-sized inside it, so `flex: 1` on the box below had no
        free space to distribute and the writing surface stopped dead at its
        220px floor. On a full-height window that left several hundred pixels of
        blank paper under the box you write paragraphs in.

        Filling the column is what lets the box grow to the sidebar, and what
        gives Save and Cancel a bottom edge to sit on instead of following the
        text up to wherever it happened to end.
      */
      /*
        `.wake`, not `#panel-wake` — the panel is no longer a strip parked on the
        permits page. A8 is a screen of its own, reached from her page, so what
        this styles is a block inside the drill-down rather than one of the
        reading column's fixed children.
      */
      .wake {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s2);
      }
      .wake .note {
        margin: 0 0 var(--s2);
        color: var(--ink-3);
      }
      /*
        The box scrolls, the column does not.

        `.sheet` is a document and takes the window's one vertical bar; this is a
        fixed panel beside it holding a string that can be any length, so it has
        to have its own. Two bars on one axis is what the `pre` rule below
        refuses — these are two different axes' worth of content, side by side.
      */
      /*
        Ruled off, not boxed in.

        It was a bordered, rounded card inside a bordered column — a box in a
        box, and the inner one was carrying no information the outer one did not
        already give. The column's own edge says where this is; a single rule
        says where the assembled string starts.

        NO NEGATIVE MARGIN any more.

        It cancelled the padding of the 236px sidebar this panel used to live in
        in, so the text ran to that column's edges. The panel is in the reading
        column now — her instructions are the thing itself, not apparatus — and
        the same margin pulled the rule above it 30px left of everything else on
        the page, which reads as a misalignment rather than as full bleed.

        A single rule still says where the assembled string starts; it starts
        where the sentence above it starts.
      */
      .wake-box {
        flex: 1;
        min-height: var(--wake-floor);
        overflow-y: auto;
        border-top: var(--s-px) solid var(--rule);
      }
      .wake-box > pre {
        border: 0;
        border-radius: 0;
        background: transparent;
        padding: var(--s4) var(--s6);
      }
      /*
        The editor, occupying exactly what the readout beside it does.

        Both are `flex: 1` in the same column and only one is ever shown, so
        switching between Sent and Write must not move anything else on the
        panel — a Save button that jumped when you pressed a tab would read as
        the tab having done something else.

        Edge to edge, like `.wake-box`, so a long line disappears AT a drawn
        rule rather than at an arbitrary inset — the finding the shelf's scroll
        regions were rebuilt around.
      */
      .wake-edit {
        flex: 1;
        /*
          The SAME floor as the readout, and now ONLY a floor.

          It used to be the size. The panel was content-driven, so `flex: 1` had
          nothing to distribute: the textarea's `rows` set one height and the
          `<pre>`'s content set the other, and the panel grew by 35px when you
          pressed Write. Measured, not noticed: 166 against 201 in the same
          window.

          The panel fills the column now, so both views take everything the
          heading, the notes and the action row leave — the same amount, because
          they are the same box in the same place. What the floor still does is
          stop that amount going to nothing in a 560px window, which is as short
          as this one is allowed to get.
        */
        min-height: var(--wake-floor);
        /*
          The READOUT's inset, not the base rule's.

          `pre, textarea` pads by `--s4`, and `.wake-box > pre` overrides the
          horizontal half to `--s6` so the assembled string starts under the
          heading. The editor kept the 12px and nothing said so: the first
          character of the document you write sat 8px left of the first
          character of the string it produces, and the text shifted under the
          pointer when you pressed Write. The panel already refuses to move its
          two views relative to each other; this is that same promise about
          where the words begin.
        */
        padding: var(--s4) var(--s6);
        /*
          A STYLE, not just a width — the same defect as the search field, and
          this one hid a hairline rather than a focus ring.

          `textarea` in `tokens.css` sets `border: 0`, which is
          `border-style: none`. `border-width: 1px 0 0` over that paints nothing,
          so the top edge this box's own comment describes as the thing focus
          darkens has never been drawn.
        */
        border-style: solid none none;
        border-width: var(--s-px) 0 0;
        border-color: var(--rule);
        border-radius: 0;
        resize: none;
      }
      /*
        NO ring on this one. The rule it hangs from darkens instead.

        `:focus-visible` is 2px of gold, which is right for a control with an
        edge of its own for a ring to sit outside. This box has no edges: its
        sides are cancelled and its negative margins put it against the column's
        rule on one side and the window's edge on the other. So the ring drew a
        gold rectangle around the one thing on this panel that is deliberately
        not a rectangle — straddling the column's border on the way out, and
        boxing in a full-bleed writing surface when pulled back inside. There is
        no offset that makes a box correct where there is no box.

        The hairline going to ink says the same thing and says it in the
        window's own voice. It is the answer her name already gives on the pane
        beside this one, where the shared field box is undone for the same
        reason and a single line carries the focus.

        `:focus` rather than `:focus-visible` — a text box matches the latter
        however focus arrived, and matching the wider rule is what keeps a click
        and a Tab looking the same.
      */
      .wake-edit:focus-visible {
        outline: none;
      }
      .wake-edit:focus {
        /*
          A STYLE with the colour. The declaration above it sets one now, so this
          would paint either way — it is repeated because a focus rule that names
          only a colour is what shipped, and it painted nothing for as long as
          the base had no style. Stated where the failure was.
        */
        border-top-style: solid;
        border-top-color: var(--ink);
      }
      /*
        A prompt nobody has written must not read as one somebody has.

        The placeholder is four lines of prose in the document's own mono, at
        its size, in its ink — so an empty file looked like a written one, and
        `0 chars` beside the heading was the only thing on the panel that
        disagreed. `--ink-3` is the answer this window already gives to the same
        question one column over, where `pre.empty-note` says what an empty
        memory means.

        Mono still, and deliberately: `{style}` and `{notes}` are strings
        somebody types, and a proportional font would stop them looking like it.
      */
      .wake-edit::placeholder {
        color: var(--ink-3);
      }
      /*
        The two tabs, at the size of the heading they sit beside.

        `.switchers` is the pronoun control's shape and this borrows it whole —
        one way of saying "this one, not that one" in this window. Smaller here
        because it shares a line with an h3 rather than standing under one.
      */
      .wake-tabs button {
        padding: var(--s0) var(--s3);
        font-size: var(--t-nano);
      }
      /*
        On the bottom edge, under a box that has taken everything above them.

        `flex: none`, so the box grows and these keep their height rather than
        the other way round. The margin is because they are what you do when you
        have STOPPED writing — pressed against the writing surface they read as
        part of it. The air underneath is the column's own bottom padding, so
        the two gaps are set in one place each and neither is a number.
      */
      .wake-actions {
        flex: none;
        justify-content: flex-end;
        margin-top: var(--s4);
      }

      /* ---- the open character's column ------------------------------------- */
      /*
        By id rather than by class.

        It was `.open`, and so is the microphone pill's lit state — one global
        stylesheet, two meanings, and this rule came second, so `display: flex;
        flex-direction: column; overflow-y: auto` landed on the PILL: its dot
        stacked above its label and it became a scroll container 43px tall. An
        id cannot collide with a state class, which is why the fix is here and
        not a more specific selector that would only postpone it.
      */
      #pane {
        min-height: 0;
        overflow-y: auto;
      }
      /*
        The stack of sections, and the reason it needs a rule of its own.

        `#pane` was `flex-direction: column` with a `gap`, and that gap governed
        `#pane`'s CHILDREN -- of which there is exactly one, this element.
        `characterSheet` wraps everything in it, so the gap styled a single
        wrapper and the contents inside had nothing between them at all:
        measured 0.0px on all six boundaries. Adjacent 1px borders read as a
        table rather than as an obvious fault, which is why it survived.

        The air is the SECTIONS' own padding now, so there is no container gap
        left to put on the wrong box.
      */
      /*
        Her sections, at the reading column's own rhythm.

        The column sets `gap: 26px` and its only child is `#pane`, so the gap
        never reached the sections — nine of them, all touching, with every
        pixel of room coming from each section's own padding. Stated here
        because this container is what the column's gap would have governed if
        the sheet were not wrapped.
      */
      /*
        ONE RHYTHM, and it is flat.

        Read out of A1 rather than chosen: her page is a single column at
        `gap: 22px` in which a heading, the rows it heads and the next heading
        are all SIBLINGS at the same distance. There is no tighter relationship
        between a heading and its own content — the uppercase and the mono hint
        do that work, so the space does not have to.

        It was 26 between sections and 12 inside them, which is two rhythms and
        neither is the delivery's. The section keeps its box for grouping and
        semantics; both gaps are now the one number, so the box changes nothing
        about where anything sits.
      */
      /*
        CAPPED at the measure. The reading column is 824px wide in a 1280 window
        and every control in it was taking as much of that as its flex allowed —
        a 709px slider, a 666px chooser, a name field that changed width when
        the window did.
      */
      .sheet {
        display: flex;
        flex-direction: column;
        gap: var(--s5);
      }
      /*
        The CONTROLS carry the cap, not the sheet — see `--measure-field`.

        A single-line field at 420 is the width the machine's page draws and the
        width A1's own fields sit at; letting one fill a 760 column is the
        "no control grows with the window" the self-audit asked for, applied to
        the control rather than to everything around it.
      */
      .sheet input[type='text'],
      .sheet select,
      .sheet textarea {
        max-width: var(--measure-field);
      }
      /*
        A section: a caps heading, a hint in mono beside it, and whatever
        control the field actually wants underneath.

        This replaced a `.plate` — one labelled row, a value, and a meta string
        — used for every field alike, which made her name, her colour and her
        memory look like rows of one table. Eight themes want a grid of faces, a
        prompt wants a textarea, a voice wants ten pills; a plate can offer one
        shape and did.
      */
      /*
        A section has NO padding of its own, and no rule under it.

        It had `padding: 30px 40px` inside a reading column that already pads by
        40 — so every field on her sheet was indented eighty pixels from the
        page edge while the views above it sat at forty, and two adjacent
        sections put SIXTY pixels between their contents in a column whose own
        rhythm is twenty-six.

        The delivery draws these as plain blocks: `gap: 12px` inside, and the
        column's `gap: 26px` between. Measured, not noticed — nine gaps of 0px
        with all the room coming from padding is what a sweep sees and an eye
        reads as "why is this so airy".
      */
      .section {
        display: flex;
        flex-direction: column;
        gap: var(--s5);
      }
      /* Nothing below the last one to divide it from. */
      /* The column's own padding ends the list; a section adds nothing. */
      /*
        A section's heading: its name, and the apparatus note beside it.

        Its own name, because `.head` is the header of a PAGE and carries that
        page's padding — see `row.ts` for what nine sections looked like wearing
        it. The gap between one section and the next is the column's, so this
        adds none of its own.
      */
      /*
        The heading and its hint on ONE row, 12 apart — the artboard's
        `display:flex; gap:12px`, where the caps label and the mono fact sit
        beside each other rather than stacked.
      */
      /*
        A SETTING, as one row — the shape every field on her page has in A1.

        The label is a fixed 82px so a column of settings lines up on one edge;
        the control takes what is left; the mono fact sits after it and is not
        part of the control. Baseline-aligned, because a 14px label beside a
        13.5px field centred on its box sits a pixel high and reads as loose.
      */
      /*
        THE WAY INTO THE THREE SCREENS that are not sections of this one.

        Rows rather than a corner of buttons, because each carries the fact that
        says whether it is worth opening — how many she has kept, how many faces
        she may wear. A door with nothing written on it is a door people stop
        trying.
      */
      .deeper {
        display: flex;
        flex-direction: column;
        gap: var(--s0);
      }

      .deeper-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s3);
        width: 100%;
        padding: var(--s3) var(--s4);
        border: 0;
        border-radius: var(--r-card);
        background: var(--paper-3);
        font-family: var(--sans);
        text-align: left;
        cursor: pointer;
      }

      .deeper-row:hover {
        background: var(--chosen);
      }

      .deeper-name {
        font-size: var(--t-body);
        font-weight: var(--w-medium);
        color: var(--ink);
      }

      .deeper-fact {
        font-family: var(--mono);
        font-size: var(--t-data-2);
        color: var(--ink-3);
      }

      /* The only exit from a screen that is not in the view nav. */
      .deeper-back {
        align-self: flex-start;
        padding: 6px var(--s3) 6px 0;
        border: 0;
        background: transparent;
        font-family: var(--sans);
        font-size: var(--t-ui);
        color: var(--ink-2);
        cursor: pointer;
      }

      .deeper-back:hover {
        color: var(--ink);
      }

      /*
        The word beside a switch, which says the STATE rather than the action.

        Full ink at the body size: it is the answer to what the row is asking,
        and it was set as a quiet label while the switch beside it carried the
        meaning. A word that has to be hunted for is a word that is not doing the
        job the mark cannot do.
      */
      /* The claim, and how old it is. */
      .codex-lines {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s1);
      }

      .codex-when {
        font-family: var(--mono);
        font-size: var(--t-data-2);
        color: var(--ink-3);
      }

      .switch-word {
        font-family: var(--sans);
        font-size: var(--t-cap);
        color: var(--ink);
      }

      .setting {
        display: flex;
        align-items: baseline;
        gap: var(--s3);
      }

      .setting-of {
        flex: none;
        width: 82px;
        font-family: var(--sans);
        font-size: var(--t-body);
        color: var(--ink-2);
      }

      /*
        ONE WIDTH for every single-line field on this page.

        This said `max-width: none`, at (0,2,1), which beat the 420 cap at
        (0,1,1) — and it reaches only the DIRECT children of `.setting`. Her name
        is nested one level deeper, inside `.setting-pair` with the she/he/it
        switchers, so it escaped the override and took the cap while the two
        fields beside it did not. Three fields in one column at 420, 548 and 666,
        and the reason was which of them happened to share a row.

        A1 does draw them at different widths, because each row has different
        siblings — an 82px label, then a pill, or a mono hint, or nothing. That
        is what a `flex: 1` gives you and it is not what a column of fields should
        look like: the right-hand edge is the thing a reader lines up on, and
        three fields that end in three places read as three unrelated controls.
        V7 already names 420 as the width of a single-line input; this lets it
        apply.
      */
      .setting > input[type='text'],
      .setting > input[type='search'],
      .setting > select {
        flex: 1;
        min-width: 0;
      }

      /* The fact, never the instruction. Prose about a setting goes under the
         row as a `.note`; this is for "often left empty" and "ten · lands on her
         next wake". */
      /* The name and the words she takes, on one line — A1 draws them together. */
      .setting-pair {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: var(--s3);
      }

      .setting-pair > input[type='text'] {
        flex: 1;
        min-width: 0;
      }

      .setting-fact {
        flex: none;
        font-family: var(--mono);
        font-size: var(--t-data-2);
        color: var(--ink-3);
      }

      .section-head {
        display: flex;
        align-items: baseline;
        gap: var(--s3);
      }
      /*
        Unscoped, because it is built in two files now.

        `.section .hint` reached the heading's own fact and nothing else — a hint
        beside a control inside a section, which is where A2b puts "asks once,
        and offers a copy first", inherited the body face at the body size. A
        class whose only rule names an ancestor is styled in the one place its
        author was looking at, which is this file's fourth rule and its most
        frequent defect.
      */
      .hint {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      /*
        `.moment`, not `.field` — which this window used for the Machine tab's
        label-beside-control grid, at `align-items: center` and 150px of label.
        `.section .field` won on the properties it named and lost on the one it
        did not, so these two boxes were column-flexed AND centre-aligned: a caps
        label floating over a 157px input in a 374px cell.

        `.field` has since been deleted — B1, B2, B4 and B7 all draw a setting as
        a heading with the control under it, so the machine's page now builds the
        same `section` her page does. The collision is why the name is still
        worth avoiding.

        The sixth rule in this stylesheet to mean two things at once. Every one
        of them compiled and passed the suite.
      */
      .moment {
        display: flex;
        flex-direction: column;
        gap: var(--s1);
      }
      .moment .label,
      .moments {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--s4);
      }
      /*
        VERTICAL only. `resize: both` let the box be dragged wider than the
        column it sits in — and it made the textarea a scroll container, which
        is the second bar on one axis the `pre` rule below refuses.
      */
      .section textarea {
        resize: vertical;
      }

      /* ---- who she is, across the top of her column ------------------------ */
      /*
        `.who-band`, NOT `.who` — which this window already uses for the speaker
        label over a turn in a transcript. That is the fifth collision of this
        exact shape here: `.open` was the microphone pill and the open column,
        `.sheet` was styled on the wrong container, `.card` was a character and
        a tool, and each one compiled, linted, passed the suite and governed the
        wrong element. Two meanings in one global stylesheet is the defect;
        naming the specific thing is the fix.
      */
      /*
        HER FACE AND HER NAME, as the page's subject rather than its first
        section.

        It was the first block of the scrolling column, with the column's own
        padding and a rule under it — so the thing the page is about scrolled
        away, and what stayed at the top read as belonging to nobody. It sits
        above the views now, which is what makes "Who she is" and "What she has
        said" mean anything: they are views OF a subject, and the subject has to
        be visible while you read them.

        No padding and no rule of its own: `.head` places it and the views'
        border is the line under it. Two rules a few pixels apart is what the
        old arrangement drew.
      */
      .who-band {
        display: flex;
        align-items: center;
        /* 20, HerHead's gap between her face and her name. */
        gap: 20px;
        min-width: 0;
      }
      /*
        HER NAME, at HerHead's numbers and at the same numbers on every view.

        The size lived on `.subject-large`, a class `showPlace` put on the
        subject for view I alone, on the reading that "view I is about HER, so
        she is the subject at full size… the other views are about what she said
        or what she may do, and she is the heading over them". That reading
        belongs to v1, where the masthead really was three different bands.

        What it did in v2: her name was 34px on "Who she is" and 13px — the BODY
        TEXT SIZE — on the other two. Not a smaller heading, no heading at all;
        the name of the character every one of those screens is about, set at the
        size of the sentence explaining a checkbox.

        `masthead.ts` already argues this for the face, in so many words: "ONE
        SIZE, and no view decides it… The delivery draws one component at one
        size, which is the point of it being a component." The face was unified
        to 64 and the name was left behind, so the fix stopped half way and the
        half that was left is the one carrying the words.

        Only the INPUT form of this had a weight and a line-height, so the drawn
        one inherited the body's 400 and the body's 1.5 as well. At 34px that is
        a 51px line for a 36px word.
      */
      .who-name {
        font-size: var(--t-title);
        font-weight: var(--w-medium);
        letter-spacing: var(--track-tight);
        line-height: 1.05;
      }
      .who-band .tile {
        flex: none;
      }
      /*
        7px under her name and nothing under the block — HerHead's `margin-top:
        7px` on the facts line. It was an 8px gap plus 8px of trailing padding,
        which is the band's own height spent twice on the same joint.
      */
      .who-of {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      /*
        Her name at h1, with no box until it is touched.

        The largest thing on the pane is her name; that it is editable is worth
        less than that it is her name. The underline appears on hover and focus,
        so the affordance is there the moment somebody goes looking for it.
      */
      /*
        `input[type='text'].who-name`, not `.who-name`.

        The bare class is (0,1,0) and the window's own `input[type='text']` rule
        is (0,1,1), so it WON — her name kept the ordinary field's box, border
        and 13px type however carefully this block described a title. Written up
        because it is the same family as the four class collisions above: a rule
        that reads as correct, compiles, and governs nothing.
      */
      input[type='text'].who-name {
        /* 30px, 600, -0.02em, line-height 1 — the delivery's own numbers for
           her name. It is the largest thing on the page and it is a serif. */
        /*
          NO `font: inherit` in this block.

          It was here, three lines under `font-family: var(--sans)`, and a
          shorthand resets every longhand it does not name — so her name took
          the body's Sora and the serif declaration above it did nothing. The
          largest thing on the page, and the one thing this design calls the
          subject, was set in the face reserved for what you OPERATE.

          The same shape this sheet already warns about for `background`, where
          the shorthand wipes a `select`'s chevron. A shorthand after a longhand
          is not an override anybody reads as one.
        */
        font-family: var(--sans);
        font-size: var(--t-h1);
        font-weight: var(--w-semibold);
        letter-spacing: -0.02em;
        line-height: 1;
        /*
          As wide as her NAME, not as wide as the row.

          The rule under it is what says she can be renamed, and a rule running
          the width of the subject row would read as a divider under the whole
          head. `field-sizing: content` is what lets an input be the size of its
          own text; before it existed this needed a hidden span to measure
          against, which is why the field was full-width and its rule was
          transparent.
        */
        field-sizing: content;
        /*
          And `align-self`, or the sizing is ignored.

          `.who-of` is a flex column, so its default `align-items: stretch`
          makes every child fill the width — `field-sizing: content` sets a
          PREFERRED size and stretch overrides it. The rule under her name ran
          the width of the column while the name was four characters long.
        */
        align-self: flex-start;
        min-width: 4ch;
        max-width: 100%;
        padding: var(--s0) 0;
        border: 0;
        /*
          A RULE AT REST, like every other field in this window.

          It was transparent until hover, so the largest thing on the page —
          and the one thing on it somebody most wants to change — was the only
          field that did not say it could be typed in. "A field with a value
          keeps only its rule" applies at 30px too.
        */
        border-bottom: var(--s-px) solid var(--rule-2);
        border-radius: 0;
        background: transparent;
        color: inherit;
        letter-spacing: var(--track-tight);
      }
      /*
        Only what differs from a field.

        A block stood here naming every property of the shared rule back to
        transparent, because `tokens.css` used to give every field a full box on
        hover and focus and her name had to refuse it — "the cascade runs per
        DECLARATION", it said, correctly. That shared rule is a bottom rule now,
        which is what her name wanted all along, so the reset has nothing left
        to reset and is gone rather than kept as a spell against a hazard that
        was removed.

        What is left is the padding, because hers is 2px where a field's is 3,
        and it has to be named in the focus state too or the shared rule moves
        her name by a pixel the moment it is clicked.
      */
      input[type='text'].who-name:focus {
        padding: var(--s0) 0;
      }
      /*
        Her name, then the words she takes, on one line.

        `baseline`, so three 12px words sit on the line her 46px name sits on
        rather than floating in the middle of it.
      */
      /*
        One line of apparatus under her name: where she is stored, and what she
        calls you, joined by a middot.

        It was a small-caps "CALLS YOU" label with a boxed field beside it —
        the treatment for something you operate, applied to a fact about her.
        The delivery sets the whole line in DM Mono and puts the field INLINE in
        the sentence, so it reads as "calls you nothing yet" with a blank in it
        rather than as a labelled input.
      */
      /*
        One line under her name: the words she takes, what she calls you, and
        where she is stored.

        `baseline` rather than `center`, because the pronoun buttons are Sora
        and the rest is DM Mono at a different size — centring two faces of
        unlike height on a line makes neither sit on it.
      */
      /*
        Three joints, and they are not all the same joint.

        This line is read as one statement — "she calls you nothing yet", with
        the other two words she could take beside the one she does — so the
        spacing has to say which parts are one thing. One gap for all of it said
        the opposite: 22px between the three pronouns and 26px between the last
        of them and "calls" is the same distance twice, and six words in a row
        with no control in sight.

        So: 10px is the joint, which is the delivery's for this line, and it is
        what sits either side of the middot. The control gets a wider one of its
        own, below — the middot separates two facts, and nothing separates a
        control from the sentence it is the subject of except space.
      */
      /*
        11px in `--ink-2`, which is HerHead's. It was `--t-data` in `--ink-3` —
        a step smaller and a step quieter than the component draws, on the one
        line that tells two characters apart once the face has.
      */
      .who-facts {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
        font-family: var(--mono);
        font-size: var(--t-data-2);
        color: var(--ink-2);
      }
      /*
        The control-to-sentence joint: 22px, so 32px from the last word in it.

        Against 16px inside the control. Only here — the same chooser above the
        system prompt shares a line with a heading and nothing else, and needs
        no separation from a sentence it is not part of.
      */
      .who-facts > .switchers {
        margin-right: var(--s5);
      }
      .who-facts .meta {
        overflow-wrap: anywhere;
      }
      /*
        The field is a word in a sentence, so it takes the sentence's face and
        an underline — not a box. `#…` specificity is not available on a class
        the builder names, so the element selector carries it, exactly as
        `who.ts` warns about her name.
      */
      input[type='text']      /*
        A field inside a SENTENCE keeps its rule when empty.

        The general rule gives an empty field a box, because a placeholder with
        no edge is a grey word floating over paper. That reasoning does not
        reach here: this one has "calls you" immediately before it, so the
        sentence says what the blank is for, and a box in the middle of a line
        of prose breaks the line rather than clarifying it.
      */

      pre,
      textarea {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
        padding: var(--s4);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r-part);
        background: var(--paper);
        color: inherit;
        font-family: var(--mono);
        /*
          `--t-data`, which is what every other piece of mono in this window is
          set in — the hints beside the headings, the paths, the counts, the
          problem chip in the drawer. This said `--t-label`, and `--t-label` is
          11px because it is the size of a CAPS LABEL of two or three words.
          These three boxes are documents: the prompt you write, the string it
          produces, and the note she keeps. One pixel, and it is the difference
          between glancing at a word and reading a paragraph.
        */
        font-size: var(--t-data);
        line-height: var(--leading-long);
        user-select: text;
      }
      /*
        A `pre` does NOT scroll on its own inside `#pane`.

        It used to: `max-height: 34vh; overflow-y: auto`, which put a second
        scrollbar a dozen pixels from the column's own, cut across the plate's
        8px corner, and made reading her notes a question of which of two bars
        the pointer happened to be over. One column, one axis, one bar. The
        column beside it keeps its own, and should — `.wake-box` is a panel of
        fixed height holding a string of any length, not a document.
      */
      pre.empty-note {
        color: var(--ink-3);
      }

      /* ---- the inspector --------------------------------------------------- */
      aside {
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s4);
      }
      /*
        A SECOND `.list` and `.entry` stood here.

        They were the conversation list as it looked when it lived in an aside
        beside the transcript, and they are later in this sheet than the list's
        own rules — so they won. Everything written for the delivered design was
        overridden without a word: the chosen conversation kept a GOLD fill and
        a gold bar where the rest of this window says chosen is her colour, and
        the rows kept the aside's padding and negative margins.

        It was found by measuring the running window, not by reading. Two rules
        for one thing is the seventh collision of this shape in this file, and
        the reason `stylesheets.test.ts` checks class names at all.
      */
      /* The clock and the facts, on one line — `09:41 · 14 turns · 7 min`. */
      .entry .when {
        display: flex;
        align-items: center;
        gap: var(--s3);
        font-size: var(--t-ui-2);
        font-weight: var(--w-semibold);
      }
      .entry .snippet {
        font-size: var(--t-data);
        color: var(--ink-2);
        /*
          The clamp lived in a SECOND `.entry .snippet` block directly below
          this one. Two consecutive rules for one component read as two
          components until you check the selectors, and the next person to
          change the colour changes it in the first and leaves the clamp
          somewhere they never scrolled to.
        */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      /*
        WHAT THE ROW IS, above the clock — A3's first line.

        Either the subject a model wrote or, when there is none, the first thing
        said in the conversation. Full ink at the body size, because it is what
        somebody scans the column for; the clock under it is apparatus and is set
        as apparatus.

        TWO LINES, then clipped. A subject is bounded at 80 characters and fits
        one, but an opening line is somebody's actual sentence in a 368px column
        and one line of it is often not enough to tell two conversations apart.
        Three would turn the list into a stack of paragraphs.
      */
      .entry .said-of {
        font-size: var(--t-ui);
        color: var(--ink);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      /*
        A quotation is set as one, and that is the whole argument for showing it.

        Nothing summarises a conversation until a model has run, so an unquoted
        first line would be the transcript wearing a title's clothes — a claim
        about what the conversation was about, made by whoever happened to speak
        first. The marks are what make it a report of words instead.

        `--ink-2`, one step back from a real subject: this is evidence, and the
        row that has a genuine name for itself should read as the stronger of
        the two.
      */
      .entry .said-of.quoted {
        color: var(--ink-2);
      }

      /* ---- a conversation, as a conversation ------------------------------ */
      /*
        Bubbles carry the surfaces, so the field they sit on does not.

        The container had a card of its own one commit ago, which was the right
        answer while a transcript was bare paragraphs hanging in an empty column
        and the wrong one now: a bubble inside a card is two surfaces deep and
        reads as a panel of panels. The problem list still gets a card -- it is a
        report, not a conversation -- which is why it has its own class now
        rather than borrowing this one.
      */
      /*
        Full width of the column, and the measure moves to the BUBBLE.

        With `max-width: var(--reading)` here the right-aligned side hugged the
        edge of an invisible 82ch box rather than the edge of the pane, so your
        replies floated in the middle of a wide column and read as broken
        alignment. In a conversation the thing that needs a reading measure is
        the bubble; the field it sits on needs both edges, because which edge a
        bubble is on is what says who is speaking.
      */
      .transcript {
        /*
          NO measure of its own. V7: "everything in a column fills the column;
          the column width IS the cap."

          This held 78ch and centred itself inside its track, which is a second
          measure inside a column that already has one — and the two disagreed,
          because `--reading` next door said 66ch. v2 settles it by sizing the
          TRACK: the transcript column is 616, which is the 600px measure plus
          its own padding, so there is nothing left for a max-width to do.

          THAT LAST SENTENCE IS TRUE AT 1280 AND NOWHERE ELSE. The track is a
          `1fr` and grows with the window, so at 1600 her turns ran to about
          936px — the one surface in this window where a long line costs the
          most was the one with no cap on it. 全部页面 puts `max-width: 600px` on
          the transcript's own inner column, which is the thing that holds at
          every width rather than at the default one.
        */
        display: flex;
        flex-direction: column;
        gap: var(--s6);
        max-width: var(--measure-read);
      }
      /*
        What this conversation was, over the top of it.

        The artifact draws a row of tool chips here too — `ask_workspace ×2`.
        Nothing archives a call: `transcripts.ts` stores `{at, who, text, cut}`
        and a capability's answer reaches the model and the problem log and
        never the record. Drawing the chips would be inventing them —
        `plan-v2.md` W5 has what it would take.
      */
      /*
        What she reached for, on its own row under the facts.

        Wrapping, because the number of capabilities is not bounded by this
        stylesheet -- a build with six would otherwise push the row off its
        column rather than taking a second line.
      */
      /*
        A chip reads as a THING SHE DID, not as a control.

        No border and no pointer: nothing here is clickable, and a pill with an
        outline in a window whose other pills are buttons would invite the
        click it cannot answer. The wash carries her colour, so the row belongs
        to the character whose conversation it is.
      */
      .tool-chip {
        display: inline-flex;
        align-items: baseline;
        gap: var(--s1);
        padding: var(--s0) var(--s3);
        border-radius: var(--r-pill);
        background: var(--chosen-2);
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-2);
      }
      .tool-name {
        font-weight: var(--w-medium);
      }
      /* Drawn only above one, and quieter than the name it qualifies. */
      .tool-uses {
        color: var(--ink-3);
      }
      /*
        A glyph and a number, in the two places that draw the same two facts.

        `14 turns · 7 min` was the same two nouns down a whole column, and the
        numbers are what somebody is comparing. The noun survives as the
        accessible name and the tooltip — see `glyph.ts` — so nothing is lost to
        anybody who cannot see the picture.

        Quieter than what it sits beside: in the list the clock is the row's
        subject and these are its footnotes, so they take `--ink-3` against the
        entry's own weight rather than matching it.
      */
      .fact {
        display: inline-flex;
        align-items: center;
        gap: var(--s1);
        flex: none;
        font-family: var(--mono);
        font-size: var(--t-data);
        font-weight: var(--w-regular);
        color: var(--ink-3);
      }
      .fact svg {
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* One speaker's unbroken stretch. Her face sits with the last bubble. */
      .run {
        display: flex;
        align-items: flex-end;
        gap: var(--s3);
      }
      .run.you {
        flex-direction: row-reverse;
      }
      .run .tile {
        flex: none;
        display: block;
        margin-bottom: var(--s0);
      }
      .run.faceless .tile {
        width: 28px;
        height: 28px;
        border: var(--s-px) dashed var(--rule-2);
        border-radius: var(--r-pill);
      }
      .said {
        display: flex;
        flex-direction: column;
        gap: var(--s1);
        /*
          Two limits, and the smaller wins. The percentage keeps a bubble from
          reaching both edges -- one that does is a paragraph with rounded
          corners and the shape stops saying anything. The `ch` keeps a wide
          window from producing a 700px line, which is past comfortable reading
          whatever shape it is in.
        */
        max-width: min(72%, 54ch);
        min-width: 0;
      }
      .run.you .said {
        align-items: flex-end;
      }
      /*
        WHICH EDGE, not which colour.

        Her side was her hue on her wash, which was the v1 design's second
        semantic rule doing real work — and `contrastFailures` swept that exact
        pairing for every persona so a character somebody else wrote could not
        make her own words unreadable.

        v2 takes the hue out and leaves the rule standing on the thing that
        always carried it: in a conversation, what says who is speaking is which
        side the bubble is on. The pairing is gone from `contrastFailures` with
        the wash it measured, and the sweep it was protecting against — a
        stranger's hue behind her own words — cannot happen, because her words
        are on a grey nobody computes.
      */
      /*
        A3's bubble, at A3's numbers: the sunken grey, the PANEL radius, 13/18 of
        padding, no edge.

        It carried `--paper-2` at the card radius with a 1px rule and 12/16 of
        padding — five values, none of them the drawing's. The radius is the one
        that shows: 22 is what makes a bubble a bubble, and 14 is the rung for a
        field. The border goes with it, because a filled surface with an outline
        says the same thing twice — the same reason A5's sheet lost its.
      */
      .bubble {
        position: relative;
        padding: 13px 18px;
        border: 0;
        border-radius: var(--r-panel);
        background: var(--paper-3);
        font-size: var(--t-lead);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
      }
      /*
        HER TURN IS TEXT, at the size A3 sets it: 15px, full ink, no surface.

        She had a bubble in `--chosen-2` and you had one in `--paper-2`, which is
        a chat client's convention rather than this window's. A3 gives the bubble
        to you alone — her face is what marks her side — so the shape means one
        thing instead of being spent on both sides to say what the face already
        said.
      */
      .line {
        font-size: var(--t-lead);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
      }
      /*
        WHEN IT WAS SAID, AND HOW TO TAKE IT — one mono line under the turn.

        The copy control was a 21px icon straddling the bubble's top-right
        corner, so it overlapped the first line of the text it acts on and said
        what it did only in a tooltip. On its own line it covers nothing.

        `visibility`, not `display`: the row is laid out whether or not the word
        is in it, so hovering a turn does not move the turn under the pointer.
      */
      .turn-facts {
        display: flex;
        align-items: center;
        gap: var(--s2);
        font-family: var(--mono);
        font-size: var(--t-data-2);
        color: var(--ink-3);
      }
      .run.you .turn-facts {
        flex-direction: row-reverse;
      }
      /* The stamp itself. Its own class so the hover rule above can name the
         word beside it without also naming this. */
      .turn-at {
        font-variant-numeric: tabular-nums;
      }
      .turn-facts .copy {
        padding: 0;
        border: 0;
        background: none;
        font-family: var(--mono);
        font-size: var(--t-data-2);
        color: var(--ink);
        cursor: default;
        visibility: hidden;
      }
      .run:hover .turn-facts .copy,
      .turn-facts .copy:focus-visible {
        visibility: visible;
      }
      .turn-facts .copy:hover {
        text-decoration: underline;
      }
      /* The corner nearest the speaker is tightened. That is the whole tail. */
      .run.you .said > .bubble:last-of-type {
        border-bottom-right-radius: var(--r-part);
      }
      /*
        She was cut off — a pill, on the turn's own facts line.

        A3 draws it as a bordered mono chip before the stamp rather than as a
        sentence under the bubble, which is what makes it read as a property of
        the turn instead of as a remark about it.
      */
      .cut {
        font-family: var(--mono);
        font-size: var(--t-data-2);
        color: var(--ink);
        border: var(--s-px) solid var(--rule-2);
        border-radius: var(--r-pill);
        padding: var(--s0) var(--s2);
      }

      /* ---- the problem list, which is a report rather than a conversation --- */
      .report {
        background: var(--paper-2);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r-card);
        padding: var(--s6);
      }
      .problem {
        margin: 0 0 var(--s5);
      }
      .problem .where {
        font-family: var(--sans);
        font-size: var(--t-label);
        font-weight: var(--w-semibold);
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--ink);
      }
      .problem p {
        margin: var(--s0) 0 0;
        font-size: var(--t-sm);
        white-space: pre-wrap;
      }
      .problem .subject {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      .lead {
        margin: 0 0 var(--s6);
        font-size: var(--t-sm);
        color: var(--ink-2);
      }
      /* Alone on the surface, it is the whole answer rather than an intro. */
      .lead:only-child {
        margin: 0;
      }
      /* Every empty surface says WHICH kind of empty it is. */
      .empty {
        max-width: 46ch;
        margin: var(--s7) auto;
        text-align: center;
        font-size: var(--t-sm);
        color: var(--ink-3);
      }

      /* ---- the strip along the bottom --------------------------------------
        What just happened, and whether anything has gone wrong, both always in
        the same place.

        This was a toast that appeared and faded, plus a chip in a drawer. A
        message that removes itself is one somebody can miss entirely, and the
        answer to "did that save?" should be readable a minute later rather than
        for four seconds after the fact. The bar is always there, so its being
        empty is itself an answer.
      */
      /* Pushes what follows it to the far end of a row. It came from the strip
         across the top and outlived it: the status bar uses it for the same
         job. */
      .grow {
        flex: 1;
      }
      /*
        THE FOOT, at the artboard's own numbers: 44 tall, 32 in from each edge.

        32 because that is the window's gutter — the receipt begins where the
        column above it begins, and a bar inset by a different number reads as a
        separate surface rather than as the foot of this one. It was 18 both
        ways, which lined up with nothing.

        No fill. The hairline above it is what separates it, the same as the
        apparatus column beside it — a surface that recedes by colour AND by a
        rule says it twice.
      */
      /* 56 while the foot carries buttons — see `--status-h-acts`. The class is
         put on by `showPicking`, which is the one place that knows whether any
         of them is on screen. */
      .status.acts {
        height: var(--status-h-acts);
      }
      .status {
        height: var(--status-h);
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s5);
        padding: 0 var(--s6);
        border-top: var(--s-px) solid var(--rule);
      }
      /*
        THE RECEIPT IS A SENTENCE, and it is set like one.

        Both halves of this bar were mono at 10.5 in `--ink-3`, on the reading
        that a status bar is apparatus. Half of that is right: the right-hand
        side — the problem count — IS apparatus and stays mono.

        The left half is not. "Saved — ballad lands on her next wake." is a
        sentence somebody reads once, and the artboard sets it in Outfit at 13px
        in full ink, with a 5px mark before it. Mono at 10.5 in the third ink is
        the treatment for a path, and it made the one line in the window that
        reports what you just did the quietest thing on the screen.
      */
      #said {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
        font-family: var(--sans);
        font-size: var(--t-ui);
        color: var(--ink);
        max-width: none;
      }

      /*
        The mark before it. Not a decoration and not a severity — it is what
        makes a sentence appearing in an empty bar read as new rather than as
        something that was always there.
      */
      #said::before {
        content: '';
        flex: none;
        width: 5px;
        height: 5px;
        border-radius: var(--r-pill);
        background: currentColor;
      }
      #said-what {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #said-shut {
        display: flex;
        flex: none;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--ink-3);
        cursor: pointer;
      }
      #said-shut svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
      }
      #said-shut:hover {
        color: var(--ink);
      }
      /*
        The problem count, as a word and a mark.

        `--live` and `--live-off` are the blue family, and this is the one place
        that spends it: a count of things that have gone wrong is not a warning
        about what you are about to do — the two status families are for that —
        it is a report, and it reads as one.
      */
      .warn {
        display: flex;
        align-items: center;
        gap: var(--s1);
        flex: none;
        padding: var(--s0) var(--s2);
        border: var(--s-px) solid transparent;
        border-radius: var(--r-part);
        background: transparent;
        font-family: var(--mono);
        font-size: var(--t-micro);
        color: var(--ink);
        cursor: pointer;
      }
      .warn:hover {
        border-color: var(--rule-2);
        background: var(--paper-3);
      }
      .warn .dot {
        width: 6px;
        height: 6px;
        border-radius: var(--r-pill);
        background: currentColor;
      }
      /* Nothing wrong, and it says so rather than showing nothing. */
      .warn.quiet {
        color: var(--ink-3);
      }
      /*
