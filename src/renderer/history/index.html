        rules across the top of a window whose whole point is that it has one
        subject at a time. The three places live in the strip, the pane's own
        context sits in the middle, and her state stays on the right where it
        was — the microphone is the one thing here that is true whatever tab you
        are on.
      -->
      <div class="topbar">
        <canvas class="mark" id="mark"></canvas>
        <span class="wordmark">mochi</span>
        <span class="divider"></span>
        <nav class="shell-tabs" id="shell-tabs" role="tablist"></nav>
        <div class="topbar-context" id="topbar-context">
          <!--
          Search belongs to the strip, not to the pane: "search first" is the
          Archive's whole shape, and a field inside the pane put it below the
          rule that separates the window's subject from its chrome.
        -->
          <input
            id="q"
            type="search"
            placeholder="Search everything ever said"
            autocomplete="off"
          />
        </div>
        <span class="grow"></span>
        <span class="state"
          ><span class="what" id="state"></span><span class="how" id="state-how"></span
        ></span>
        <span class="stat" id="count"></span>
        <!--
          The microphone, last and as a mark.

          It was a bordered pill reading MICROPHONE OPEN, ahead of everything
          else on the right. The words are KEPT — as the accessible name and as
          the tooltip — because a microphone that is open with nothing saying so
          is the worst thing this app can do, and an icon alone is only a
          statement to somebody already looking at it.

          Three states, told apart by SHAPE and not only by colour: filled for
          open, hollow for closed, struck through for a grant that is withheld.
          Colour alone would leave the most important state on this strip
          invisible to a colour-blind reader.
        -->
        <span class="mic" id="mic">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <rect class="cap" x="6" y="1.6" width="4" height="7.2" rx="2"></rect>
            <path class="arc" d="M3.6 7.4a4.4 4.4 0 0 0 8.8 0"></path>
            <path class="stem" d="M8 11.9V14.2"></path>
          </svg>
          <span class="ghost" id="mic-label"></span>
        </span>
      </div>

      <!--
        The open character gets the middle of the window, and her sections in
        order rather than a stack of identical plates.

        The cast was a row of cards across the top, which spent the widest part
        of the window on the characters you are NOT editing and left the one you
        are in a column beneath. A list holds as many as you like in the space a
        row of four needed.
      -->
      <section class="tab-pane cast" id="tab-cast">
        <aside class="cast-list">
          <div class="strip">
            <h3>Characters</h3>
            <span class="stat" id="characters-count"></span>
          </div>
          <div class="cards" id="characters"></div>
          <!--
            New, Duplicate and Delete, under the list they act on.

            They were the last section of the character sheet, which is the one
            place on that pane that is not about the open character — and being
            last put the control that makes a SECOND character below the fold of
            a long scroll, on the one install that has exactly one. This column
            is what they change, so this is where they live: a footer to the
            list, the way the drawer is a footer to the window.
          -->
          <div class="cast-foot" id="cast-actions"></div>
        </aside>
        <div id="pane"></div>
        <aside class="cast-wake">
          <div id="panel-wake"></div>
        </aside>
      </section>

      <!--
        The archive gets the whole window: search across the top, conversations
        on the left, the transcript at a reading measure. It was a 380px column
        beside a character's fields, at whatever width was left over.
      -->
      <!--
        A calendar over the day it opens on, and that day's conversations under
        it. The column was a single scrolling list of everything, which answers
        "what happened lately" and cannot answer "what did I say on the 14th"
        without a long scroll — and search, which is the third question, already
        has the strip above.
      -->
      <section class="tab-pane archive" id="tab-archive" hidden>
        <div class="archive-body">
          <aside class="archive-side">
            <div class="cal" id="calendar"></div>
            <div class="list" id="list"></div>
          </aside>
          <div id="talk"></div>
        </div>
      </section>

      <!--
        Three columns, not two. The tool list used to scroll under the grants,
        which is where you look last for the thing the grants are ABOUT — a
        withheld grant removes a row from it, so the two belong side by side or
        the connection is a scroll away.
      -->
      <section class="tab-pane machine" id="tab-machine" hidden>
        <nav class="nav" id="nav">
          <h3 class="nav-head">This machine</h3>
          <div id="nav-groups"></div>
        </nav>
        <div class="machine-pane" id="machine-pane"></div>
        <aside class="machine-tools" id="machine-tools"></aside>
      </section>

      <!--
        The window's status line: what is wrong, what just happened, and the one
        action that is about the window rather than about her.

        The grab handle that used to open this row is GONE. It was a 46 x 4 pill
        with no listener anywhere — an affordance inherited from the artifact for
        a drawer that does not open — and a handle nobody can grab is the same
        kind of thing as a caption for machinery that does not exist.

        `#said` moved IN here. It was `position: fixed; bottom: 56px`, which is a
        floating strip resting eight pixels above this one: two horizontal bars
        at the bottom of the window saying different kinds of thing. It is still
        its own element with its own surface, so `#said.bad` tints the message
        and not the problems chip or `Export…` beside it.

        The dismiss button is in the markup rather than added by the renderer so
        it is never a MUTATION of the live region: only the text changes, so only
        the text is announced, and "Dismiss" is not read out after every save.
      -->
      <div class="drawer">
        <button class="warn" id="troubles" type="button" hidden>
          <span class="dot"></span><span id="troubles-label"></span>
        </button>
        <p id="said" role="status" aria-live="polite" hidden>
          <span id="said-what"></span>
          <button id="said-shut" type="button" aria-label="Dismiss" title="Dismiss">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <path d="M4 4 12 12M12 4 4 12"></path>
            </svg>
          </button>
        </p>
        <span class="grow"></span>
        <!--
          Only while the archive is on screen: they act on conversations, and a
          delete control visible from the character sheet is one whose scope the
          surrounding page contradicts.
        -->
        <button class="btn" id="pick" type="button" hidden>Select…</button>
        <button class="btn" id="pick-off" type="button" hidden>Cancel</button>
        <button class="btn bad" id="drop-some" type="button" hidden disabled>Delete</button>
        <button class="btn bad" id="drop-hers" type="button" hidden>Delete all…</button>
        <button class="btn" id="export" type="button">Export…</button>
      </div>
    </div>
    <!--
      A SEPARATE surface, not a button that arms itself.

      The arming pattern used elsewhere here — click once to arm, again to do
      it — is defeated by a double-click, has no Escape, and re-reads live state
      on the second click, so a selection or a character that changed in between
      is silently what gets deleted. None of that is acceptable for the only
      irreversible action in the app.

      `<dialog>` is modal, traps focus, and closes on Escape without any of it
      being written here. What it says is a SNAPSHOT taken when it opened; the
      deletion uses that snapshot and nothing else.
    -->
    <dialog id="sure">
      <h2 id="sure-what"></h2>
      <p id="sure-why"></p>
      <div class="sure-do">
        <button class="btn" id="sure-no" type="button" autofocus>Keep them</button>
        <!--
          Export sits BEFORE the destructive button and after the safe one.

          The export path already existed and was reachable only from the
          toolbar, which is nowhere near the moment somebody wants it. This is
          the one point where the answer to "can I keep a copy first" decides
          whether the next click is recoverable.
        -->
        <button class="btn" id="sure-export" type="button">Save a copy first</button>
        <button class="btn bad" id="sure-yes" type="button">Delete</button>
      </div>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
