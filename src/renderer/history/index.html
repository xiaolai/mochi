<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mochi</title>
    <link rel="stylesheet" href="../design/tokens.css" />
    <style>
      /*
        1a, at 1440 x 900: her state, her characters, the one that is open.

        The layout is the artifact's — a state strip that is always first, a row
        of character cards, then a 1fr/380px body with the open character on the
        left and an inspector on the right. What fills it is only what this
        build can actually do: the artifact draws a command palette, an
        installer and per-character session stats, and drawing chrome for a
        feature that does not exist is the same failure as offering her a tool
        she cannot call.

        Every value is a token, for the reason `tokens.css` gives: a literal
        here is a place this window and the design can drift without either of
        them looking wrong.
      */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        font: var(--t-ui) / 1.5 var(--sans);
        user-select: none;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* ---- the strip that is always first ---------------------------------- */
      /*
        SHRINKABLE, where it used to be `flex: none`.

        The topbar is the one strip in this window with no fluid column, and it
        shipped 126px too wide at the window's OWN minimum size. `window.ts`
        enforces `minWidth: 900`; the bar's contents need 1026px and could not
        give any of it back, so from 900px to 1025px the microphone's state mark
        sat off the right edge entirely and the turn count was clipped. The only
        way to see them was to scroll the whole shell sideways, which pushes the
        wordmark and the tabs off the other edge — measured across the range, and
        it comes right at exactly 1026px.

        The search field is the largest fixed item on the strip at 340px and the
        one thing in a title bar that is naturally elastic, so it is what gives.
      */
      .topbar-context {
        flex: 0 1 auto;
        display: flex;
        align-items: center;
        min-width: 0;
      }
      /*
        Only the size and the shape are this window's.

        The border, the fill, and the way an empty field keeps an edge while a
        filled one goes quiet are all the field component's, in `tokens.css` —
        which is why a search box nobody has typed in still looks operable
        without a rule here saying so.
      */
      .topbar-context input[type='search'] {
        /*
          340px is the WANTED width, not a floor. `max-width: 100%` is what lets
          the shrink above actually reach the input rather than stopping at its
          box, and the floor keeps it a search field rather than letting it
          collapse toward nothing at some width nobody tested.

          At the enforced 900px minimum this settles around 280px, with the
          wordmark rule below giving back the rest.
        */
        width: 340px;
        min-width: 180px;
        max-width: 100%;
        padding: var(--s1) var(--s4);
        border-radius: var(--r-pill);
      }
      /*
        The wordmark steps aside before anything is clipped.

        1030px is measured rather than picked: it is the first width at which
        the strip fits with every item at its natural size. Her mark stays — it
        is 26px and it is the thing that says which character this window is
        showing — and the window's own title bar carries the name.
      */
      @media (max-width: 1030px) {
        .topbar .wordmark,
        .topbar .divider {
          display: none;
        }
      }
      .topbar {
        flex: none;
        height: 60px;
        display: flex;
        align-items: center;
        gap: var(--s4);
        padding: 0 var(--s6);
        background: var(--paper-2);
        border-bottom: var(--s-px) solid var(--rule);
      }
      .topbar .divider {
        margin-inline: var(--s2);
      }
      /* Her face beside the wordmark, as the artifact draws it. */
      /*
        One lockup with the wordmark, so the two share a centre line rather than
        each sitting on whatever baseline its own box gives it.
      */
      .mark {
        flex: none;
        display: block;
        align-self: center;
      }
      .wordmark {
        font-family: var(--narrow);
        font-weight: var(--w-bold);
        font-size: var(--t-body);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
      }
      .divider {
        width: var(--s-px);
        height: 22px;
        background: var(--rule);
      }
      .state {
        display: flex;
        align-items: baseline;
        gap: var(--s4);
      }
      .state .what {
        font-family: var(--narrow);
        font-size: var(--t-data);
        font-weight: var(--w-semibold);
        letter-spacing: var(--track-narrow);
        text-transform: uppercase;
      }
      .state .how {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-2);
      }
      /*
        The microphone, as a mark at the end of the strip.

        Read the markup above for why the words survive as the accessible name,
        and why the two states differ in weight and fill rather than only in
        colour.
      */
      /*
        `--live-off`, not `--ink-3`, and `--live` when it is open.

        That family exists for exactly this fact and the pill never used it: it
        was drawn in HER colour, which `tokens.css` rules out in as many words —
        the halo over her head is already her colour and the two would merge.
        Blue is the third status family and the first that means "on" rather
        than "wrong".

        TWO states, where there were three. The third was `off` — the
        `microphone` grant withheld — drawn with a line through the mark,
        because a decision somebody made must not read as a fault and the shape
        had to say so to anybody who cannot see the colour. That grant is gone
        (`@shared/grants` records why), so resting is the only thing that closes
        the device and the slash has nothing left to mean.
      */
      .mic {
        flex: none;
        display: flex;
        align-items: center;
        color: var(--live-off);
      }
      .mic svg {
        display: block;
        overflow: visible;
      }
      .mic .cap {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
      }
      .mic .arc,
      .mic .stem {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
      }
      .mic.open {
        color: var(--live);
      }
      /* Thicker when it is open, so the state carries at a glance and not only
         on inspection — this is the one fact on the strip that must not be
         missed. */
      .mic.open .arc,
      .mic.open .stem {
        stroke-width: 1.9;
      }
      /* FILLED when it is open, so the loudest state is also the solid one. */
      .mic.open .cap {
        fill: currentColor;
      }
      /*
        Present to a screen reader, absent to a pointer. Not `display: none`,
        which removes it from the accessibility tree as well and would delete
        the one sentence this mark exists to say.
      */
      .ghost {
        position: absolute;
        width: var(--s-px);
        height: var(--s-px);
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      .grow {
        flex: 1;
      }
      .stat {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }

      /* ---- the three named places ------------------------------------------ */
      /*
        A tab strip under the state bar, not beside the content. The window has
        one subject at a time now, so the switch belongs where a window title
        would be rather than inside either pane.
      */
      .shell-tabs {
        flex: none;
        display: flex;
        align-items: center;
        gap: var(--s1);
      }
      .shell-tab {
        padding: var(--s1) var(--s4);
        border: 0;
        border-bottom: var(--s0) solid transparent;
        border-radius: var(--r-pill);
        background: transparent;
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: var(--w-bold);
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--ink-3);
        cursor: default;
      }
      .shell-tab:hover {
        color: var(--ink-2);
      }
      /*
        Her colour, because which place you are in is chrome — and this palette's
        chrome has no hue of its own. `--her-deep` is the one that carries it.
      */
      /*
        A FILLED pill in her colour, not an underline.

        The underline was right while this strip was a row of its own; in the
        title strip it competes with the rule under it. Filled says "you are
        here" at a glance, and `--her-deep` is the token that exists so her
        colour can carry white — swept for every theme and refused by
        `contrastFailures` for a hue it would fail on.
      */
      .shell-tab[aria-current='true'] {
        background: var(--her-deep);
        color: var(--her-deep-ink);
        border-bottom-color: transparent;
      }
      /* Each pane owns the whole window under the strip. */
      .tab-pane {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      /* ---- archive: the day list, and one conversation at a time ------------ */
      .archive-body {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
      }
      /*
        A COLUMN, not a card floating in a padded field.

        It was inset with a border and a 12px radius, which put a rounded box of
        list inside a rectangle of window and left a 20px channel of nothing
        between it and the transcript. The artifact runs it edge to edge with a
        single rule down the right, exactly as the Cast list does — one window,
        one treatment for a column of choices.
      */
      .archive-side {
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--paper-2);
        border-right: var(--s-px) solid var(--rule);
      }
      .archive-side > .list {
        flex: 1;
        margin: 0;
        overflow-y: auto;
      }

      /* ---- the calendar over the day it opens on --------------------------- */
      .cal {
        flex: none;
        padding: var(--s5) var(--s5) var(--s4);
        border-bottom: var(--s-px) solid var(--rule);
      }
      .cal .head {
        display: flex;
        align-items: center;
        gap: var(--s2);
        margin-bottom: var(--s4);
      }
      .cal .month {
        flex: 1;
        min-width: 0;
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: var(--w-bold);
        letter-spacing: var(--track);
        text-transform: uppercase;
      }
      .cal .step {
        flex: none;
        display: flex;
        padding: var(--s1);
        border: 0;
        border-radius: var(--r1);
        background: transparent;
        color: var(--ink-3);
        cursor: default;
      }
      .cal .step:hover:not(:disabled) {
        background: var(--paper-hover);
        color: var(--ink);
      }
      .cal .step:disabled {
        opacity: 0.3;
      }
      .cal .step svg {
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .cal .grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: var(--s-px);
      }
      .cal .initial {
        display: grid;
        place-items: center;
        height: var(--s6);
        font-family: var(--narrow);
        font-size: var(--t-nano);
        font-weight: var(--w-bold);
        letter-spacing: var(--track-2);
        color: var(--ink-3);
      }
      /*
        A day is a button only when there is something on it. A cell that looks
        pressable and answers with an empty column is the same lie as a tool she
        cannot call.
      */
      .cal .day {
        position: relative;
        display: grid;
        place-items: center;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: var(--r2);
        background: transparent;
        color: var(--ink-3);
        font: inherit;
        font-size: var(--t-data);
        font-variant-numeric: tabular-nums;
        cursor: default;
      }
      .cal .day.has {
        color: var(--ink);
        font-weight: var(--w-semibold);
      }
      .cal .day.has:hover {
        background: var(--paper-hover);
      }
      /* Today is named even when nothing happened on it. */
      .cal .day.today {
        box-shadow: inset 0 0 0 1px var(--rule);
      }
      .cal .day[aria-current='true'] {
        background: var(--her-deep);
        box-shadow: none;
        color: var(--her-deep-ink);
      }
      /* How much was said, without saying how much. */
      .cal .day .dot {
        position: absolute;
        bottom: 3px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--her);
      }
      .cal .day[aria-current='true'] .dot {
        background: var(--her-deep-ink);
      }
      /*
        `.blank`, NOT `.empty` — which this window already uses for the sentence
        it shows when a pane has nothing in it: `margin: 26px auto` and a 46ch
        measure. Those landed on the five leading cells of a month and made two
        of the six week rows 80px tall instead of 28.

        The seventh rule in this stylesheet to mean two things at once, and the
        first one a picture caught before a person did.
      */
      .cal .blank {
        height: 28px;
      }
      /* The day the list is showing, over the list. */
      .archive-side .picked {
        flex: none;
        display: flex;
        align-items: baseline;
        gap: var(--s3);
        padding: var(--s4) var(--s5) var(--s2);
      }
      .archive-side .picked .what {
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: var(--w-bold);
        letter-spacing: var(--track);
        text-transform: uppercase;
      }
      .archive-side .picked .stat {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      .archive-side > .list .entry:first-child {
        border-top: 0;
      }
      /*
        A day, over the run of conversations that happened on it.

        Every row used to begin with its own "Today"/"Yesterday" in a list that
        was already in date order — 173 rows each restating the same word. The
        day moves to a heading and the row keeps the clock, which is what the
        artifact draws and what makes the column scannable at that length.
      */
      .archive-side > .list .day {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: var(--s4) var(--s5) var(--s2);
        background: var(--paper-2);
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: var(--w-bold);
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--ink-3);
      }
      /* Nothing above the first heading to rule off from. */
      .archive-side > .list .day + .entry {
        border-top: 0;
      }
      /*
        A conversation marked for deletion.

        Her colour rather than red: the row is SELECTED, which is a neutral
        state — the red belongs on the button that acts, not on everything the
        button might reach. Marking three rows red before anybody has decided
        reads as though the deletion has already happened.
      */
      .entry.picked {
        background: var(--her-wash);
        box-shadow: inset 2px 0 0 var(--her);
      }
      /* The tick, which is what makes "selected" legible without colour. */
      .entry .tick {
        display: none;
        margin-right: var(--s2);
        color: var(--her);
        font-variant-numeric: tabular-nums;
      }
      .picking .entry .tick {
        display: inline;
      }
      /*
        The confirmation. Centred, narrow, and quiet — the backdrop does the
        work of saying "answer this first", so the box itself does not need to
        shout.
      */
      #sure {
        max-width: 42ch;
        padding: var(--s6);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r3);
        background: var(--paper);
        color: var(--ink);
      }
      #sure::backdrop {
        background: color-mix(in oklab, var(--ink) 32%, transparent);
      }
      #sure h2 {
        margin: 0 0 var(--s3);
        font-size: var(--t-h3);
      }
      #sure p {
        margin: 0 0 var(--s6);
        color: var(--ink-2);
        font-size: var(--t-sm);
        line-height: var(--leading);
      }
      .sure-do {
        display: flex;
        gap: var(--s3);
        justify-content: flex-end;
      }
      /* The transcript column: its own scroll, clear of the drawer's hairline. */
      #talk {
        min-height: 0;
        overflow-y: auto;
        padding: var(--s7) var(--s7) var(--s8);
      }

      /* What the whole tab is for, under the six groups that make it up. */
      .nav-foot {
        margin: auto 0 0;
        padding: var(--s6) var(--s5) 0;
        font-size: var(--t-cap);
        line-height: var(--leading);
        color: var(--ink-3);
      }

      /* ---- machine: the six groups, as they were ---------------------------- */
      .machine {
        display: grid;
        grid-template-columns: 196px minmax(0, 1fr) 320px;
        min-height: 0;
      }
      .nav-head {
        padding: 0 var(--s4) var(--s3);
      }
      /* The tool list, beside the grants that decide which rows it has. */
      .machine-tools {
        min-height: 0;
        overflow-y: auto;
        padding: var(--s5) var(--s6) var(--s6) 0;
      }
      /*
        NOT `.card`, which in this window means a CHARACTER card.
        
        It was, for one build. `.card .name` sets `--t-h3` for a character's
        name, so every tool name rendered at 21px and `recall_conversations`
        wrapped mid-word. Measured, not noticed: 21px where 13 was asked for.
        The third collision this window has had from a generic class name, and
        the reason `stylesheets.test.ts` checks the ones the renderer creates.
      */
      .machine-tools > .tool-card {
        background: var(--paper-2);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r3);
        padding: var(--s5);
      }
      .machine > .nav {
        display: flex;
        flex-direction: column;
        padding: var(--s5) var(--s3);
        border-right: var(--s-px) solid var(--rule);
        overflow-y: auto;
      }
      /*
        The groups fill the nav, so the footer under them can sit at the bottom.

        The gap lives here rather than on `.nav` because `.nav` now holds two
        things — the heading and this — and one gap governing both would put the
        buttons' 2px between the heading and the first of them.
      */
      #nav-groups {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s0);
      }
      .machine-pane {
        min-height: 0;
        overflow-y: auto;
        padding: var(--s5) var(--s6) var(--s6);
      }
      .tab {
        display: flex;
        align-items: center;
        gap: var(--s3);
        width: 100%;
        text-align: left;
        padding: var(--s2) var(--s4);
        border: 0;
        border-radius: var(--r2);
        background: transparent;
        color: var(--ink-2);
        font: inherit;
        font-size: var(--t-sm);
        cursor: default;
      }
      .tab:hover {
        background: var(--paper-hover);
      }
      .tab[aria-current='true'] {
        background: var(--chrome-wash);
        color: var(--ink);
        font-weight: var(--w-semibold);
      }
      /* A dot means somebody should look, not that something is off. */
      .tab .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--warn-line);
        margin-left: auto;
        flex: none;
      }
      /*
        What this machine's Codex is worth, above the settings that depend on it.

        A CARD rather than a bare note, and drawn in both the healthy and the
        unhappy case. This used to be one red line that appeared only when the
        CLI was missing, which gave "nothing here" two meanings — everything is
        fine, and the check has not finished — for a check that genuinely has a
        not-finished-yet state.

        `--warn-*` rather than `--red`: an unusable Codex is a machine somebody
        has to go and fix, not a fault in this application, and the same family
        marks the problems chip in the drawer for the same reason.
      */
      .codex {
        display: flex;
        flex-direction: column;
        gap: var(--s2);
        margin-bottom: var(--s5);
        padding: var(--s4) var(--s5);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r3);
        background: var(--paper-2);
      }
      .codex.bad {
        border-color: var(--warn-line);
        background: var(--warn-bg);
      }
      /*
        The light, the state, and the button — one line, in that order.

        `grow` on the sentence rather than `margin-left: auto` on the button, so
        the button is pushed by the thing it is about rather than pulling itself
        away from it. The difference shows the moment the sentence wraps: the
        button stays on the first line's baseline either way.
      */
      .codex-head {
        display: flex;
        align-items: center;
        gap: var(--s3);
      }
      .codex-said {
        flex: 1;
        min-width: 0;
        font-size: var(--t-cap);
        color: var(--ink-2);
      }
      .codex.bad .codex-said {
        color: var(--warn-ink);
        font-weight: var(--w-semibold);
      }
      .codex-head .btn {
        flex: none;
      }
      /*
        Green when it is working, and NOT red when it is not.

        `--ok` is the fourth status family and the only one that means "this is
        fine" — see `tokens.css` for why it is fixed rather than hers, and for
        the measurements. Unlit is `--warn-line`, not `--red`: an unusable Codex
        is a machine somebody has to go and fix, not a fault in this
        application, and red would make an errand look like a crash.

        A ring around the lit one only. An 8px dot of colour on paper reads as a
        bullet; the glow is what makes it a light, and it should only be there
        when there is something to be pleased about.
      */
      .light {
        width: var(--s3);
        height: var(--s3);
        flex: none;
        border-radius: 50%;
        background: var(--warn-line);
      }
      .light.on {
        background: var(--ok);
        box-shadow: 0 0 0 3px var(--ok-wash);
      }
      .codex .note {
        margin: 0;
      }
      /* A destructive button that has been armed and wants a second press. */
      .btn.arming {
        color: var(--red);
        border-color: var(--red);
      }
      /* Her size: a slider and the number it is showing. */
      .size-row {
        display: flex;
        align-items: center;
        gap: var(--s3);
      }
      .size-slider {
        flex: 1 1 auto;
        min-width: 0;
      }
      .size-reading {
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
        min-width: 4ch;
        text-align: right;
      }
      .field {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: var(--s5);
        align-items: center;
        padding: var(--s3) 0;
      }
      .field > label {
        color: var(--ink-2);
        font-size: var(--t-sm);
      }
      .grant {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--s5);
        padding: var(--s4) 0;
        border-bottom: var(--s-px) solid var(--rule);
      }
      .grant .name,
      .cap .name {
        font-weight: var(--w-semibold);
      }
      .grant .desc,
      .cap .desc {
        margin: var(--s0) 0 0;
        font-size: var(--t-sm);
        color: var(--ink-2);
      }
      .grant .right {
        text-align: right;
        flex: none;
      }
      .grant .switch {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--s2);
      }
      .grant .used {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      .cap {
        padding: var(--s4) 0;
        border-bottom: var(--s-px) solid var(--rule);
      }
      .cap .name {
        font-family: var(--mono);
        font-size: var(--t-sm);
        color: var(--gold);
      }
      .folder {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s5);
        padding: var(--s3) 0;
        border-bottom: var(--s-px) solid var(--rule);
      }
      /*
        A field and the button that fills it, on one line.

        The button sits AFTER the input and does not grow: the field is the part
        that has to be readable at a glance -- a workspace is a long path -- and
        a two-column grid would give a four-word button as much room as it.
      */
      .picker {
        display: flex;
        align-items: center;
        gap: var(--s3);
        min-width: 0;
      }
      .picker > input {
        flex: 1 1 auto;
        min-width: 0;
      }
      .picker > .btn {
        flex: none;
      }
      .folder .refused {
        font-size: var(--t-data);
        color: var(--red);
      }
      .keys-right {
        display: flex;
        align-items: center;
        gap: var(--s3);
        flex: none;
      }
      /*
        The combination, as the control that changes it.

        Monospaced and fixed-width so a row does not jump as the label swaps
        between a combination and "Press a combination…" -- a button that
        resizes under the pointer is one that gets mis-clicked.
      */
      .btn.key {
        font-family: var(--mono);
        font-size: var(--t-data);
        min-width: 18ch;
        text-align: center;
      }
      /*
        Listening. It takes HER colour rather than a warning colour: nothing is
        wrong, the control is waiting, and her colour is the one thing on screen
        that already means "this is live".

        `--her`, not `--accent`. There is no `--accent` — `accent.ts` renamed it
        and says why — and a rule naming one would have been a state that draws
        exactly like the resting one, which is a capture control with no way to
        tell whether it is capturing.
      */
      .btn.key.listening {
        border-color: var(--her);
        color: var(--her);
      }
      .note.bad {
        color: var(--red);
      }

      /* ---- characters ------------------------------------------------------ */
      .strip {
        flex: none;
        display: flex;
        align-items: baseline;
        gap: var(--s4);
        padding: var(--s6) var(--s6) 0;
      }
      h3 {
        margin: 0;
        font-family: var(--narrow);
        font-size: var(--t-data);
        font-weight: var(--w-bold);
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--ink-3);
      }
      /*
        The cast, as a column of rows.

        It was a row of wide cards across the top of the window: the widest part
        of the screen spent on the characters you are NOT editing, with the one
        you are in a strip beneath. A list holds as many as you like in the
        space four cards needed, and it is what the artifact draws.
      */
      .cards {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s1);
        padding: 0 var(--s3) var(--s5);
        overflow-y: auto;
      }
      /*
        The list's own footer: what you do TO the list, under it.

        `flex: none` against the `.cards` above it, which is `flex: 1` and
        scrolls — so the buttons stay put while the characters move past them,
        which is the whole reason this is a footer rather than the bottom of the
        scroll. The rule above it is the same one the drawer draws across the
        window, and it means the same thing in both places.

        `flex-wrap` because "Delete Constance Wickham" is as long as the label
        gets and this column is 268px: without it the row would decide the
        column's width instead of the other way round.
      */
      .cast-foot {
        flex: none;
        padding: var(--s4) var(--s5) var(--s5);
        border-top: var(--s-px) solid var(--rule);
      }
      .cast-foot .row {
        gap: var(--s2);
      }
      .cast-foot input[type='text'] {
        width: 100%;
      }
      .cast-foot .btn {
        /* The window-wide floor is 9ch, which overflows a 268px column two
           buttons wide. They are stacked here, so the floor has nothing to
           even up and a full-width button is the more legible answer. */
        min-width: 0;
        width: 100%;
      }
      .card {
        display: flex;
        align-items: center;
        gap: var(--s3);
        padding: var(--s2) var(--s3);
        border: 0;
        border-radius: var(--r3);
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: default;
      }
      .card .tile {
        flex: none;
        display: block;
      }
      /*
        Her face could not be resolved, so the row says so instead of showing
        the built-in and letting a list of identical mochis pass for a design.
        A dashed hole is the smallest honest thing that fits where she goes.
      */
      .card.faceless .tile {
        width: 44px;
        height: 44px;
        border: var(--s-px) dashed var(--warn-line);
        border-radius: var(--r2);
      }
      .card .titles {
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--s-px);
      }
      /*
        NOT gold. In the artifact gold is what "STAGED · NOT GRANTED" is written
        in — a state that wants looking at — so a gold edge appearing under the
        pointer says a character has a problem every time the mouse crosses it.
      */
      .card:hover {
        background: var(--paper-hover);
      }
      /*
        A FILL, not an outline.

        This was a 1px edge in her colour with a lift under it, which is what the
        artifact draws — and in a column of otherwise borderless rows it read as
        one row having been promoted to a button rather than as the row being
        open. An outline is a shape; a wash is a state.

        The same treatment the Machine tab's nav already gives the group you are
        in, twelve pixels away in the same window and doing exactly the same job:
        saying which of N things this column is currently about.

        Not `--paper` either. It is 3% off the `--paper-2` this column is painted
        with, so without the edge it was invisible; the edge had been carrying
        the whole indication.
      */
      .card[aria-current='true'] {
        background: var(--chrome-wash);
      }
      .card .name {
        font-size: var(--t-ui);
        font-weight: var(--w-semibold);
        letter-spacing: var(--track-tight);
        overflow-wrap: anywhere;
      }
      .card .worn {
        font-family: var(--narrow);
        font-size: var(--t-nano);
        font-weight: var(--w-semibold);
        letter-spacing: var(--track-2);
        text-transform: uppercase;
        color: var(--ink-3);
      }
      /*
        Which one she IS, said once, on the row it is true of.

        A tick, not the word in a pill. The row already carries her name, her
        pronoun and her voice, and a fourth caps word was the loudest thing on it
        and said the least. Her colour, so the mark is the same fact the accent
        already stands for — see `tokens.css` on the two jobs it keeps.
      */
      .card .wearing {
        flex: none;
        display: flex;
        color: var(--ink-brand);
      }

      /* ---- cast: a list, the open character, and what she will be told ------ */
      .cast {
        display: grid;
        grid-template-columns: 268px minmax(0, 1fr) 360px;
        min-height: 0;
      }
      .cast-list {
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--paper-2);
        border-right: var(--s-px) solid var(--rule);
      }
      /*
        A COLUMN, like the cast list opposite it — not a card inside one.

        `#panel-wake` carried `.panel`: a bordered, rounded, `--paper-2` card
        with its own 16px padding, sitting inside a bordered `--paper-2` column.
        Two edges and two surfaces for one thing, and the inner one said nothing
        the outer had not. The class had no other user in this window and its
        rules went with it.

        20px of padding rather than 16, so this column's heading sits on the
        same line as `CHARACTERS` on the far side. They were 13px apart.

        A BOTTOM as well, which it did not have. Nothing used to reach the foot
        of this column — the panel stopped wherever its text ran out and left
        blank paper under it — so an open bottom cost nothing and was never
        noticed. Save and Cancel sit on that edge now, and a button flush
        against the drawer's rule reads as having fallen out of the column.
      */
      .cast-wake {
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: var(--s6);
        background: var(--paper-2);
        border-left: var(--s-px) solid var(--rule);
      }

      /*
        How tall the system prompt panel's two views are, at least.

        A local custom property rather than the number twice: the whole point is
        that the readout and the editor cannot disagree, and two literals is
        exactly how they would come to.
      */
      #app {
        --wake-floor: 220px;
      }

      /* ---- the controls the sections hold ---------------------------------- */
      /*
        Which words she takes: three choices, not a dropdown of three.

        A TRACK with a pill inside it, rather than a pill-shaped group whose
        current item is a full-bleed segment of it. Under the old rule the group
        carried the only radius and `overflow: hidden` clipped the fill to it —
        so the selected item was a rectangle in the middle and a half-pill at
        either end, and which shape it had depended on where it happened to sit
        in the list rather than on it being selected.

        The inner pill is also the shape the voice row beside it uses for the
        same job, so the pane now says "this one" one way instead of two.
      */
      .switchers {
        display: inline-flex;
        gap: var(--s0);
        padding: var(--s0);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r-pill);
      }
      .switchers button {
        border: 0;
        border-radius: var(--r-pill);
        background: transparent;
        padding: var(--s1) var(--s4);
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: var(--w-bold);
        letter-spacing: var(--track-2);
        text-transform: uppercase;
        color: var(--ink-3);
        cursor: default;
      }
      .switchers button:hover:not([aria-current='true']) {
        background: var(--paper-hover);
        color: var(--ink);
      }
      .switchers button[aria-current='true'] {
        background: var(--her-deep);
        color: var(--her-deep-ink);
      }
      /* Eight themes, drawn as her rather than as swatches of paint. */
      .themes {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
      }
      .theme {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: var(--r3);
        background: transparent;
        padding: 0;
        cursor: default;
      }
      .theme:hover {
        background: var(--paper-hover);
      }
      /*
        A FILL, not a box — the same answer the cast rows and the Machine nav
        give, and for the same reason: an outline is a shape and a wash is a
        state. Eight boxed swatches in a row read as eight buttons with one of
        them focused, rather than as one of eight colours being the one she is.
      */
      .theme[aria-current='true'] {
        background: var(--chrome-wash);
      }
      /*
        Ten voices as pills rather than a closed dropdown.

        They are all one word and the whole set fits in the width the dropdown
        would have taken shut, so a `<select>` here hid ten answers to save no
        room. The avatar list keeps its select: that one is as long as somebody's
        folder and has no bounded set to draw.
      */
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
      }
      .pills button {
        display: inline-flex;
        align-items: center;
        gap: var(--s2);
        padding: var(--s2) var(--s4);
        border: 0;
        border-radius: var(--r-pill);
        background: var(--paper-2);
        box-shadow: inset 0 0 0 1px var(--rule);
        color: var(--ink-2);
        font: inherit;
        font-size: var(--t-sm);
        cursor: default;
      }
      /*
        The mark on a recommended voice, and on the sentence that explains it.

        HER colour rather than the warning family: this is a suggestion, not
        something wrong. `--her-deep` so it carries against both the pill's
        `--paper-2` and the selected pill's `--her-wash`, where plain `--her`
        would nearly vanish.

        The word "recommended" is in the button's accessible name — see
        `chooser` — because an icon alone is only a statement to somebody
        already looking at it.
      */
      .pills .dot,
      .note .dot {
        width: var(--s2);
        height: var(--s2);
        border-radius: 50%;
        background: var(--her-deep);
        flex: none;
      }
      .note .dot {
        display: inline-block;
        vertical-align: middle;
      }
      .pills button:hover {
        box-shadow: inset 0 0 0 1px var(--ink-3);
        color: var(--ink);
      }
      .pills button[aria-current='true'] {
        background: var(--her-wash);
        box-shadow: inset 0 0 0 1px var(--her);
        color: var(--ink-brand);
        font-weight: var(--w-semibold);
      }
      /* The moods grid: eight tiles, each with the switch that decides it. */
      .moods {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: var(--s3);
      }
      .mood {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--s1);
        padding: var(--s4) var(--s3);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r3);
        background: var(--paper-2);
        text-align: center;
      }
      /*
        The face is a control now: click it to see that expression on her.

        Bare of every button default — a `<button>` does not inherit `font`, and
        it arrives with its own border, background and padding, all of which
        would draw a second box around a drawing that is already inside one.

        The affordance is the WASH, appearing on hover. A permanent outline
        around eight faces would read as eight buttons rather than as eight
        faces, which is the wrong subject: the drawing is what somebody came to
        this grid to look at.
      */
      .mood-try {
        display: block;
        padding: var(--s1);
        border: 0;
        border-radius: var(--r3);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: default;
      }
      .mood-try:hover {
        background: var(--paper-hover);
      }
      /* Dimmed with the tile it sits in, so a face she may not use does not
         advertise itself more loudly than one she may. Still clickable — being
         able to look at one before enabling it is the point. */
      .mood.off .mood-try:hover {
        background: var(--hair-soft);
      }
      .mood.off {
        border-style: dashed;
        background: transparent;
      }
      .mood.off .tile {
        opacity: 0.4;
      }
      .mood .name {
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: var(--w-bold);
        letter-spacing: var(--track-2);
        text-transform: uppercase;
      }
      .mood .when {
        font-size: var(--t-data);
        color: var(--ink-3);
        min-height: 2.4em;
      }
      .mood .allow {
        display: flex;
        align-items: center;
        gap: var(--s2);
        font-family: var(--narrow);
        font-size: var(--t-nano);
        letter-spacing: var(--track-2);
        text-transform: uppercase;
        color: var(--ink-3);
      }

      /* ---- what she will be told, down the right --------------------------- */
      /*
        The panel IS the column, not a block sitting at the top of one.

        `.cast-wake` is a grid item and stretches to the full height of the row;
        this was content-sized inside it, so `flex: 1` on the box below had no
        free space to distribute and the writing surface stopped dead at its
        220px floor. On a full-height window that left several hundred pixels of
        blank paper under the box you write paragraphs in.

        Filling the column is what lets the box grow to the sidebar, and what
        gives Save and Cancel a bottom edge to sit on instead of following the
        text up to wherever it happened to end.
      */
      #panel-wake {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s2);
      }
      /*
        CENTRE, not baseline. The count beside the heading is mono and the
        heading is narrow-caps; aligning their baselines pushed the h3 down by
        the difference between two fonts' metrics, which is how one of these two
        columns ended up with its title 13px lower than the other.
      */
      #panel-wake .row {
        align-items: center;
      }
      #panel-wake .note {
        margin: 0 0 var(--s2);
        font-size: var(--t-cap);
        line-height: var(--leading);
        color: var(--ink-3);
      }
      #panel-wake .meta {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      /*
        The box scrolls, the column does not.

        `.sheet` is a document and takes the window's one vertical bar; this is a
        fixed panel beside it holding a string that can be any length, so it has
        to have its own. Two bars on one axis is what the `pre` rule below
        refuses — these are two different axes' worth of content, side by side.
      */
      /*
        Ruled off, not boxed in.

        It was a bordered, rounded card inside a bordered column — a box in a
        box, and the inner one was carrying no information the outer one did not
        already give. The column's own edge says where this is; a single rule
        says where the assembled string starts.

        Full width by cancelling the column's padding, so the text runs to the
        same edges the heading above it does.
      */
      .wake-box {
        flex: 1;
        min-height: var(--wake-floor);
        overflow-y: auto;
        margin: 0 calc(var(--s6) * -1) 0;
        border-top: var(--s-px) solid var(--rule);
      }
      .wake-box > pre {
        border: 0;
        border-radius: 0;
        background: transparent;
        padding: var(--s4) var(--s6);
      }
      /*
        The editor, occupying exactly what the readout beside it does.

        Both are `flex: 1` in the same column and only one is ever shown, so
        switching between Sent and Write must not move anything else on the
        panel — a Save button that jumped when you pressed a tab would read as
        the tab having done something else.

        Edge to edge, like `.wake-box`, so a long line disappears AT a drawn
        rule rather than at an arbitrary inset — the finding the shelf's scroll
        regions were rebuilt around.
      */
      .wake-edit {
        flex: 1;
        /*
          The SAME floor as the readout, and now ONLY a floor.

          It used to be the size. The panel was content-driven, so `flex: 1` had
          nothing to distribute: the textarea's `rows` set one height and the
          `<pre>`'s content set the other, and the panel grew by 35px when you
          pressed Write. Measured, not noticed: 166 against 201 in the same
          window.

          The panel fills the column now, so both views take everything the
          heading, the notes and the action row leave — the same amount, because
          they are the same box in the same place. What the floor still does is
          stop that amount going to nothing in a 560px window, which is as short
          as this one is allowed to get.
        */
        min-height: var(--wake-floor);
        margin: 0 calc(var(--s6) * -1) 0;
        /*
          The READOUT's inset, not the base rule's.

          `pre, textarea` pads by `--s4`, and `.wake-box > pre` overrides the
          horizontal half to `--s6` so the assembled string starts under the
          heading. The editor kept the 12px and nothing said so: the first
          character of the document you write sat 8px left of the first
          character of the string it produces, and the text shifted under the
          pointer when you pressed Write. The panel already refuses to move its
          two views relative to each other; this is that same promise about
          where the words begin.
        */
        padding: var(--s4) var(--s6);
        border-width: var(--s-px) 0 0;
        border-radius: 0;
        resize: none;
      }
      /*
        NO ring on this one. The rule it hangs from darkens instead.

        `:focus-visible` is 2px of gold, which is right for a control with an
        edge of its own for a ring to sit outside. This box has no edges: its
        sides are cancelled and its negative margins put it against the column's
        rule on one side and the window's edge on the other. So the ring drew a
        gold rectangle around the one thing on this panel that is deliberately
        not a rectangle — straddling the column's border on the way out, and
        boxing in a full-bleed writing surface when pulled back inside. There is
        no offset that makes a box correct where there is no box.

        The hairline going to ink says the same thing and says it in the
        window's own voice. It is the answer her name already gives on the pane
        beside this one, where the shared field box is undone for the same
        reason and a single line carries the focus.

        `:focus` rather than `:focus-visible` — a text box matches the latter
        however focus arrived, and matching the wider rule is what keeps a click
        and a Tab looking the same.
      */
      .wake-edit:focus-visible {
        outline: none;
      }
      .wake-edit:focus {
        border-top-color: var(--ink);
      }
      /*
        A prompt nobody has written must not read as one somebody has.

        The placeholder is four lines of prose in the document's own mono, at
        its size, in its ink — so an empty file looked like a written one, and
        `0 chars` beside the heading was the only thing on the panel that
        disagreed. `--ink-3` is the answer this window already gives to the same
        question one column over, where `pre.empty-note` says what an empty
        memory means.

        Mono still, and deliberately: `{style}` and `{notes}` are strings
        somebody types, and a proportional font would stop them looking like it.
      */
      .wake-edit::placeholder {
        color: var(--ink-3);
      }
      /*
        The two tabs, at the size of the heading they sit beside.

        `.switchers` is the pronoun control's shape and this borrows it whole —
        one way of saying "this one, not that one" in this window. Smaller here
        because it shares a line with an h3 rather than standing under one.
      */
      .wake-tabs button {
        padding: var(--s0) var(--s3);
        font-size: var(--t-nano);
      }
      /*
        On the bottom edge, under a box that has taken everything above them.

        `flex: none`, so the box grows and these keep their height rather than
        the other way round. The margin is because they are what you do when you
        have STOPPED writing — pressed against the writing surface they read as
        part of it. The air underneath is the column's own bottom padding, so
        the two gaps are set in one place each and neither is a number.
      */
      .wake-actions {
        flex: none;
        justify-content: flex-end;
        margin-top: var(--s4);
      }

      /* ---- the open character's column ------------------------------------- */
      /*
        By id rather than by class.

        It was `.open`, and so is the microphone pill's lit state — one global
        stylesheet, two meanings, and this rule came second, so `display: flex;
        flex-direction: column; overflow-y: auto` landed on the PILL: its dot
        stacked above its label and it became a scroll container 43px tall. An
        id cannot collide with a state class, which is why the fix is here and
        not a more specific selector that would only postpone it.
      */
      #pane {
        min-height: 0;
        overflow-y: auto;
      }
      /*
        The stack of sections, and the reason it needs a rule of its own.

        `#pane` was `flex-direction: column` with a `gap`, and that gap governed
        `#pane`'s CHILDREN -- of which there is exactly one, this element.
        `characterSheet` wraps everything in it, so the gap styled a single
        wrapper and the contents inside had nothing between them at all:
        measured 0.0px on all six boundaries. Adjacent 1px borders read as a
        table rather than as an obvious fault, which is why it survived.

        The air is the SECTIONS' own padding now, so there is no container gap
        left to put on the wrong box.
      */
      .sheet {
        display: flex;
        flex-direction: column;
      }
      /*
        A section: a caps heading, a hint in mono beside it, and whatever
        control the field actually wants underneath.

        This replaced a `.plate` — one labelled row, a value, and a meta string
        — used for every field alike, which made her name, her colour and her
        memory look like rows of one table. Eight themes want a grid of faces, a
        prompt wants a textarea, a voice wants ten pills; a plate can offer one
        shape and did.
      */
      .section {
        display: flex;
        flex-direction: column;
        gap: var(--s4);
        padding: var(--s6) var(--s7);
        border-bottom: var(--s-px) solid var(--rule);
      }
      /* Nothing below the last one to divide it from. */
      .section:last-child {
        border-bottom: 0;
        padding-bottom: var(--s8);
      }
      .section > .head {
        display: flex;
        align-items: baseline;
        gap: var(--s4);
      }
      .section .hint {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      .section .note {
        margin: 0;
        max-width: 68ch;
        font-size: var(--t-ui-2);
        line-height: var(--leading);
        color: var(--ink-2);
      }
      .section .note.bad {
        color: var(--warn-ink);
      }
      /*
        `.moment`, not `.field` — which this window already uses for the Machine
        tab's label-beside-control grid, at `align-items: center` and 150px of
        label. `.section .field` won on the properties it named and lost on the
        one it did not, so these two boxes were column-flexed AND centre-aligned:
        a caps label floating over a 157px input in a 374px cell.

        The sixth rule in this stylesheet to mean two things at once. Every one
        of them compiled and passed the suite.
      */
      .moment {
        display: flex;
        flex-direction: column;
        gap: var(--s1);
      }
      .moment .label,
      .who-facts .label {
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: var(--w-bold);
        letter-spacing: var(--track-2);
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .moments {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--s4);
      }
      /*
        VERTICAL only. `resize: both` let the box be dragged wider than the
        column it sits in — and it made the textarea a scroll container, which
        is the second bar on one axis the `pre` rule below refuses.
      */
      .section textarea {
        resize: vertical;
      }

      /* ---- who she is, across the top of her column ------------------------ */
      /*
        `.who-band`, NOT `.who` — which this window already uses for the speaker
        label over a turn in a transcript. That is the fifth collision of this
        exact shape here: `.open` was the microphone pill and the open column,
        `.sheet` was styled on the wrong container, `.card` was a character and
        a tool, and each one compiled, linted, passed the suite and governed the
        wrong element. Two meanings in one global stylesheet is the defect;
        naming the specific thing is the fix.
      */
      .who-band {
        display: flex;
        align-items: flex-end;
        gap: var(--s6);
        padding: var(--s7) var(--s7) var(--s6);
        border-bottom: var(--s-px) solid var(--rule);
      }
      .who-band .tile {
        flex: none;
      }
      .who-of {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: var(--s2);
        padding-bottom: var(--s2);
      }
      /*
        Her name at h1, with no box until it is touched.

        The largest thing on the pane is her name; that it is editable is worth
        less than that it is her name. The underline appears on hover and focus,
        so the affordance is there the moment somebody goes looking for it.
      */
      /*
        `input[type='text'].who-name`, not `.who-name`.

        The bare class is (0,1,0) and the window's own `input[type='text']` rule
        is (0,1,1), so it WON — her name kept the ordinary field's box, border
        and 13px type however carefully this block described a title. Written up
        because it is the same family as the four class collisions above: a rule
        that reads as correct, compiles, and governs nothing.
      */
      input[type='text'].who-name {
        width: 100%;
        padding: var(--s0) 0;
        border: 0;
        border-bottom: var(--s-px) solid transparent;
        border-radius: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: var(--t-h1);
        font-weight: var(--w-bold);
        letter-spacing: var(--track-tight);
      }
      /*
        The two shared states are UNDONE here, not merely added to.

        `tokens.css` gives every field a `--rule` border and a `--paper` fill on
        hover and focus. Winning on specificity is not enough, because the
        cascade runs per DECLARATION: a rule that names only
        `border-bottom-color` leaves the shared `border-color` and
        `background-color` in force however specific it is, and her name would
        grow the full box this whole block exists to remove — on hover only,
        which is exactly the kind of thing a screenshot of a resting window does
        not show. So every property the shared rule sets is named back.
      */
      input[type='text'].who-name:hover,
      input[type='text'].who-name:focus {
        border-color: transparent;
        background-color: transparent;
      }
      input[type='text'].who-name:hover {
        border-bottom-color: var(--rule);
      }
      input[type='text'].who-name:focus {
        outline: none;
        border-bottom-color: var(--ink);
      }
      .who-facts {
        display: flex;
        align-items: center;
        gap: var(--s3);
      }
      .who-facts .meta {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
        overflow-wrap: anywhere;
      }
      input[type='text'].inline {
        width: 132px;
        padding: var(--s0) var(--s3);
        font-size: var(--t-sm);
      }

      pre,
      textarea {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
        padding: var(--s4);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r2);
        background: var(--paper);
        color: inherit;
        font-family: var(--mono);
        /*
          `--t-data`, which is what every other piece of mono in this window is
          set in — the hints beside the headings, the paths, the counts, the
          problem chip in the drawer. This said `--t-label`, and `--t-label` is
          11px because it is the size of a CAPS LABEL of two or three words.
          These three boxes are documents: the prompt you write, the string it
          produces, and the note she keeps. One pixel, and it is the difference
          between glancing at a word and reading a paragraph.
        */
        font-size: var(--t-data);
        line-height: var(--leading-long);
        user-select: text;
      }
      /*
        A `pre` does NOT scroll on its own inside `#pane`.

        It used to: `max-height: 34vh; overflow-y: auto`, which put a second
        scrollbar a dozen pixels from the column's own, cut across the plate's
        8px corner, and made reading her notes a question of which of two bars
        the pointer happened to be over. One column, one axis, one bar. The
        column beside it keeps its own, and should — `.wake-box` is a panel of
        fixed height holding a string of any length, not a document.
      */
      pre.empty-note {
        color: var(--ink-3);
      }

      /* ---- the inspector --------------------------------------------------- */
      aside {
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s4);
      }
      .list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        margin: 0 calc(var(--s5) * -1) calc(var(--s5) * -1);
      }
      .entry {
        display: block;
        width: 100%;
        text-align: left;
        padding: var(--s3) var(--s5);
        border: 0;
        border-top: var(--s-px) solid var(--rule);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: default;
      }
      .entry:hover {
        background: var(--hair-soft);
      }
      .entry[aria-current='true'] {
        background: var(--gold-wash);
        box-shadow: inset 2px 0 0 var(--gold);
      }
      /* The clock and the facts, on one line — `09:41 · 14 turns · 7 min`. */
      .entry .when {
        display: flex;
        align-items: center;
        gap: var(--s3);
        font-size: var(--t-ui-2);
        font-weight: var(--w-semibold);
      }
      .entry .snippet {
        font-size: var(--t-data);
        color: var(--ink-2);
      }
      .entry .snippet {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      /*
        What the conversation was about, under the clock.

        Darker and heavier than a snippet, because it is the thing somebody
        scans the column FOR — the snippet is evidence for a search, and this is
        the row's own name for itself.

        Clamped to one line, not two. A subject is bounded at 80 characters, so
        a second line only happens in a narrow column — and a title that wraps
        stops being scannable, which is the whole reason it is not the first
        line of the transcript.
      */
      .entry .subject {
        font-size: var(--t-sm);
        color: var(--ink);
        font-weight: var(--w-medium);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ---- a conversation, as a conversation ------------------------------ */
      /*
        Bubbles carry the surfaces, so the field they sit on does not.

        The container had a card of its own one commit ago, which was the right
        answer while a transcript was bare paragraphs hanging in an empty column
        and the wrong one now: a bubble inside a card is two surfaces deep and
        reads as a panel of panels. The problem list still gets a card -- it is a
        report, not a conversation -- which is why it has its own class now
        rather than borrowing this one.
      */
      /*
        Full width of the column, and the measure moves to the BUBBLE.

        With `max-width: var(--reading)` here the right-aligned side hugged the
        edge of an invisible 82ch box rather than the edge of the pane, so your
        replies floated in the middle of a wide column and read as broken
        alignment. In a conversation the thing that needs a reading measure is
        the bubble; the field it sits on needs both edges, because which edge a
        bubble is on is what says who is speaking.
      */
      .transcript {
        /*
          A measure, centred. A transcript set to the full width of a 900px
          column is a line long enough to lose your place in — the artifact
          holds it to 78ch and centres it, which is what every other document
          in this window is already doing by having a narrower column.
        */
        max-width: 78ch;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: var(--s6);
      }
      /*
        What this conversation was, over the top of it.

        The artifact draws a row of tool chips here too — `ask_workspace ×2`.
        Nothing archives a call: `transcripts.ts` stores `{at, who, text, cut}`
        and a capability's answer reaches the model and the problem log and
        never the record. Drawing the chips would be inventing them —
        `plan-v2.md` W5 has what it would take.
      */
      .talk-head {
        display: flex;
        flex-direction: column;
        gap: var(--s3);
        padding-bottom: var(--s5);
        border-bottom: var(--s-px) solid var(--rule);
      }
      .talk-when {
        font-size: var(--t-h2);
        font-weight: var(--w-bold);
        letter-spacing: var(--track-tight);
      }
      .talk-facts {
        display: flex;
        align-items: center;
        gap: var(--s4);
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      /*
        What she reached for, on its own row under the facts.

        Wrapping, because the number of capabilities is not bounded by this
        stylesheet -- a build with six would otherwise push the row off its
        column rather than taking a second line.
      */
      .talk-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s2);
      }
      /*
        A chip reads as a THING SHE DID, not as a control.

        No border and no pointer: nothing here is clickable, and a pill with an
        outline in a window whose other pills are buttons would invite the
        click it cannot answer. The wash carries her colour, so the row belongs
        to the character whose conversation it is.
      */
      .tool-chip {
        display: inline-flex;
        align-items: baseline;
        gap: var(--s1);
        padding: var(--s0) var(--s3);
        border-radius: var(--r-pill);
        background: var(--her-wash);
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-2);
      }
      .tool-name {
        font-weight: var(--w-medium);
      }
      /* Drawn only above one, and quieter than the name it qualifies. */
      .tool-uses {
        color: var(--ink-3);
      }
      /*
        A glyph and a number, in the two places that draw the same two facts.

        `14 turns · 7 min` was the same two nouns down a whole column, and the
        numbers are what somebody is comparing. The noun survives as the
        accessible name and the tooltip — see `glyph.ts` — so nothing is lost to
        anybody who cannot see the picture.

        Quieter than what it sits beside: in the list the clock is the row's
        subject and these are its footnotes, so they take `--ink-3` against the
        entry's own weight rather than matching it.
      */
      .fact {
        display: inline-flex;
        align-items: center;
        gap: var(--s1);
        flex: none;
        font-family: var(--mono);
        font-size: var(--t-data);
        font-weight: var(--w-regular);
        color: var(--ink-3);
      }
      .fact svg {
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* One speaker's unbroken stretch. Her face sits with the last bubble. */
      .run {
        display: flex;
        align-items: flex-end;
        gap: var(--s3);
      }
      .run.you {
        flex-direction: row-reverse;
      }
      .run .tile {
        flex: none;
        display: block;
        margin-bottom: var(--s0);
      }
      .run.faceless .tile {
        width: 28px;
        height: 28px;
        border: var(--s-px) dashed var(--warn-line);
        border-radius: var(--r-pill);
      }
      .said {
        display: flex;
        flex-direction: column;
        gap: var(--s1);
        /*
          Two limits, and the smaller wins. The percentage keeps a bubble from
          reaching both edges -- one that does is a paragraph with rounded
          corners and the shape stops saying anything. The `ch` keeps a wide
          window from producing a 700px line, which is past comfortable reading
          whatever shape it is in.
        */
        max-width: min(72%, 54ch);
        min-width: 0;
      }
      .run.you .said {
        align-items: flex-end;
      }
      .who {
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: var(--w-semibold);
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--ink-3);
        margin-bottom: var(--s0);
      }
      .run.her .who {
        color: var(--ink-brand);
      }
      /*
        Her side is HER colour, which is the design's second semantic rule doing
        real work rather than decorating. `--ink-brand` on `--her-wash` is the
        pairing `contrastFailures` already sweeps for every persona and
        `accent.test.ts` sweeps for all eight built-in themes -- so a character
        somebody else wrote cannot make her own words unreadable here.
      */
      .bubble {
        position: relative;
        padding: var(--s3) var(--s4);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r4);
        background: var(--paper-2);
        font-size: var(--t-body);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
      }
      /*
        Take this turn. ON the bubble's top-right corner, on hover and on focus.

        Top, because that is where people already look for it. It was moved to
        the bottom for a measured reason — the last line of a wrapped bubble has
        room to spare and the first line is full by definition, so the bottom
        corner covers 0px of text against 2px at the top — and 2px is a sliver
        inside the corner radius, which is a smaller cost than a control sitting
        where the hand does not expect it.

        Straddling the corner, not inside it. Fully inside, a 21px button covers
        11px of the line beside it, which on "Bye." — a 56px bubble holding 30px
        of text — masks the last character. The alternative was reserving the
        button's width as padding on every bubble forever so that one of them
        can be hovered.

        `background: inherit` takes whichever surface its own bubble is painted
        with — `--her-wash` on her side, `--paper-2` on yours — so the part that
        overlaps reads as the bubble rather than as a hole in it. One
        declaration rather than a rule per side, and it cannot drift when either
        colour changes.
      */
      .bubble .copy {
        position: absolute;
        top: -7px;
        right: -7px;
        display: flex;
        padding: var(--s1);
        border: 0;
        /*
          Round, with an edge and a lift. Square-cornered and flat it read as a
          bump ON the bubble's own outline rather than as something resting on
          it — the shape has to say "separate object" precisely because it is
          painted in the bubble's own colour.
        */
        border-radius: var(--r-pill);
        background: inherit;
        box-shadow:
          var(--lift-0),
          0 0 0 1px var(--rule);
        color: var(--ink-3);
        cursor: default;
        opacity: 0;
        /* Untouchable while invisible, so it cannot take a click meant for the
           words underneath it. */
        pointer-events: none;
      }
      .bubble:hover .copy,
      .bubble:focus-within .copy {
        opacity: 1;
        pointer-events: auto;
      }
      .bubble .copy:hover {
        background: var(--paper-hover);
        color: var(--ink);
      }
      .bubble .copy svg {
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linejoin: round;
      }
      .run.her .bubble {
        background: var(--her-wash);
        border-color: transparent;
        color: var(--ink-brand);
      }
      /* The corner nearest the speaker is tightened. That is the whole tail. */
      .run.her .said > .bubble:last-of-type {
        border-bottom-left-radius: var(--r1);
      }
      .run.you .said > .bubble:last-of-type {
        border-bottom-right-radius: var(--r1);
      }
      .cut {
        margin-top: var(--s0);
        font-family: var(--narrow);
        font-size: var(--t-label);
        color: var(--warn-ink);
      }

      /* ---- the problem list, which is a report rather than a conversation --- */
      .report {
        background: var(--paper-2);
        border: var(--s-px) solid var(--rule);
        border-radius: var(--r3);
        padding: var(--s6);
      }
      .problem p,
      .lead {
        max-width: var(--reading);
      }
      .problem {
        margin: 0 0 var(--s5);
      }
      .problem .where {
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: var(--w-semibold);
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--red);
      }
      .problem p {
        margin: var(--s0) 0 0;
        font-size: var(--t-sm);
        white-space: pre-wrap;
      }
      .problem .subject {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
      }
      .lead {
        margin: 0 0 var(--s6);
        font-size: var(--t-sm);
        color: var(--ink-2);
      }
      /* Alone on the surface, it is the whole answer rather than an intro. */
      .lead:only-child {
        margin: 0;
      }
      /* Every empty surface says WHICH kind of empty it is. */
      .empty {
        max-width: 46ch;
        margin: var(--s7) auto;
        text-align: center;
        font-size: var(--t-sm);
        color: var(--ink-3);
      }

      /* ---- the strip along the bottom -------------------------------------- */
      .drawer {
        flex: none;
        height: 48px;
        display: flex;
        align-items: center;
        gap: var(--s5);
        padding: 0 var(--s6);
        background: var(--paper-2);
        border-top: var(--s-px) solid var(--rule);
      }
      .warn {
        display: flex;
        align-items: center;
        gap: var(--s2);
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--warn-ink);
        background: none;
        border: 0;
        padding: 0;
        cursor: default;
      }
      .warn .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--warn-line);
        flex: none;
      }

      /* The button treatment is `button.btn` in tokens.css — a box, told apart
         from the select beside it by fill and weight rather than by border. */
      /*
        HERS, not gold.

        `accent.ts` states the design's second semantic rule — *the accent is
        her*, derived from `colBody`, with no second place to set an app colour
        — and then this rule set one. The gold was the last of a chrome hue that
        file records as a migration reported finished and never made: the open
        tab, the card ring, a selected row and the search hit all take her
        colour, so the mark somebody sees most often was the only thing left
        arguing for a palette nothing else in the window uses.

        `--ink-brand` rather than `--her` or `--her-deep`, and which of the three
        is not a matter of taste. This ring is read against the PAGE, and
        `--ink-brand` is the one of them composed per scheme for exactly that:
        `--her` is her body, which measures about 1.7:1 on `--paper` and is not
        an indicator at all, and `--her-deep` is one value for both schemes
        because white is read against IT rather than it against anything —
        3.1:1 on a dark page, which clears by too little to be worth having.

        What makes it safe for a hue nobody has seen: `contrastFailures` checks
        `--ink-brand` against her own wash at 4.5:1 in both schemes and falls
        back to the built-in when it fails. `--paper` is lighter than that wash
        in light and darker than it in dark, so the measured pairing is the
        WORSE one either way — every character that can be worn clears 4.5:1
        here, against a bar of 3:1.
      */
      :focus-visible {
        outline: var(--s0) solid var(--ink-brand);
        outline-offset: 1px;
      }
      /*
        EVERY field is quiet at rest now, and the rule lives in `tokens.css`.

        This window used to answer it twice and differently: a `select` was
        transparent-until-hover, with a comment arguing that *"a column of grey
        dropdown chrome is the single biggest reason this window read as a form
        where the artifact reads as a document"*, and an `input[type='text']`
        two rules above it kept a resting border. The Machine tab's "Looking
        things up" group draws all three in one column — Workspace, Web search,
        Codex profile — so the mismatch was visible in a single glance and
        nothing about the three jobs justified it.

        What stays here is the CHEVRON, which is a `select`'s alone and needs
        room reserved for it on the right that no text field wants.
      */
      select {
        appearance: none;
        padding-right: var(--s6);
        padding-left: var(--s2);
        font-size: var(--t-body);
        /* Drawn rather than shipped: one token, both schemes. */
        background-image:
          linear-gradient(45deg, transparent 50%, currentColor 50%),
          linear-gradient(135deg, currentColor 50%, transparent 50%);
        background-position:
          right 13px top 50%,
          right 8px top 50%;
        background-size:
          5px 5px,
          5px 5px;
        background-repeat: no-repeat;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s3);
        align-items: center;
      }
      .note {
        margin: var(--s2) 0 0;
        font-size: var(--t-cap);
        color: var(--ink-3);
      }
      code {
        font-family: var(--mono);
        font-size: var(--t-data);
        overflow-wrap: anywhere;
        user-select: text;
      }
      mark {
        background: var(--gold-wash);
        color: var(--gold);
        border-radius: var(--r0);
      }
      /*
        What just happened. Gone in ten seconds, or sooner if you say so.

        It used to stay until the next write replaced it, which left the last
        thing you did sitting over the window for the rest of the session — and
        `#said:empty` was how it hid, which stopped working the moment it held a
        button. `[hidden]` in `tokens.css` does that job now, and it is a state
        the renderer sets rather than a side effect of the text being blank.

        IN the drawer, not floating over it. It was `position: fixed; bottom:
        56px`, which put a full-width bar eight pixels above the full-width bar
        the window already had. It keeps its own surface, which is what makes
        `.bad` tint the message rather than the whole status line.

        No elevation any more: it sits ON a surface now rather than over the
        document, and a shadow inside a bar reads as a seam.
      */
      #said {
        flex: 0 1 auto;
        min-width: 0;
        margin: 0;
        display: flex;
        align-items: center;
        gap: var(--s2);
        padding: var(--s1) var(--s2) var(--s1) var(--s4);
        border-radius: var(--r-pill);
        background: var(--paper);
        box-shadow: inset 0 0 0 1px var(--rule);
        font-size: var(--t-sm);
      }
      /*
        ONE line, with the rest in the tooltip.

        The drawer is a fixed 48px, so a message that wrapped would be clipped
        rather than shown — and the renderer sets `title` to the same text, so
        nothing is only half available.
      */
      #said-what {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #said-shut {
        flex: none;
        display: flex;
        padding: var(--s1);
        border: 0;
        border-radius: var(--r1);
        background: transparent;
        color: var(--ink-3);
        cursor: default;
      }
      #said-shut:hover {
        background: var(--paper-hover);
        color: var(--ink);
      }
      #said-shut svg {
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
      }
      #said.bad {
        color: var(--red);
        background: var(--red-bg);
        box-shadow: inset 0 0 0 1px var(--red);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!--
        One strip: who she is, where you are, and what this place needs.

        The tab bar was a second row under this one, which put two horizontal
