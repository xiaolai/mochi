        `.foot-do` stood here — a fourth vocabulary for a button.

        Five underlined words: no fill, no radius, a 1px bottom border. The
        delivery has ONE set of pills and says so in its own audit: "一套胶囊:
        实心=提交,描边=普通,虚线描边=毁灭性。下划线文字按钮全没了" — solid commits,
        outlined is ordinary, a dashed outline destroys, and underlined text
        buttons are gone. `button.btn`, `.primary` and `.bad` in `tokens.css`
        are already exactly those three.

        This is the second time this defect has been fixed. The rail's New and
        Duplicate were the same thing, and the same argument applies twice over:
        an underline is this window's mark for a field you can type in, so every
        control wearing one that is not a field is claiming to be one.
      */
    </style>
  </head>
  <body>
    <!--
      Two pages and a rail, which is the delivered architecture rather than a
      strip of three tabs. `dev-docs/design-system/STRUCTURE.md` records where
      each number here comes from; the short version is that this window is one
      document about somebody, and the machine is a different document that gets
      its own page because it is not about her.
    -->
    <div id="app">
      <!--
        NO STRIP ACROSS THE TOP.

        There was one: the application's mark, its name, whether she was awake,
        the key that changes that, and a microphone indicator. It was a second
        title bar under the operating system's own, and every fact on it is said
        better elsewhere — the name by the real title bar, her state and the key
        by the tray, and the microphone by her halo, which `halo.ts` argues for
        precisely because a strip in a window that is shut almost always is only
        true for whoever is looking at it.

        The rail is the first thing in this window now, which is what the
        delivered design draws.
      -->
      <div class="frame">
        <!--
          The rail is the window's table of contents and it is always present:
          who exists, and the machine underneath them. A character list that
          only appears on one tab is a list you have to navigate to in order to
          find out what you could navigate to.
        -->
        <nav class="rail" aria-label="Characters, and this machine">
          <p class="rail-head" id="characters-count"></p>
          <div class="rail-cast" id="characters"></div>
          <div class="rail-make" id="cast-actions"></div>
          <div class="rail-foot">
            <div class="rail-rule"></div>
            <!--
              A TILE AND A NAME, the same shape as a character's row.

              `Rail.dc.html` draws it that way — a 30px rounded tile with a
              square outline in it, then "This machine" at 14/500 — and the shape
              is the argument: this row is one more thing you can be standing
              on, so it is built like the rows above it and marked current the
              same way.

              It carried two extra lines: a mono `#machine-check` sub-line and a
              two-line paragraph reading "keys · hearing · folders / true whoever
              is worn". Both were explaining the destination from the rail, in a
              column whose other rows say a name and nothing else, and the second
              is prose in a table of contents. The machine's own page says the
              same sentence under its title, where somebody who has arrived can
              read it.
            -->
            <button class="rail-row rail-machine" id="rail-machine" type="button">
              <span class="rail-tile" aria-hidden="true"></span>
              <span class="rail-name">This machine</span>
            </button>
          </div>
        </nav>

        <main class="main">
          <!-- Her page: one subject, three numbered views of it. -->
          <section class="page hers" id="page-hers">
            <header class="head">
              <!--
                The subject row: her face, her name, and — when it is what she
                has said you are looking at — the search field, pushed to the
                far end of the same line.

                Search is ON THIS ROW and not on one of its own. It searches
                everything she has ever said, so its subject is her, and her
                name is what says which "her". A row of its own under the views
                made it look like a control belonging to the view rather than a
                question about the character, and gave the head three rules to
                cross instead of two.
              -->
              <div class="subject-row">
                <div class="subject-of" id="subject"></div>
                <span class="grow"></span>
                <div class="finding" id="finding" hidden>
                  <span class="finding-mark" aria-hidden="true">&#8981;</span>
                  <input
                    id="q"
                    type="search"
                    placeholder="Search everything ever said"
                    autocomplete="off"
                  />
                </div>
              </div>
              <nav class="views" id="views" role="tablist" aria-label="Her page"></nav>
              <!-- The day strip, under the views and above the rule. Its own
                   row in the delivery, and the only thing in this one. -->
              <div class="view-head" id="view-head">
                <div class="daystrip" id="calendar" hidden></div>
              </div>
            </header>
            <div class="spread" id="spread">
              <!--
                THE DAY'S CONVERSATIONS, in a column of their own.

                They were stacked above the transcript inside the reading
                column, on the argument that "a transcript above the thing that
                chose it reads as two unrelated columns". That is true of a
                stack and the delivery answers it differently: side by side, the
                list is how you choose and the transcript is what you chose, and
                neither has to scroll past the other to be reached.

                It is a sibling of `.reading` rather than a child so it can BE a
                track — the archive is the one page with three columns competing,
                and 232 + 368 + (32 + 616 + 32) is what closes at 1280.
              -->
              <div class="list" id="list" hidden></div>
              <!--
                One reading column, three possible bodies — one per view. They
                are separate elements rather than one that is rebuilt, so a
                transcript survives a trip to her sheet and back, and so the
                search results are not thrown away by a repaint of somewhere
                else.
              -->
              <div class="reading" id="reading">
                <div id="pane" hidden></div>
                <div class="talk" id="talk" hidden></div>
                <div id="permits" hidden></div>
              </div>
              <!--
                The margin. Apparatus lives here and nothing you came to read
                does: "Nothing to the right of the rule is a thing you came to
                read."
              -->
              <aside class="margin" id="margin">
                <div id="margin-hers" hidden></div>
                <!-- The capability descriptions: what she is told she CAN do,
                     which is apparatus about the switches beside it. -->
                <div id="margin-permits" hidden></div>
              </aside>
            </div>
          </section>

          <!-- This machine: its own page, its own mark, none of her colour. -->
          <section class="page machine" id="page-machine" hidden>
            <header class="head">
              <div class="machine-subject">
                <span class="machine-mark" aria-hidden="true"></span>
                <div class="machine-titles">
                  <h1>This machine</h1>
                  <p class="machine-says">These settings apply whoever she is.</p>
                </div>
              </div>
            </header>
            <div class="machine-spread">
              <nav class="groups" id="nav-groups" aria-label="Groups"></nav>
              <div class="machine-pane" id="machine-pane"></div>
            </div>
          </section>
          <!--
          INSIDE THE PAGE COLUMN, not across the whole window.

          It was a sibling of `.frame`, so the bar ran the full 1280 and its left
          edge sat under the rail — a receipt about the page beginning in a strip
          that belongs to the window's table of contents. Every artboard draws it
          as the last child of the column right of the rail, starting at the same
          32px gutter the reading column starts at, which is what makes it read
          as the foot of THIS page rather than as a separate surface.

          What just happened, and whether anything has gone wrong, both always in
          the same place.

          This was a toast that appeared and faded, plus a chip in a drawer. A
          message that removes itself is one somebody can miss entirely, and the
          answer to "did that save?" should be readable a minute later rather than
          for four seconds after the fact.
        -->
          <div class="status" id="status">
            <!--
            THE ACTIONS ARE ON THE LEFT, which is A3's arrangement and A6's.

            They were on the right, after the receipt, so the archive's three
            controls sat in the corner the problem count already owns while the
            left half of a 1280px bar held one empty paragraph. The artboards give
            the left of this bar to whatever the view is doing — the receipt on her
            page, these on the archive — and the right to the two standing facts,
            how much is here and what has gone wrong.

            Only while what she has said is on screen: they act on conversations,
            and a delete control visible from her character sheet is one whose
            scope the surrounding page contradicts.

            EXPORT BEFORE DELETE, and the destructive pair last. Contract D3, and
            A3 draws the row in that order: a copy is offered before the thing it
            is a copy of can be destroyed.
          -->
            <button class="btn" id="pick" type="button" hidden>Select&#8230;</button>
            <button class="btn" id="pick-off" type="button" hidden>Cancel</button>
            <button class="btn" id="export" type="button" hidden>Export&#8230;</button>
            <button class="btn bad" id="drop-some" type="button" hidden disabled>Delete</button>
            <button class="btn bad" id="drop-hers" type="button" hidden>Delete all&#8230;</button>
            <p id="said" role="status" aria-live="polite">
              <span id="said-what"></span>
              <button id="said-shut" type="button" aria-label="Dismiss" title="Dismiss" hidden>
                <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
                  <path d="M4 4 12 12M12 4 4 12"></path>
                </svg>
              </button>
            </p>
            <span class="grow"></span>
            <!-- How much is in the archive. In the foot, where A3 and A6 draw it,
               rather than in the header beside the day strip: it is a standing
               fact about the list, not a heading over it. -->
            <p class="count-of" id="count" hidden></p>
            <button class="warn" id="troubles" type="button" hidden>
              <span class="dot"></span><span id="troubles-label"></span>
            </button>
          </div>
        </main>
      </div>
    </div>

    <!--
      WHAT HAS GONE WRONG, as a drawer from the status bar.

      It used to be painted into the archive's transcript pane, which meant
      reading it cost you your place: the button is in the strip along the
      bottom and visible from all three views, but the surface it wrote to lives
      inside one of them, so pressing it navigated somewhere else to say
      something about here.

      A `popover` rather than a panel, for the two things the user agent gives
      free and correctly: Escape closes it, and it is in the top layer, so it
      cannot be trapped under the pane it rises from. `tokens.css` already holds
      the rule that a closed one is not on screen whatever an author writes.
    -->
    <div id="troubles-drawer" popover="auto" aria-labelledby="troubles-head">
      <h2 id="troubles-head">What has gone wrong</h2>
      <div id="troubles-body"></div>
      <p class="note-mono">
        normally empty &#183; these happen during use, not at launch &#183; re-checked when this
        window comes back to the front
      </p>
    </div>

    <!--
      A SEPARATE surface, not a button that arms itself.

      The arming pattern used elsewhere here — click once to arm, again to do
      it — is defeated by a double-click, has no Escape, and re-reads live state
      on the second click, so a selection or a character that changed in between
      is silently what gets deleted. None of that is acceptable for the only
      irreversible action in the app.

      `<dialog>` is modal, traps focus, and closes on Escape without any of it
      being written here. What it says is a SNAPSHOT taken when it opened; the
      deletion uses that snapshot and nothing else.
    -->
    <dialog id="sure">
      <h2 id="sure-what"></h2>
      <p id="sure-why"></p>
      <div class="sure-do">
        <button class="btn" id="sure-no" type="button" autofocus>Keep them</button>
        <!--
          Export sits BEFORE the destructive button and after the safe one.

          The export path already existed and was reachable only from the
          toolbar, which is nowhere near the moment somebody wants it. This is
          the one point where the answer to "can I keep a copy first" decides
          whether the next click is recoverable.
        -->
        <button class="btn" id="sure-export" type="button">Save a copy first</button>
        <button class="btn bad" id="sure-yes" type="button">Delete</button>
      </div>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
