<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Settings</title>
    <!--
      The design language, in one file for all three windows. Every value in it
      is the handoff's, and the ratios in its comments were measured with this
      repository's own `contrast()` — so this is a link rather than a paste,
      because a second copy is a second thing to get wrong.
    -->
    <link rel="stylesheet" href="../design/tokens.css" />
    <style>
      /*
        2b, at 780 x 620: a nav column and one group at a time.

        Everything here is a token. That is not tidiness — the artifact
        (`Mochi Extended.dc.html`) renders against exactly this vocabulary, so a
        literal written here is a place the window and the design can drift
        without either of them looking wrong.
      */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        font: var(--t-ui) / 1.5 var(--sans);
        /* She is a companion, not a document. The paths and the values opt
           back into selection below; nothing else is text to drag over. */
        user-select: none;
      }
      #app {
        display: grid;
        grid-template-columns: 196px 1fr;
        height: 100%;
      }

      /* ---- the nav column -------------------------------------------------- */
      nav {
        background: var(--paper-2);
        border-right: 1px solid var(--rule);
        padding: var(--s3) 0;
        display: flex;
        flex-direction: column;
        gap: var(--s-px);
        overflow-y: auto;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: var(--s3);
        width: 100%;
        padding: var(--s2) var(--s4);
        border: 0;
        background: transparent;
        color: var(--ink-2);
        font: inherit;
        font-weight: 400;
        text-align: left;
        cursor: default;
      }
      .tab:hover {
        background: var(--hair-soft);
      }
      /*
        The CHROME marks the open group, not her.

        This took the worn persona's colour, which is the thing `accent.ts`
        argues against at length: her hue then repaints every control in the
        application, so installing a character installs a UI theme. Gold is
        fixed; her colour keeps the two jobs that are about her.

        The bar carries the boundary and the wash carries the tint — a wash dark
        enough to read as an edge on warm paper would be too dark for gold to
        sit on. See `tokens.css` for the measurements.
      */
      .tab[aria-current='true'] {
        background: var(--gold-wash);
        box-shadow: inset 2px 0 0 var(--gold);
        color: var(--gold);
        font-weight: 600;
      }
      .tab .grow {
        flex: 1;
      }
      /*
        A dot means somebody should LOOK, and only two things earn one: a key
        another application took, and a Codex CLI that is not installed. A
        withheld grant is a decision, and a dot on a decision is how a dot stops
        being worth looking at.
      */
      .tab .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--warn-line);
        flex: none;
      }
      .nav-note {
        margin: auto 0 0;
        padding: var(--s5) var(--s4) 0;
        font-size: var(--t-cap);
        color: var(--ink-3);
      }

      /* ---- the pane -------------------------------------------------------- */
      main {
        overflow-y: auto;
        min-height: 0;
        padding: var(--s6) var(--s6) var(--s8);
        display: flex;
        flex-direction: column;
        gap: var(--s6);
      }
      main > * {
        max-width: 62ch;
      }
      /* Labels are always uppercase, and uppercase is always tracked. */
      h2,
      h3 {
        margin: 0;
        font-family: var(--narrow);
        font-size: var(--t-label);
        font-weight: 700;
        letter-spacing: var(--track);
        text-transform: uppercase;
        color: var(--ink-3);
      }
      h2 {
        font-size: var(--t-data);
      }

      /* ---- controls -------------------------------------------------------- */
      .field {
        display: grid;
        grid-template-columns: 152px 1fr;
        align-items: center;
        gap: var(--s4);
        padding: var(--s3) 0;
        border-bottom: 1px solid var(--rule);
      }
      .field > label {
        color: var(--ink-2);
      }
      select,
      input[type='text'] {
        width: 100%;
        padding: var(--s2) var(--s4);
        border: 1px solid var(--rule);
        border-radius: var(--r2);
        background: var(--paper-2);
        color: inherit;
        font: inherit;
      }
      input[type='text'] {
        user-select: text;
      }
      select:focus-visible,
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 1px;
      }
      button {
        padding: var(--s1) var(--s4);
        border: 1px solid var(--rule);
        border-radius: var(--r2);
        background: var(--paper-2);
        color: inherit;
        font: inherit;
        font-size: var(--t-sm);
        cursor: default;
      }
      button:hover:not(:disabled) {
        border-color: var(--gold);
      }
      button:disabled {
        color: var(--ink-3);
      }
      .switch {
        display: flex;
        align-items: center;
        gap: var(--s3);
      }
      .note {
        margin: var(--s2) 0 0;
        font-size: var(--t-cap);
        color: var(--ink-3);
      }
      .note.bad {
        color: var(--red);
      }
      code {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--ink-3);
        overflow-wrap: anywhere;
        user-select: text;
      }

      /* ---- 5b, the standing grants ----------------------------------------- */
      .grant {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--s5);
        padding: var(--s4) 0;
        border-bottom: 1px solid var(--rule);
      }
      .grant .name {
        font-size: var(--t-body);
      }
      .grant .desc {
        margin: var(--s0) 0 0;
        font-size: var(--t-sm);
        color: var(--ink-2);
      }
      .grant .right {
        flex: none;
        text-align: right;
      }
      .grant .used {
        margin-top: var(--s1);
        font-family: var(--mono);
        font-size: var(--t-label);
        color: var(--ink-3);
      }
      /* A capability, drawn as data — because a tool name is data. */
      .cap {
        padding: var(--s3) 0;
        border-bottom: 1px solid var(--rule);
      }
      .cap .name {
        font-family: var(--mono);
        font-size: var(--t-data);
        color: var(--gold);
      }
      .cap .desc {
        margin: var(--s0) 0 0;
        font-size: var(--t-sm);
        color: var(--ink-2);
      }
      .folder {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s5);
        padding: var(--s3) 0;
        border-bottom: 1px solid var(--rule);
      }
      .refused {
        font-size: var(--t-label);
        color: var(--red);
      }

      /*
        Says what happened, over the pane it happened in. Its own opaque surface
        with an elevation — the handoff's structural rule, and the one that
        holds whatever is behind it.
      */
      #said {
        position: fixed;
        left: calc(196px + var(--s5));
        right: var(--s5);
        bottom: var(--s5);
        margin: 0;
        padding: var(--s3) var(--s5);
        border-radius: var(--r2);
        background: var(--paper-2);
        box-shadow: var(--lift-1);
        font-size: var(--t-sm);
      }
      #said.bad {
        color: var(--red);
        background: var(--red-bg);
      }
      #said:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <nav id="nav"></nav>
      <main id="pane"></main>
    </div>
    <p id="said" role="status" aria-live="polite"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
